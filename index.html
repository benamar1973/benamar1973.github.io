<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>خدماتي - بوابة الدفع</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%); font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        .main-card { background: #ffffff; border-radius: 35px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 10px; }
        .share-btn { background: #25D366; color: white; border: none; padding: 6px 15px; border-radius: 50px; font-size: 14px; font-weight: bold; cursor: pointer; margin-right: 10px; }
        
        .auth-section {
            background: #f8f9fa;
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .auth-section input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 40px;
            font-size: 14px;
        }
        .auth-section button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-login { background: #0f3460; color: white; }
        .btn-signup { background: #e94560; color: white; }
        .btn-logout { background: #dc3545; color: white; }
        .btn-resend { background: #ffc107; color: #1a1a2e; margin-top: 5px; }
        .user-info { text-align: center; margin: 10px 0; color: #0f3460; font-weight: bold; }
        
        .warning-msg {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            border-right: 5px solid #ffc107;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .icon-btn {
            background: white;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 5px;
        }
        .icon-btn:active { transform: scale(0.96); background: #f8f9fa; }
        .icon-btn i { font-size: 28px; display: block; margin-bottom: 5px; color: #2c3e50; }
        .icon-btn span { font-size: 11px; font-weight: 600; color: #2c3e50; display: block; margin-top: 5px; }
        
        .img-frame {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        
        .img-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 35px; padding: 20px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 40px; font-size: 14px; }
        .modal-content button { background: #28a745; color: white; padding: 12px; border: none; border-radius: 40px; font-size: 16px; margin-top: 10px; cursor: pointer; width: 100%; }
        .scan-btn { background: #0f3460; }
        .close-modal { background: #dc3545; margin-top: 5px; }
        
        .footer-links { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; padding: 10px; border-top: 1px solid #eee; }
        .footer-links a { color: #0f3460; text-decoration: none; font-size: 12px; }
        
        footer { text-align: center; margin-top: 20px; padding: 15px; color: #000000; font-size: 12px; font-weight: bold; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2c3e; color: white; padding: 8px 16px; border-radius: 30px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="header">
            <button class="share-btn" onclick="shareApp()">📤 شارك التطبيق</button>
            <h1>خدماتي الجزائر</h1>
        </div>

        <div id="authSection" class="auth-section">
            <input type="email" id="email" placeholder="البريد الإلكتروني (Gmail)">
            <input type="password" id="password" placeholder="كلمة المرور">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور (للحساب الجديد)">
            <button id="loginBtn" class="btn-login">تسجيل الدخول</button>
            <button id="signupBtn" class="btn-signup">إنشاء حساب جديد</button>
            <div id="authStatus" style="text-align:center; margin-top:10px; color:#e94560;"></div>
        </div>

        <div id="appSection" style="display: none;">
            <div class="user-info" id="userEmailDisplay"></div>
            
            <div id="verifyWarning" class="warning-msg" style="display: none;">
                ⚠️ <strong>تنبيه هام:</strong> يرجى <strong>تفقد مجلد Spam (البريد العشوائي)</strong> في حساب Gmail الخاص بك.<br>
                إذا لم تجد رسالة التأكيد، اضغط على زر "إعادة إرسال رابط التأكيد" أدناه.
                <button id="resendVerifyBtn" class="btn-resend" style="display: block; margin: 10px auto 0; width: auto;">📧 إعادة إرسال رابط التأكيد</button>
            </div>
            
            <button id="logoutBtn" class="btn-logout" style="width: 100%; margin-bottom: 20px;">🚪 تسجيل الخروج</button>
            
            <div class="grid" id="allServicesGrid"></div>
        </div>

        <div class="footer-links">
            <a href="about.html">📖 من نحن</a>
            <a href="contact.html">📞 اتصل بنا</a>
            <a href="privacy.html">🔒 سياسة الخصوصية</a>
            <a href="terms.html">📜 شروط الخدمة</a>
        </div>
        <footer><p>🇩🇿 خدماتي - جميع الحقوق محفوظة</p></footer>
    </div>
</div>

<!-- نافذة إدخال بيانات الدفع -->
<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">دفع الخدمة</h3>
        <div id="serviceNameDisplay" style="margin-bottom: 10px; font-weight: bold; color: #e94560;"></div>
        
        <div id="electriciteEauFields" style="display: none;">
            <select id="billType">
                <option value="electricite">⚡ كهرباء (SONELGAZ)</option>
                <option value="eau">💧 ماء (SEAAL)</option>
            </select>
            <input type="text" id="contractNumber" placeholder="رقم العقد / رقم العميل *">
            <input type="text" id="invoiceNumber" placeholder="رقم الفاتورة *">
            <input type="text" id="ebbNumber" placeholder="رقم EBB (خاص بالكهرباء)">
            <input type="number" id="amount" placeholder="المبلغ *">
        </div>
        
        <div id="mobileFields" style="display: none;">
            <input type="tel" id="phoneNumber" placeholder="رقم الهاتف *">
            <input type="number" id="mobileAmount" placeholder="المبلغ *">
        </div>
        
        <div id="algerieFields" style="display: none;">
            <input type="text" id="accountNumber" placeholder="رقم الهاتف أو رقم العقد *">
            <input type="number" id="algerieAmount" placeholder="المبلغ *">
        </div>
        
        <button id="scanBtn" class="scan-btn" style="display: none;">📷 مسح رمز الفاتورة (Data Matrix)</button>
        <button id="payBtn">💳 دفع عبر Chargily Pay</button>
        <button id="closeModalBtn" class="close-modal">❌ إلغاء</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
        authDomain: "khadamati-dz-28051.firebaseapp.com",
        projectId: "khadamati-dz-28051",
        storageBucket: "khadamati-dz-28051.firebasestorage.app",
        messagingSenderId: "689071750342",
        appId: "1:689071750342:web:10c232ebb79149385dabc7"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const verifyWarning = document.getElementById('verifyWarning');
    const resendVerifyBtn = document.getElementById('resendVerifyBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');
    const allServicesGrid = document.getElementById('allServicesGrid');

    const allServices = [
        { name: 'دفع فاتورة الكهرباء', img: 'SONELGAZ.png', url: 'https://epayement.elit.dz/payementFacture.xhtml' },
        { name: 'دفع فاتورة الماء', img: 'SEAAL.png', url: 'https://fatourati.seaal.dz/' },
        { name: 'mobilis', img: 'MOBILIS.png', url: 'https://e-paiement.mobilis.dz/' },
        { name: 'DJEZZY', img: 'DJEZZY.png', url: 'https://moncompte.djezzy.dz/fr/guest/recharge' },
        { name: 'Ooredoo', img: 'OOREDOO.png', url: 'https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar' },
        { name: 'تسديد فاتورة الهاتف وشحن الانترنت', img: 'ALGERIE TELECOM.png', url: 'https://paiement.at.dz/AR/index.php?p=internet_recharge&pr=in' },
        { name: 'منحة البطالة', img: 'ANEM.png', url: 'https://minha.anem.dz/pre_inscription' },
        { name: 'تجنيد الجيش', img: 'الجيش الوطني.png', url: 'https://preinscription.mdn.dz/' },
        { name: 'فضاء الأولياء', img: 'فضاء الاولياء.png', url: 'https://awlyaa.education.dz/login' },
        { name: 'سكنات عدل', img: 'AADEL.png', url: 'https://www.aadl.dz' },
        { name: 'وسيط ANEM', img: 'ANEM.png', url: 'https://wassitonline.anem.dz' },
        { name: 'التكوين المهني', img: 'التكوين-المهني.png', url: 'https://takwin.dz' },
        { name: 'المخيم الشبابي', img: 'المخيم-الشبابي.png', url: 'https://youthcamp.mjeunesse.gov.dz' },
        { name: 'التصريح بضياع وثائق', img: 'POLICE.png', url: 'https://www.dgsn.dz/e-declaration/' },
        { name: 'CCP', img: 'CCP.png', url: 'https://eccp.poste.dz' },
        { name: 'قسيمة السيارات', img: 'مديرية-الضرائب.png', url: 'https://qassimatouka.mf.gov.dz/home' },
        { name: 'شهادة عدم الانتساب', img: 'CNAS.png', url: 'https://elhanaa.cnas.dz/attestation_no_affiliation.xhtml' },
        { name: 'دفع الاشتراك', img: 'CASNOS.jpeg', url: 'https://damancom.casnos.dz/public-space' },
        { name: 'الفروض والإمتحانات', img: 'DZEXAMIN.png', url: 'https://www.dzexams.com/' },
        { name: 'شراء العجلات', img: 'NAFTAL.png', url: 'https://e-mahata.naftal.dz/' }
    ];

    function displayAllServices() {
        allServicesGrid.innerHTML = '';
        allServices.forEach(service => {
            const div = document.createElement('div');
            div.className = 'icon-btn';
            div.onclick = () => window.open(service.url, '_blank');
            
            const frame = document.createElement('div');
            frame.className = 'img-frame';
            
            const img = document.createElement('img');
            img.src = service.img;
            img.alt = service.name;
            img.onerror = () => {
                img.style.display = 'none';
                const i = document.createElement('i');
                i.innerText = '📌';
                i.style.fontSize = '28px';
                i.style.display = 'block';
                frame.appendChild(i);
            };
            frame.appendChild(img);
            div.appendChild(frame);
            
            const span = document.createElement('span');
            span.innerText = service.name;
            div.appendChild(span);
            allServicesGrid.appendChild(div);
        });
    }
    displayAllServices();

    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = 'none';
            appSection.style.display = 'block';
            userEmailDisplay.innerHTML = `👤 مرحباً ${user.email}`;
            authStatus.innerText = '';
            if (user.emailVerified) {
                verifyWarning.style.display = 'none';
            } else {
                verifyWarning.style.display = 'block';
            }
        } else {
            authSection.style.display = 'block';
            appSection.style.display = 'none';
            emailInput.value = '';
            passwordInput.value = '';
            confirmInput.value = '';
            authStatus.innerText = '';
            verifyWarning.style.display = 'none';
        }
    });

    loginBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        if (!email || !password) {
            authStatus.innerText = '❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور';
            return;
        }
        try {
            await signInWithEmailAndPassword(auth, email, password);
            authStatus.innerText = '✅ تم تسجيل الدخول بنجاح';
        } catch (error) {
            let msg = '❌ ';
            if (error.code === 'auth/user-not-found') msg += 'المستخدم غير موجود';
            else if (error.code === 'auth/wrong-password') msg += 'كلمة المرور غير صحيحة';
            else msg += error.message;
            authStatus.innerText = msg;
        }
    });

    signupBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const confirm = confirmInput.value.trim();
        if (!email || !password || !confirm) {
            authStatus.innerText = '❌ الرجاء ملء جميع الحقول';
            return;
        }
        if (password !== confirm) {
            authStatus.innerText = '❌ كلمتا المرور غير متطابقتين';
            return;
        }
        if (password.length < 6) {
            authStatus.innerText = '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            return;
        }
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await sendEmailVerification(userCred.user);
            authStatus.innerHTML = '✅ تم إنشاء الحساب! تم إرسال رابط التأكيد إلى بريدك الإلكتروني.<br>⚠️ <strong>يرجى تفقد مجلد Spam (البريد العشوائي)</strong> jika tidak menemukan pesan di kotak masuk.';
        } catch (error) {
            let msg = '❌ ';
            if (error.code === 'auth/email-already-in-use') msg += 'البريد الإلكتروني مستخدم بالفعل';
            else msg += error.message;
            authStatus.innerText = msg;
        }
    });

    resendVerifyBtn.addEventListener('click', async () => {
        const user = auth.currentUser;
        if (user && !user.emailVerified) {
            await sendEmailVerification(user);
            showToast('✅ تم إعادة إرسال رابط التأكيد. يرجى تفقد صندوق الوارد أو مجلد Spam.', false);
        } else {
            showToast('⚠️ بريدك الإلكتروني مؤكد بالفعل', true);
        }
    });

    logoutBtn.addEventListener('click', async () => {
        await signOut(auth);
    });

    function shareApp() {
        if (navigator.share) {
            navigator.share({ title: 'خدماتي', url: 'https://benamar1973.github.io/' });
        } else {
            navigator.clipboard.writeText('https://benamar1973.github.io/');
            alert('تم نسخ الرابط 📋');
        }
    }
    window.shareApp = shareApp;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#c53030' : '#28a745';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }
    window.showToast = showToast;
</script>
</body>
</html>
