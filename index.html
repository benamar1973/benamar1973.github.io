<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e,#16213e);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
        .top-bot-bar{width:100%;max-width:650px;margin:0 auto 20px;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:80px;padding:20px 30px;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.3);animation:glow 2s infinite}
        @keyframes glow{0%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}50%{box-shadow:0 10px 40px rgba(0,123,255,0.6)}100%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}}
        .top-bot-text{font-size:2rem;font-weight:bold;color:white;display:flex;align-items:center;justify-content:center;gap:15px}
        .top-bot-sub{font-size:0.9rem;color:rgba(255,255,255,0.9);margin-top:8px}
        .container{max-width:550px;width:100%}
        .card{background:white;border-radius:35px;padding:25px 20px;text-align:center;box-shadow:0 20px 35px rgba(0,0,0,0.2)}
        .auth-input{width:100%;padding:14px;margin:10px 0;border-radius:50px;border:1px solid #ddd;text-align:center}
        .btn{background:#007bff;color:white;border:none;border-radius:50px;padding:14px;width:100%;font-weight:bold;cursor:pointer;margin:8px 0}
        .btn-logout{background:#dc3545}
        .marketplace-link-btn{background:linear-gradient(135deg,#6f42c1,#8b5cf6);color:white;border:none;border-radius:50px;padding:12px;width:100%;cursor:pointer;margin-top:10px}
        .user-info{background:#e8f0fe;border-radius:25px;padding:15px;margin:15px 0}
        .user-name{font-size:24px;font-weight:bold;color:#0f3460}
        .chat-fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;z-index:10000;display:flex;flex-direction:column;transform:translateY(100%);transition:0.3s;direction:rtl}
        .chat-fullscreen.open{transform:translateY(0)}
        .chat-header{background:linear-gradient(135deg,#007bff,#0056b3);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
        .close-btn{background:none;border:none;color:white;font-size:2rem;cursor:pointer}
        .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
        .bot-msg,.user-msg{padding:12px 16px;border-radius:20px;max-width:85%;word-wrap:break-word}
        .bot-msg{background:#e3f2fd;align-self:flex-start}
        .user-msg{background:#d4edda;align-self:flex-end}
        .user-msg-img,.user-msg-video{background:#d4edda;align-self:flex-end;border-bottom-left-radius:5px;padding:8px 12px;max-width:85%}
        .user-msg-img img,.user-msg-video video{max-width:200px;max-height:200px;border-radius:12px}
        .input-area{background:white;padding:12px;display:flex;gap:10px;flex-wrap:wrap}
        #chatInput{flex:1;border:1px solid #ccc;border-radius:30px;padding:12px}
        #sendBtn{background:#28a745;color:white;border:none;border-radius:30px;padding:0 25px;cursor:pointer}
        #mediaUploadBtn{background:#007bff;color:white;border:none;border-radius:30px;padding:0 20px;cursor:pointer;display:none}
        #mediaInput{display:none}
        .contact-buttons{display:flex;gap:10px;justify-content:center;margin:10px 0}
        .contact-btn{background:#25D366;color:white;border:none;border-radius:50px;padding:10px 20px;cursor:pointer}
        .contact-btn.messenger{background:#0084ff}
        .contact-btn.phone{background:#34b7f1}
        .confirm-buttons{display:flex;gap:10px;justify-content:center;margin:10px 0}
        .confirm-yes{background:#28a745;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .confirm-no{background:#dc3545;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .edit-btn{background:#ffc107;border:none;border-radius:50px;padding:6px 15px;cursor:pointer}
        .icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:white;border-radius:20px;padding:16px;margin:10px 0}
        @media(min-width:550px){.icon-grid{grid-template-columns:repeat(3,1fr)}}
        .icon-item{background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:20px;padding:12px 8px;cursor:pointer;text-align:center;border:2px solid #dee2e6;transition:all 0.3s}
        .icon-item:hover{transform:translateY(-5px);border-color:#007bff}
        .icon-item img{width:55px;height:55px;object-fit:contain;border-radius:12px;margin-bottom:6px}
        .main-ad-icon{background:linear-gradient(135deg,#ff6b35,#f7931e);border-radius:20px;padding:25px 15px;cursor:pointer;text-align:center;margin:15px 0;border:3px solid #ffd700;transition:all 0.3s}
        .main-ad-icon:hover{transform:translateY(-8px) scale(1.02)}
        .main-ad-icon .main-icon-title{font-size:24px;font-weight:bold;color:white}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:9999;pointer-events:none}
        .footer-links{text-align:center;margin-top:20px;padding:10px;background:rgba(0,0,0,0.3);border-radius:20px;width:100%;max-width:550px}
        .footer-links a{color:white;text-decoration:none;margin:0 8px;font-size:12px}
        .facebook-preview{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-width:100%;margin:10px 0}
        .fb-header{display:flex;align-items:center;padding:12px;gap:10px}
        .fb-avatar{width:40px;height:40px;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
        .fb-name{font-weight:bold;font-size:14px}
        .fb-time{font-size:11px;color:#65676B}
        .fb-content{padding:0 12px 8px}
        .fb-media,.fb-media-video{width:100%;max-height:300px;object-fit:contain}
        .fb-contact{padding:10px;background:#f0f2f5;margin:8px;border-radius:8px;text-align:center}
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>

<div class="top-bot-bar" id="topBotBar">
    <div class="top-bot-text">🤖 بوت مصطفى ✨</div>
    <div class="top-bot-sub">خدمة الإعلانات · شحن · فواتير</div>
</div>

<div class="container">
    <div class="card">
        <div id="loginSection">
            <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني">
            <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
            <button id="marketplaceGuestBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
            <div id="loginMsg" style="color:red; margin-top:8px;"></div>
        </div>
        <div id="appSection" style="display: none;">
            <div class="user-info">
                <div class="user-name" id="userName"></div>
                <div id="paymentSection"></div>
            </div>
            <button id="marketplaceBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
            <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
        </div>
    </div>
</div>

<div class="footer-links">
    <a href="about.html">من نحن</a> | <a href="contact.html">اتصل بنا</a> | <a href="privacy.html">الخصوصية</a>
</div>

<div id="toast" class="toast"></div>

<div id="chatFullscreen" class="chat-fullscreen">
    <div class="chat-header">
        <span>🤖 بوت مصطفى</span>
        <button class="close-btn" id="closeChatBtn">✕</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
        <button id="mediaUploadBtn">📷 صورة/فيديو</button>
        <input type="file" id="mediaInput" accept="image/*,video/*">
        <button id="sendBtn">إرسال</button>
    </div>
</div>

<script>
    // ========== إعدادات Firebase ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
        authDomain: "khadamati-dz-28051.firebaseapp.com",
        projectId: "khadamati-dz-28051",
        storageBucket: "khadamati-dz-28051.firebasestorage.app",
        messagingSenderId: "689071750342",
        appId: "1:689071750342:web:7eafee1d6e372e285dabc7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ========== إعدادات Cloudinary ==========
    const CLOUDINARY_CLOUD_NAME = "dmeq8fu4i";
    const CLOUDINARY_UPLOAD_PRESET = "mustapha_preset";

    let currentUser = null;
    let isBotTyping = false;
    let pendingService = null;
    let pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null, mediaFile: null };

    // ========== الخدمات ==========
    const services = [
        { name: "📱 DJEZZY", img: "DJEZZY.png", url: "https://moncompte.djezzy.dz/fr/guest/recharge", description: "شحن رصيد هاتف دجازي", benefit: "🔹 فائدة: شحن الرصيد بسهولة", requirements: "📋 رقم هاتف + بطاقة ذهبية", steps: "1- اضغط الرابط\n2- أدخل رقم الهاتف\n3- اختر المبلغ\n4- أدخل بيانات الدفع" },
        { name: "📱 mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد موبيليس", benefit: "🔹 خدمة رسمية", requirements: "📋 رقم موبيليس + بطاقة", steps: "نفس الخطوات" },
        { name: "📱 Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد أوريدو", benefit: "🔹 خدمة E-Storm", requirements: "📋 رقم أوريدو + CIB", steps: "اختر شحن الرصيد ← أدخل الرقم ← اختر المبلغ ← ادفع" },
        { name: "⚡ فاتورة الكهرباء", img: "SONELGAZ.png", url: "https://epayement.elit.dz/payementFacture.xhtml", description: "دفع فاتورة الكهرباء والغاز", benefit: "🔹 دفع إلكتروني", requirements: "📋 رقم العقد (14 رقم)", steps: "أدخل رقم العقد ← اضغط دفع ← أدخل بيانات البطاقة" },
        { name: "💧 فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 منصة SEAAL", requirements: "📋 رقم المشترك", steps: "أدخل رقم المشترك ← اختر الفاتورة ← دفع" },
        { name: "🌐 شحن الانترنت", img: "ALGERIE TELECOM.png", url: "https://paiement.at.dz/index.php?p=internet_recharge&pr=in", description: "شحن رصيد الانترنت", benefit: "🔹 اتصالات الجزائر", requirements: "📋 رقم الهاتف الثابت", steps: "اضغط الرابط ← أدخل البيانات ← اختر المبلغ ← ادفع" }
    ];
    const AD_RULES = `📜 قوانين نشر الإعلانات:\n❌ لا إعلانات مخلة\n❌ لا عنف أو كراهية\n❌ لا منتجات ممنوعة\n✅ الإعلان حلال ومفيد\n⚠️ المخالفة تؤدي إلى الحظر.`;

    // ========== دوال مساعدة ==========
    function showToast(msg) { let t=document.getElementById('toast'); t.innerText=msg; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2500); }
    function addMessage(text, isUser) { let div=document.createElement('div'); div.className=isUser?'user-msg':'bot-msg'; div.innerText=text; document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function addMediaMessage(src, type, isUser) { let div=document.createElement('div'); div.className=isUser?(type==='image'?'user-msg-img':'user-msg-video'):'bot-msg'; if(type==='image'){let img=document.createElement('img'); img.src=src; img.style.maxWidth='200px'; div.appendChild(img);}else{let vid=document.createElement('video'); vid.src=src; vid.controls=true; vid.style.maxWidth='220px'; div.appendChild(vid);} document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function showTypingIndicator(){let d=document.createElement('div'); d.className='bot-msg'; d.id='typingIndicator'; d.innerHTML='<div style="display:flex;gap:4px"><span style="width:8px;height:8px;background:#888;border-radius:50%;animation:blink 1.4s infinite"></span><span style="width:8px;height:8px;background:#888;border-radius:50%;animation:blink 1.4s 0.2s infinite"></span><span style="width:8px;height:8px;background:#888;border-radius:50%;animation:blink 1.4s 0.4s infinite"></span></div>'; document.getElementById('messages').appendChild(d); d.scrollIntoView(); }
    function removeTypingIndicator(){let ind=document.getElementById('typingIndicator'); if(ind) ind.remove();}
    // أنيميشن بسيط
    const style = document.createElement('style');
    style.textContent = `@keyframes blink{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}`;
    document.head.appendChild(style);

    // ========== رفع إلى Cloudinary ==========
    async function uploadToCloudinary(base64Data) {
        try {
            showToast("🔄 جاري رفع الملف...");
            let blob = await fetch(base64Data).then(r=>r.blob());
            let fd = new FormData();
            fd.append('file', blob);
            fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            let res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {method:'POST', body:fd});
            let data = await res.json();
            if(data.secure_url) { showToast("✅ تم الرفع"); return data.secure_url; }
            else throw new Error("فشل الرفع");
        } catch(e) { showToast("❌ فشل الرفع"); throw e; }
    }

    // ========== نشر الإعلان النهائي ==========
    window.finalPublish = async () => {
        if(window.isPublishing) return;
        window.isPublishing = true;
        if(!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaBase64) {
            addMessage("⚠️ البيانات غير مكتملة", false);
            window.isPublishing = false;
            return;
        }
        if(!currentUser) { addMessage("⚠️ يرجى تسجيل الدخول", false); window.isPublishing = false; return; }
        addMessage("🚀 جاري نشر إعلانك...", false);
        showTypingIndicator();
        try {
            let imageUrl = await uploadToCloudinary(pendingAd.mediaBase64);
            await db.collection('ads').add({
                name: pendingAd.fullName,
                phone: pendingAd.phone,
                description: pendingAd.description,
                contactMethod: pendingAd.contactMethod,
                imageUrl: imageUrl,
                imageType: pendingAd.mediaType,
                userId: currentUser.uid,
                userEmail: localStorage.getItem('currentUserEmail') || '',
                date: firebase.firestore.FieldValue.serverTimestamp(),
                views: 0,
                likes: []
            });
            removeTypingIndicator();
            addMessage("✅ **تم نشر إعلانك بنجاح في سوق مصطفى!** 🎉\n\nرابط السوق: marketplace.html", false);
            pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null };
            document.getElementById('mediaUploadBtn').style.display = 'none';
        } catch(e) { removeTypingIndicator(); addMessage("⚠️ خطأ: "+e.message, false); }
        finally { window.isPublishing = false; }
    };

    // ========== دوال سير عمل الإعلان ==========
    function startAdFlow() {
        let subActive = true; // تبسيط: نعتبر الاشتراك مفعل
        if(!currentUser) { addMessage("⚠️ يرجى تسجيل الدخول أولاً", false); return; }
        addMessage(AD_RULES, false);
        setTimeout(() => {
            addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (الاسم واللقب):", false);
            pendingAd = { step: 'fullName', fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null };
            document.getElementById('mediaUploadBtn').style.display = 'inline-block';
        }, 1000);
    }
    function showMediaTypeChoice() {
        let div = document.createElement('div'); div.className = 'bot-msg';
        div.innerHTML = `<div>📸 اختر نوع الملف:</div><div class="contact-buttons"><button class="contact-btn" onclick="window.selectMediaType('image')">🖼️ صورة</button><button class="contact-btn messenger" onclick="window.selectMediaType('video')">🎬 فيديو</button></div>`;
        document.getElementById('messages').appendChild(div); div.scrollIntoView();
    }
    window.selectMediaType = (type) => {
        pendingAd.mediaTypeChoice = type;
        addMessage(`✅ تم اختيار ${type==='image'?'صورة':'فيديو'}`, false);
        addMessage(`🖼️ الآن قم برفع ${type==='image'?'الصورة':'الفيديو'} بالضغط على زر "📷 صورة/فيديو"`, false);
        pendingAd.step = 'media';
    };
    function showContactButtons() {
        let div = document.createElement('div'); div.className = 'bot-msg';
        div.innerHTML = `<div>📞 اختر وسيلة التواصل:</div><div class="contact-buttons"><button class="contact-btn" onclick="window.selectContactMethod('whatsapp')">💚 واتساب</button><button class="contact-btn messenger" onclick="window.selectContactMethod('messenger')">💬 مسنجر</button><button class="contact-btn phone" onclick="window.selectContactMethod('phone')">📱 هاتف</button></div>`;
        document.getElementById('messages').appendChild(div); div.scrollIntoView();
    }
    window.selectContactMethod = (method) => {
        pendingAd.contactMethod = method;
        let methodName = {whatsapp:'واتساب', messenger:'مسنجر', phone:'هاتف'}[method];
        addMessage(`✅ تم اختيار: ${methodName}`, false);
        setTimeout(() => { addMessage("📋 تم اكتمال البيانات! جاري عرض الملخص...", false); showSummaryWithEditOptions(); pendingAd.step = 'review'; }, 500);
    };
    function showSummaryWithEditOptions() {
        let contactText = pendingAd.contactMethod==='whatsapp'?`واتساب: ${pendingAd.phone}`:(pendingAd.contactMethod==='messenger'?`مسنجر: ${pendingAd.phone}`:`هاتف: ${pendingAd.phone}`);
        let summary = document.createElement('div');
        summary.innerHTML = `<div class="bot-msg">📋 مراجعة المعلومات:<br>👤 الاسم: ${pendingAd.fullName}<br>📞 الهاتف: ${pendingAd.phone}<br>📝 الوصف: ${pendingAd.description}<br>🖼️ نوع الملف: ${pendingAd.mediaTypeChoice==='image'?'صورة':'فيديو'}<br>💬 التواصل: ${contactText}<br><div class="confirm-buttons"><button class="confirm-yes" onclick="window.proceedToPreview()">✅ متابعة</button><button class="edit-btn" onclick="window.cancelAd()">❌ إلغاء</button></div></div>`;
        document.getElementById('messages').appendChild(summary); summary.scrollIntoView();
    }
    window.proceedToPreview = () => { if(pendingAd.fullName && pendingAd.phone && pendingAd.description && pendingAd.contactMethod && pendingAd.mediaBase64) showFacebookPreview(); else addMessage("⚠️ اكتمل البيانات", false); };
    window.cancelAd = () => { addMessage("🙂 تم إلغاء الإعلان.", false); pendingAd={step:null}; document.getElementById('mediaUploadBtn').style.display='none'; };
    function showFacebookPreview() {
        let previewDiv = document.createElement('div'); previewDiv.className = 'facebook-preview';
        let mediaHtml = pendingAd.mediaType==='image'? `<img class="fb-media" src="${pendingAd.mediaBase64}">` : `<video class="fb-media-video" src="${pendingAd.mediaBase64}" controls></video>`;
        previewDiv.innerHTML = `<div class="fb-header"><div class="fb-avatar">${pendingAd.fullName.charAt(0)}</div><div><div class="fb-name">${pendingAd.fullName}</div><div class="fb-time">الآن</div></div></div><div class="fb-content">${pendingAd.description}</div>${mediaHtml}<div class="fb-contact">${pendingAd.contactMethod==='whatsapp'?'💚 واتساب':(pendingAd.contactMethod==='messenger'?'💬 مسنجر':'📱 هاتف')} ${pendingAd.phone}</div><div class="confirm-buttons"><button class="confirm-yes" onclick="window.finalPublish()">✅ تأكيد النشر</button><button class="edit-btn" onclick="window.backToEdit()">✏️ تعديل</button><button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء</button></div>`;
        document.getElementById('messages').appendChild(previewDiv); previewDiv.scrollIntoView();
    }
    window.backToEdit = () => { let last = document.getElementById('messages').lastChild; if(last) last.remove(); showSummaryWithEditOptions(); };

    async function handleAdFlow(msg) {
        if(pendingAd.step === 'fullName') { if(msg.trim().length<3) { addMessage("❌ اسم قصير", false); return false; } pendingAd.fullName=msg.trim(); addMessage(`✅ الاسم: ${pendingAd.fullName}`, false); addMessage("📱 رقم الهاتف:", false); pendingAd.step='phone'; return true; }
        if(pendingAd.step === 'phone') { if(msg.length<9) { addMessage("❌ رقم غير صحيح", false); return false; } pendingAd.phone=msg.trim(); addMessage(`✅ رقم: ${pendingAd.phone}`, false); showMediaTypeChoice(); pendingAd.step='waitingMedia'; return true; }
        if(pendingAd.step === 'description') { if(msg.length<5) { addMessage("❌ وصف قصير", false); return false; } pendingAd.description=msg.trim(); addMessage("✅ تم الوصف", false); showContactButtons(); pendingAd.step='waitingContact'; return true; }
        return false;
    }

    // ========== معالجة رفع الملف ==========
    document.getElementById('mediaUploadBtn').onclick = () => document.getElementById('mediaInput').click();
    document.getElementById('mediaInput').onchange = async (e) => {
        let file = e.target.files[0];
        if(!file) return;
        let fileType = file.type;
        let mediaType = null;
        if(fileType.startsWith('image/')) mediaType='image';
        else if(fileType.startsWith('video/')) mediaType='video';
        else { showToast("❌ صورة أو فيديو فقط"); return; }
        if(pendingAd.mediaTypeChoice && pendingAd.mediaTypeChoice !== mediaType) { showToast(`❌ اخترت ${pendingAd.mediaTypeChoice==='image'?'صورة':'فيديو'} لكن المرفق ${mediaType==='image'?'صورة':'فيديو'}`); return; }
        let reader = new FileReader();
        reader.onload = (ev) => {
            pendingAd.mediaBase64 = ev.target.result;
            pendingAd.mediaType = mediaType;
            addMediaMessage(pendingAd.mediaBase64, mediaType, true);
            addMessage(`✅ تم استلام ${mediaType==='image'?'الصورة':'الفيديو'}`, false);
            setTimeout(() => { addMessage("📝 اكتب وصف الإعلان:", false); pendingAd.step='description'; }, 500);
        };
        reader.readAsDataURL(file);
        document.getElementById('mediaInput').value = '';
    };

    // ========== ردود البوت العامة ==========
    async function handleGeneralMessage(msg) {
        let lower = msg.toLowerCase();
        if(lower.includes('مرحب')) return "وعليكم السلام! أهلاً بك في بوت مصطفى.\n📢 للإعلانات اضغط الأيقونة البرتقالية.";
        if(lower.includes('شكر')) return "العفو! 🤍";
        return "📢 بوت مصطفى - اختر الخدمة من الأيقونات.";
    }

    // ========== أيقونات الخدمات ==========
    function buildIcons() {
        let container = document.createElement('div');
        let mainDiv = document.createElement('div'); mainDiv.className='main-ad-icon'; mainDiv.innerHTML='<span class="main-icon-title">📢 خدمة الإعلانات</span><div style="color:white">انشر إعلانك</div>'; mainDiv.onclick=startAdFlow; container.appendChild(mainDiv);
        let grid = document.createElement('div'); grid.className='icon-grid';
        services.forEach(s=>{ let item=document.createElement('div'); item.className='icon-item'; let img=document.createElement('img'); img.src=s.img; img.alt=s.name; img.onerror=()=>img.style.display='none'; let span=document.createElement('span'); span.innerText=s.name; item.appendChild(img); item.appendChild(span); item.onclick=()=>{ let msg=`📌 ${s.name}\n${s.description}\n${s.benefit}\n${s.requirements}\n${s.steps}\n❓ هل تريد فتح الرابط؟ (نعم/لا)`; addMessage(msg,false); pendingService=s; }; grid.appendChild(item); });
        container.appendChild(grid);
        return container;
    }
    async function initChat() {
        document.getElementById('messages').innerHTML='';
        addMessage("✨ أهلاً بك في بوت مصطفى ✨\n📢 خدمة الإعلانات هي الأساس.\nاختر الخدمة من الأيقونات.", false);
        document.getElementById('messages').appendChild(buildIcons());
    }

    // ========== الأحداث ==========
    document.getElementById('sendBtn').onclick = async () => {
        if(isBotTyping) return;
        let txt = document.getElementById('chatInput').value.trim();
        if(txt) addMessage(txt, true);
        document.getElementById('chatInput').value = '';
        if(pendingAd.step && pendingAd.step!=='waitingMedia' && pendingAd.step!=='waitingContact' && pendingAd.step!=='review') {
            if(!txt) return;
            isBotTyping=true; showTypingIndicator(); await new Promise(r=>setTimeout(r,500)); removeTypingIndicator(); await handleAdFlow(txt); isBotTyping=false; return;
        }
        if(pendingService) {
            let lower=txt.toLowerCase();
            if(lower==='نعم'||lower==='yes') { window.open(pendingService.url,'_blank'); addMessage(`✅ تم فتح ${pendingService.name}`, false); pendingService=null; }
            else if(lower==='لا') { addMessage("🙂 حسناً، اختر خدمة أخرى.", false); pendingService=null; }
            else addMessage("أجب بـ نعم أو لا", false);
            return;
        }
        if(!txt) return;
        isBotTyping=true; showTypingIndicator(); await new Promise(r=>setTimeout(r,800)); removeTypingIndicator(); let reply=await handleGeneralMessage(txt); addMessage(reply, false); isBotTyping=false;
    };
    document.getElementById('chatInput').addEventListener('keypress',(e)=>{if(e.key==='Enter') document.getElementById('sendBtn').click();});

    // ========== المصادقة ==========
    auth.onAuthStateChanged((u)=>{
        if(u) { currentUser=u; document.getElementById('loginSection').style.display='none'; document.getElementById('appSection').style.display='block'; document.getElementById('userName').innerHTML=`👤 ${localStorage.getItem('currentUserEmail')?.split('@')[0]||'مستخدم'}`; }
        else { currentUser=null; document.getElementById('loginSection').style.display='block'; document.getElementById('appSection').style.display='none'; }
    });
    document.getElementById('loginBtn').onclick = () => {
        let email = document.getElementById('emailInput').value.trim();
        if(!email) { document.getElementById('loginMsg').innerText='أدخل بريدك'; return; }
        auth.signInAnonymously().then(()=>{ localStorage.setItem('currentUserEmail',email); location.reload(); }).catch(e=>{ document.getElementById('loginMsg').innerText='خطأ في الدخول'; });
    };
    document.getElementById('logoutBtn').onclick = () => { auth.signOut(); localStorage.clear(); location.reload(); };
    document.getElementById('marketplaceGuestBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('marketplaceBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('topBotBar').onclick = () => { document.getElementById('chatFullscreen').classList.add('open'); if(document.getElementById('messages').children.length===0) initChat(); };
    document.getElementById('closeChatBtn').onclick = () => document.getElementById('chatFullscreen').classList.remove('open');
</script>
</body>
</html>
