<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .top-bot-bar {
            width: 100%;
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 80px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0% { box-shadow: 0 5px 20px rgba(0,123,255,0.3); }
            50% { box-shadow: 0 10px 40px rgba(0,123,255,0.6); }
            100% { box-shadow: 0 5px 20px rgba(0,123,255,0.3); }
        }
        .top-bot-text { font-size: 2.2rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .top-bot-sub { font-size: 0.9rem; color: rgba(255,255,255,0.9); margin-top: 8px; }
        .container { max-width: 550px; width: 100%; }
        .card { background: white; border-radius: 35px; padding: 25px 20px; text-align: center; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .auth-input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 50px; border: 1px solid #ddd; font-size: 16px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; border-radius: 50px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .marketplace-link-btn { background: linear-gradient(135deg, #6f42c1, #8b5cf6); color: white; border: none; border-radius: 50px; padding: 12px 20px; margin-top: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        .user-info { background: #e8f0fe; border-radius: 25px; padding: 15px; margin: 15px 0; }
        .user-name { font-size: 24px; font-weight: bold; color: #0f3460; }
        .sub-days { background: #fff3cd; border-radius: 40px; padding: 8px; margin: 10px 0; font-size: 14px; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
        .payment-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; border-radius: 50px; padding: 12px 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .chat-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 10000; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.3s; direction: rtl; }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .bot-msg, .user-msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .bot-msg { background: #e3f2fd; align-self: flex-start; border-bottom-right-radius: 5px; }
        .user-msg { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; }
        .media-gallery { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .media-item { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
        .media-item.active { border-color: #007bff; }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
        .media-item .delete-media { position: absolute; top: 2px; right: 2px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .main-badge { position: absolute; bottom: 2px; left: 2px; background: #ffc107; color: #333; padding: 2px 5px; border-radius: 10px; font-size: 9px; font-weight: bold; }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-wrap: wrap; }
        #chatInput { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px; font-size: 15px; }
        #sendBtn { background: #28a745; color: white; border: none; border-radius: 30px; padding: 0 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #mediaUploadBtn { background: #007bff; color: white; border: none; border-radius: 30px; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; }
        #mediaInput { display: none; }
        .contact-buttons { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
        .contact-btn { background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .contact-btn.messenger { background: linear-gradient(135deg, #0084ff, #0063d1); }
        .contact-btn.phone { background: linear-gradient(135deg, #34b7f1, #1c8ad9); }
        .confirm-buttons { display: flex; gap: 10px; margin: 10px 0; justify-content: center; flex-wrap: wrap; }
        .confirm-yes { background: #28a745; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .confirm-no { background: #dc3545; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: #ffc107; color: #333; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .main-ad-icon { background: linear-gradient(135deg, #ff6b35, #f7931e); border-radius: 20px; padding: 25px 15px; cursor: pointer; text-align: center; margin: 15px 0; border: 3px solid #ffd700; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .main-ad-icon:hover { transform: translateY(-8px) scale(1.02); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: 0.3s; z-index: 9999; font-weight: bold; pointer-events: none; }
        .footer-links { text-align: center; margin-top: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; max-width: 550px; width: 100%; }
        .footer-links a { color: white; text-decoration: none; margin: 0 8px; font-size: 13px; }
        .preview-card { background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin: 10px 0; width: 100%; }
        .preview-header { padding: 12px 16px; background: #f8f9fa; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e9ecef; }
        .preview-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #007bff, #00c6ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .preview-name { font-weight: bold; font-size: 1.1rem; color: #0f3460; }
        .preview-time { font-size: 0.7rem; color: #6c757d; }
        .preview-media { width: 100%; max-height: 400px; object-fit: cover; background: #000; }
        .preview-video { width: 100%; max-height: 400px; background: #000; }
        .preview-content { padding: 16px; font-size: 1rem; line-height: 1.5; color: #212529; }
        .preview-contact { padding: 10px 16px; background: #e9ecef; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .preview-buttons { padding: 8px 16px; color: #6c757d; font-size: 0.8rem; border-top: 1px solid #dee2e6; display: flex; gap: 20px; }
        .preview-thumbnails { display: flex; gap: 8px; padding: 12px; overflow-x: auto; background: #f8f9fa; border-top: 1px solid #e9ecef; }
        .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .preview-thumb.active { border-color: #007bff; }
        .preview-thumb-video { width: 70px; height: 70px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: pointer; border: 2px solid transparent; }
        .preview-thumb-video.active { border-color: #007bff; }
        @media (max-width: 480px) { .preview-thumb { width: 55px; height: 55px; } .media-item { width: 60px; height: 60px; } }
    </style>
</head>
<body>
    <div class="top-bot-bar" id="topBotBar">
        <div class="top-bot-text"><span>🤖</span><span>بوت مصطفى</span><span>✨</span></div>
        <div class="top-bot-sub">خدمة الإعلانات · شحن · فواتير</div>
    </div>
    <div class="container">
        <div class="card">
            <div class="version">⭐ بوت مصطفى · خدمة الإعلانات هي الأساس ⭐</div>
            <div id="loginSection">
                <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني" required>
                <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
                <button id="marketplaceGuestBtn" class="marketplace-link-btn" style="margin-top:10px;">🛒 دخول إلى سوق مصطفى (بدون تسجيل)</button>
                <div id="loginMsg" style="color:#e94560; margin-top:8px;"></div>
            </div>
            <div id="appSection" style="display: none;">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="sub-days" id="daysLeft"></div>
                    <div style="font-size:13px; color:#856404;" id="planText"></div>
                    <div id="paymentSection" style="margin-top:10px;"></div>
                </div>
                <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
                <button id="marketplaceBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
            </div>
        </div>
    </div>
    <div class="footer-links">
        <a href="about.html">📖 من نحن</a> |
        <a href="contact.html">📞 اتصل بنا</a> |
        <a href="privacy.html">🔒 سياسة الخصوصية</a> |
        <a href="terms.html">📜 الشروط والأحكام</a>
    </div>
    <div id="toast" class="toast"></div>
    <div id="chatFullscreen" class="chat-fullscreen">
        <div class="chat-header">
            <span>🤖 بوت مصطفى | خدمة الإعلانات</span>
            <button class="close-btn" id="closeChatBtn">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
            <button id="mediaUploadBtn">📷 رفع ملفات</button>
            <input type="file" id="mediaInput" accept="image/*,video/*" multiple>
            <button id="sendBtn">إرسال</button>
        </div>
    </div>
    <script>
        let currentUser = null;
        let step = null;
        let adData = { name: null, phone: null, desc: null, contact: null, mediaList: [], mainMediaIndex: 0 };
        
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }
        
        function addMessage(text, isUser) {
            let div = document.createElement('div');
            div.className = isUser ? 'user-msg' : 'bot-msg';
            div.innerText = text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
        
        function displayMediaGallery() {
            if (adData.mediaList.length === 0) return;
            let galleryDiv = document.createElement('div');
            galleryDiv.className = 'media-gallery';
            for (let i = 0; i < adData.mediaList.length; i++) {
                let media = adData.mediaList[i];
                let isMain = (i === adData.mainMediaIndex);
                let mediaDiv = document.createElement('div');
                mediaDiv.className = `media-item ${isMain ? 'active' : ''}`;
                mediaDiv.onclick = () => { adData.mainMediaIndex = i; displayMediaGallery(); };
                if (media.type === 'image') {
                    mediaDiv.innerHTML = `<img src="${media.url}"><button class="delete-media" onclick="event.stopPropagation(); removeMedia(${i})">✕</button>${isMain ? '<span class="main-badge">⭐ رئيسي</span>' : ''}`;
                } else {
                    mediaDiv.innerHTML = `<video src="${media.url}"></video><button class="delete-media" onclick="event.stopPropagation(); removeMedia(${i})">✕</button>${isMain ? '<span class="main-badge">⭐ رئيسي</span>' : ''}`;
                }
                galleryDiv.appendChild(mediaDiv);
            }
            let clearBtn = document.createElement('button');
            clearBtn.innerText = '🗑️ مسح الكل';
            clearBtn.style.background = '#dc3545';
            clearBtn.style.color = 'white';
            clearBtn.style.border = 'none';
            clearBtn.style.borderRadius = '20px';
            clearBtn.style.padding = '5px 15px';
            clearBtn.style.cursor = 'pointer';
            clearBtn.onclick = () => { adData.mediaList = []; adData.mainMediaIndex = 0; displayMediaGallery(); showToast("تم مسح جميع الملفات"); };
            galleryDiv.appendChild(clearBtn);
            let oldGallery = document.querySelector('.media-gallery');
            if (oldGallery) oldGallery.remove();
            document.getElementById('messages').appendChild(galleryDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
        
        function removeMedia(index) {
            adData.mediaList.splice(index, 1);
            if (adData.mainMediaIndex >= adData.mediaList.length) adData.mainMediaIndex = Math.max(0, adData.mediaList.length - 1);
            displayMediaGallery();
            showToast(`🗑️ تم حذف الملف`);
        }
        
        async function uploadFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    resolve({ url: e.target.result, type: file.type.startsWith('image/') ? 'image' : 'video' });
                };
                reader.readAsDataURL(file);
            });
        }
        
        function login() {
            let email = document.getElementById('emailInput').value.trim();
            if (!email.includes('@')) {
                document.getElementById('loginMsg').innerText = '❌ أدخل بريداً صحيحاً';
                return;
            }
            currentUser = email;
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('userName').innerHTML = `👤 ${email.split('@')[0]}`;
            let sub = localStorage.getItem(`sub_${currentUser}`);
            if (sub && Date.now() < parseInt(sub)) {
                document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${Math.ceil((parseInt(sub)-Date.now())/86400000)} يوم`;
                document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                document.getElementById('paymentSection').innerHTML = '';
            } else {
                document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
                document.getElementById('planText').innerHTML = '⚠️ يرجى الاشتراك';
                document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8','_blank')">📅 اشتراك سنوي 1000 دج</button></div>`;
            }
            showToast(`مرحباً ${email.split('@')[0]}`);
        }
        
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            step = null;
            showToast('تم تسجيل الخروج');
        }
        
        async function startAd() {
            addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (إجباري):", false);
            step = 'name';
            adData = { name: null, phone: null, desc: null, contact: null, mediaList: [], mainMediaIndex: 0 };
            document.getElementById('mediaUploadBtn').style.display = 'inline-block';
        }
        
        function showContacts() {
            let div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `<div>📞 **اختر وسيلة التواصل (إجباري):**</div><div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;"><button onclick="selectContact('whatsapp')" style="background:#25D366; color:white; border:none; border-radius:50px; padding:10px 20px; cursor:pointer;">💚 واتساب</button><button onclick="selectContact('messenger')" style="background:#0084ff; color:white; border:none; border-radius:50px; padding:10px 20px; cursor:pointer;">💬 مسنجر</button><button onclick="selectContact('phone')" style="background:#34b7f1; color:white; border:none; border-radius:50px; padding:10px 20px; cursor:pointer;">📱 هاتف</button></div>`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
        
        function selectContact(contact) {
            adData.contact = contact;
            let contactName = contact === 'whatsapp' ? 'واتساب' : (contact === 'messenger' ? 'مسنجر' : 'هاتف');
            addMessage(`✅ تم اختيار ${contactName}`, false);
            showPreview();
        }
        
        function showPreview() {
            let contactSymbol = adData.contact === 'whatsapp' ? '💚' : (adData.contact === 'messenger' ? '💬' : '📱');
            let contactName = adData.contact === 'whatsapp' ? 'واتساب' : (adData.contact === 'messenger' ? 'مسنجر' : 'هاتف');
            let mainMedia = adData.mediaList.length > 0 ? adData.mediaList[adData.mainMediaIndex] : null;
            let mainHtml = '';
            if (mainMedia) {
                if (mainMedia.type === 'image') mainHtml = `<img class="preview-media" src="${mainMedia.url}">`;
                else mainHtml = `<video class="preview-video" src="${mainMedia.url}" controls></video>`;
            } else {
                mainHtml = `<div style="background:#dee2e6; padding:30px; text-align:center; color:#6c757d;">📷 لا توجد وسائط</div>`;
            }
            let thumbnailsHtml = '';
            if (adData.mediaList.length > 1) {
                thumbnailsHtml = '<div class="preview-thumbnails">';
                for (let i = 0; i < adData.mediaList.length; i++) {
                    let m = adData.mediaList[i];
                    let isActive = i === adData.mainMediaIndex ? 'active' : '';
                    if (m.type === 'image') thumbnailsHtml += `<img src="${m.url}" class="preview-thumb ${isActive}" onclick="changeMainMedia(${i})">`;
                    else thumbnailsHtml += `<div class="preview-thumb-video ${isActive}" onclick="changeMainMedia(${i})">🎬</div>`;
                }
                thumbnailsHtml += '</div>';
            }
            let previewDiv = document.createElement('div');
            previewDiv.className = 'preview-card';
            previewDiv.innerHTML = `
                <div class="preview-header">
                    <div class="preview-avatar">${adData.name ? adData.name.charAt(0).toUpperCase() : '?'}</div>
                    <div><div class="preview-name">${adData.name || 'غير محدد'}</div><div class="preview-time">الآن · 🌍</div></div>
                </div>
                <div class="preview-content">${adData.desc || 'لا يوجد وصف'}</div>
                ${mainHtml}
                ${thumbnailsHtml}
                <div class="preview-contact">${contactSymbol} ${contactName}: ${adData.phone || 'غير محدد'}</div>
                <div class="preview-buttons"><span>👍 أعجبني</span><span>💬 تعليق</span><span>📤 مشاركة</span></div>
            `;
            document.getElementById('messages').appendChild(previewDiv);
            let btns = document.createElement('div');
            btns.className = 'confirm-buttons';
            btns.innerHTML = `
                <button class="confirm-yes" onclick="publishAd()">✅ تأكيد النشر</button>
                <button class="edit-btn" onclick="editAd()">✏️ تعديل الإعلان</button>
                <button class="confirm-no" onclick="cancelAd()">❌ إلغاء</button>
            `;
            document.getElementById('messages').appendChild(btns);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
        
        window.changeMainMedia = function(index) {
            adData.mainMediaIndex = index;
            let previewCard = document.querySelector('.preview-card');
            if (previewCard) previewCard.remove();
            let btns = document.querySelectorAll('.confirm-buttons');
            if (btns.length) btns[btns.length-1].remove();
            showPreview();
        };
        
        window.editAd = function() {
            let previewCard = document.querySelector('.preview-card');
            if (previewCard) previewCard.remove();
            let btns = document.querySelectorAll('.confirm-buttons');
            if (btns.length) btns[btns.length-1].remove();
            addMessage("✏️ **اختر ما تريد تعديله:**", false);
            let menuDiv = document.createElement('div');
            menuDiv.className = 'bot-msg';
            menuDiv.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <button onclick="editField('name')">📝 تعديل الاسم (الحالي: ${adData.name || 'غير محدد'})</button>
                    <button onclick="editField('phone')">📱 تعديل رقم الهاتف (الحالي: ${adData.phone || 'غير محدد'})</button>
                    <button onclick="editField('desc')">📄 تعديل الوصف (الحالي: ${(adData.desc || '').substring(0,30)}${adData.desc && adData.desc.length>30 ? '...' : ''})</button>
                    <button onclick="editField('contact')">💬 تعديل وسيلة التواصل (الحالي: ${adData.contact || 'غير محدد'})</button>
                    <button onclick="editField('media')">🖼️ تعديل الوسائط (إضافة/حذف)</button>
                    <button onclick="resumePreview()">🔙 العودة إلى المعاينة</button>
                </div>
            `;
            document.getElementById('messages').appendChild(menuDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            step = 'edit_menu';
        };
        
        window.editField = function(field) {
            let menuDiv = document.querySelector('.bot-msg:last-child');
            if (menuDiv && menuDiv.innerHTML.includes('اختر ما تريد تعديله')) menuDiv.remove();
            if (field === 'name') {
                addMessage("📝 أرسل الاسم الجديد:", false);
                step = 'edit_name';
            } else if (field === 'phone') {
                addMessage("📱 أرسل رقم الهاتف الجديد:", false);
                step = 'edit_phone';
            } else if (field === 'desc') {
                addMessage("📄 أرسل الوصف الجديد:", false);
                step = 'edit_desc';
            } else if (field === 'contact') {
                showContacts();
                step = 'edit_contact';
            } else if (field === 'media') {
                addMessage("🖼️ يمكنك الآن رفع ملفات إضافية أو حذف الموجودة من المعرض أعلاه.", false);
            }
        };
        
        window.resumePreview = function() {
            let menuDiv = document.querySelector('.bot-msg:last-child');
            if (menuDiv && menuDiv.innerHTML.includes('اختر ما تريد تعديله')) menuDiv.remove();
            showPreview();
            step = null;
        };
        
        function cancelAd() {
            addMessage("🙂 تم إلغاء الإعلان", false);
            step = null;
            adData = { name: null, phone: null, desc: null, contact: null, mediaList: [], mainMediaIndex: 0 };
            document.getElementById('mediaUploadBtn').style.display = 'none';
        }
        
        function publishAd() {
            try {
                let existingAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
                let newAd = {
                    id: Date.now(),
                    name: adData.name,
                    phone: adData.phone,
                    description: adData.desc,
                    contactMethod: adData.contact,
                    mediaList: adData.mediaList,
                    mainMediaIndex: adData.mainMediaIndex,
                    userId: currentUser,
                    date: Date.now(),
                    views: 0,
                    likes: 0
                };
                existingAds.unshift(newAd);
                localStorage.setItem('marketplace_ads', JSON.stringify(existingAds));
                addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.", false);
                addMessage("🛒 **رابط سوق مصطفى:**\nmarketplace.html", false);
                step = null;
                adData = { name: null, phone: null, desc: null, contact: null, mediaList: [], mainMediaIndex: 0 };
                document.getElementById('mediaUploadBtn').style.display = 'none';
            } catch(e) {
                addMessage("⚠️ حدث خطأ أثناء النشر، يرجى المحاولة مرة أخرى", false);
            }
        }
        
        function buildIcons() {
            let container = document.createElement('div');
            let mainAd = document.createElement('div');
            mainAd.className = 'main-ad-icon';
            mainAd.innerHTML = `<div style="font-size:42px; font-weight:bold; color:white; text-shadow:2px 2px 4px rgba(0,0,0,0.3); margin-bottom:10px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك</span>`;
            mainAd.onclick = () => startAd();
            container.appendChild(mainAd);
            return container;
        }
        
        async function initChat() {
            document.getElementById('messages').innerHTML = '';
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨\n\n📢 **خدمة الإعلانات هي خدمتنا الأساسية**\n\n**كيف تبدأ؟**\n• للإعلانات: اضغط على الأيقونة البرتقالية\n✅ **النشر مجاني ولا يتطلب اشتراكاً**`;
            addMessage(welcomeMsg, false);
            document.getElementById('messages').appendChild(buildIcons());
        }
        
        document.getElementById('marketplaceGuestBtn').onclick = () => window.open('marketplace.html', '_blank');
        document.getElementById('marketplaceBtn').onclick = () => window.open('marketplace.html', '_blank');
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('topBotBar').onclick = () => {
            document.getElementById('chatFullscreen').classList.add('open');
            if (document.getElementById('messages').children.length === 0) initChat();
        };
        document.getElementById('closeChatBtn').onclick = () => document.getElementById('chatFullscreen').classList.remove('open');
        
        document.getElementById('mediaUploadBtn').onclick = () => {
            document.getElementById('mediaInput').click();
        };
        
        document.getElementById('mediaInput').onchange = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            addMessage(`🔄 جاري رفع ${files.length} ملف/ملفات...`, false);
            for (const file of files) {
                const uploaded = await uploadFile(file);
                adData.mediaList.push(uploaded);
            }
            addMessage(`✅ تم رفع ${files.length} ملف بنجاح!`, false);
            displayMediaGallery();
            if (step === 'media') {
                addMessage("📝 **الوصف:**\nأكتب وصفاً مفصلاً لمنتجك أو خدمتك (إجباري):", false);
                step = 'desc';
            }
            document.getElementById('mediaInput').value = '';
        };
        
        document.getElementById('sendBtn').onclick = () => {
            let input = document.getElementById('chatInput');
            let msg = input.value.trim();
            if (!msg) return;
            addMessage(msg, true);
            input.value = '';
            if (step === 'name') {
                if (msg.length < 3) { addMessage("❌ الاسم قصير جداً", false); return; }
                adData.name = msg;
                addMessage(`✅ تم تسجيل الاسم: ${adData.name}`, false);
                addMessage("📱 **رقم الهاتف:**\nأرسل رقم هاتفك (إجباري):", false);
                step = 'phone';
            } else if (step === 'phone') {
                if (msg.length < 9) { addMessage("❌ رقم هاتف غير صحيح", false); return; }
                adData.phone = msg;
                addMessage(`✅ تم تسجيل رقم الهاتف: ${adData.phone}`, false);
                addMessage("🖼️ **الآن قم برفع الصور أو الفيديوهات** (يمكنك رفع عدة ملفات مرة واحدة)", false);
                step = 'media';
            } else if (step === 'desc') {
                if (msg.length < 5) { addMessage("❌ وصف قصير جداً", false); return; }
                adData.desc = msg;
                addMessage(`✅ تم تسجيل الوصف: ${adData.desc}`, false);
                showContacts();
                step = null;
            } else if (step === 'edit_name') {
                if (msg.length < 3) { addMessage("❌ الاسم قصير جداً", false); return; }
                adData.name = msg;
                addMessage(`✅ تم تحديث الاسم إلى: ${adData.name}`, false);
                resumePreview();
            } else if (step === 'edit_phone') {
                if (msg.length < 9) { addMessage("❌ رقم هاتف غير صحيح", false); return; }
                adData.phone = msg;
                addMessage(`✅ تم تحديث رقم الهاتف إلى: ${adData.phone}`, false);
                resumePreview();
            } else if (step === 'edit_desc') {
                if (msg.length < 5) { addMessage("❌ وصف قصير جداً", false); return; }
                adData.desc = msg;
                addMessage(`✅ تم تحديث الوصف`, false);
                resumePreview();
            } else if (step === 'edit_contact') {
                if (msg === 'whatsapp' || msg === 'messenger' || msg === 'phone') {
                    selectContact(msg);
                } else {
                    addMessage("❌ يرجى اختيار وسيلة من الأزرار أعلاه", false);
                }
            }
        };
        
        if (localStorage.getItem('currentUser')) {
            currentUser = localStorage.getItem('currentUser');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            let sub = localStorage.getItem(`sub_${currentUser}`);
            if (sub && Date.now() < parseInt(sub)) {
                document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${Math.ceil((parseInt(sub)-Date.now())/86400000)} يوم`;
                document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                document.getElementById('paymentSection').innerHTML = '';
            } else {
                document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
                document.getElementById('planText').innerHTML = '⚠️ يرجى الاشتراك';
                document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8','_blank')">📅 اشتراك سنوي 1000 دج</button></div>`;
            }
        }
        
        function checkPayment() {
            let params = new URLSearchParams(window.location.search);
            let code = params.get('code');
            let days = params.get('days');
            if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) {
                let expiry = Date.now() + (parseInt(days) * 86400000);
                localStorage.setItem(`sub_${currentUser}`, expiry);
                showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`);
                if (document.getElementById('appSection').style.display !== 'none') {
                    document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${days} يوم`;
                    document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                    document.getElementById('paymentSection').innerHTML = '';
                }
            }
        }
        checkPayment();
    </script>
</body>
</html>
