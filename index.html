<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت مصطفى - مساعدك الذكي</title>
    <style>
        /* جميع الألوان والتنسيقات كما هي */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .top-bot-bar {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 80px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: glow 2s infinite;
        }
        .top-bot-bar:hover { transform: scale(1.02); }
        @keyframes glow {
            0% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
            100% { box-shadow: 0 10px 40px rgba(0, 123, 255, 0.6); }
        }
        .top-bot-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .top-bot-sub { font-size: 0.9rem; color: rgba(255,255,255,0.9); margin-top: 8px; }
        .container { max-width: 500px; width: 100%; }
        .card {
            background: white;
            border-radius: 35px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .version { font-size: 14px; color: #6c757d; margin-bottom: 20px; }
        .auth-input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 50px;
            border: 1px solid #ddd;
            font-size: 16px;
            text-align: center;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
        }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .btn-subscribe {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            margin-top: 10px;
            font-size: 18px;
        }
        .user-info {
            background: #e8f0fe;
            border-radius: 25px;
            padding: 15px;
            margin: 15px 0;
        }
        .user-name { font-size: 24px; font-weight: bold; color: #0f3460; }
        .sub-days {
            background: #fff3cd;
            border-radius: 40px;
            padding: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .chat-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: 0.3s;
            direction: rtl;
        }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
        }
        .close-btn { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .bot-msg, .user-msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; }
        .bot-msg { background: #e3f2fd; align-self: flex-start; }
        .user-msg { background: #d4edda; align-self: flex-end; }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        #chatInput { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px; }
        #sendBtn { background: #28a745; color: white; border: none; border-radius: 30px; padding: 0 25px; cursor: pointer; }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin: 10px 0;
        }
        .icon-item {
            background: #f8f9fa;
            border-radius: 18px;
            padding: 10px 5px;
            cursor: pointer;
            text-align: center;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }
        .icon-item:hover { transform: translateY(-5px); border-color: #007bff; }
        .icon-item img { width: 55px; height: 55px; object-fit: contain; border-radius: 12px; margin-bottom: 6px; }
        .icon-item span { font-size: 11px; display: block; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            transition: 0.3s;
            z-index: 9999;
        }
        @media (max-width: 480px) {
            .top-bot-text { font-size: 1.6rem; }
            .top-bot-bar { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <div class="top-bot-bar" id="topBotBar">
        <div class="top-bot-text">🤖 بوت مصطفى ✨</div>
        <div class="top-bot-sub">مساعدك الذكي للخدمات الرقمية | اضغط للدخول</div>
    </div>

    <div class="container">
        <div class="card">
            <div class="version">⭐ بوت مصطفى · خدمات رقمية متكاملة ⭐</div>
            <div id="loginSection">
                <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني" required>
                <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
                <div id="loginMsg" style="color:#e94560; margin-top:8px; font-size:13px;"></div>
            </div>
            <div id="appSection" style="display: none;">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="sub-days" id="daysLeft">⚠️ لا يوجد اشتراك نشط</div>
                    <div style="font-size:13px; color:#856404;" id="planText">اشترك الآن للوصول إلى جميع الخدمات</div>
                </div>
                <button id="subscribeBtn" class="btn btn-subscribe">💰 اشتراك سنوي - 365 يوماً (365 دج) 💰</button>
                <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="chatFullscreen" class="chat-fullscreen">
        <div class="chat-header">
            <span>🤖 بوت مصطفى</span>
            <button class="close-btn" id="closeChatBtn">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا...">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

    <script>
        // ====== الإعدادات (آمنة - لا مفتاح هنا!) ======
        const WEBHOOK_URL = "https://chargily-webhook-mvi5.onrender.com";
        // ===========================================
        
        let currentUser = null;
        let isBotTyping = false;
        let pendingService = null;

        const services = [
            { name: "DJEZZY", img: "DJEZZY.png", url: "https://moncompte.djezzy.dz/fr/guest/recharge", description: "شحن رصيد هاتف دجازي", benefit: "🔹 يتيح لك شحن الرصيد بسهولة", requirements: "📋 رقم هاتف دجازي + بطاقة بنكية", steps: "1️⃣ اضغط على الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ ادفع", needsCard: true },
            { name: "mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد هاتف موبيليس", benefit: "🔹 خدمة رسمية من موبيليس", requirements: "📋 رقم موبيليس + بطاقة بنكية", steps: "1️⃣ افتح الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ حدد المبلغ\n4️⃣ ادفع", needsCard: true },
            { name: "Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد هاتف أوريدو", benefit: "🔹 خدمة E-Storm", requirements: "📋 رقم أوريدو + بطاقة بنكية", steps: "1️⃣ اختر شحن الرصيد\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ ادفع", needsCard: true },
            { name: "دفع فاتورة الكهرباء", img: "SONELGAZ.png", url: "https://epayement.elit.dz/payementFacture.xhtml", description: "دفع فاتورة الكهرباء والغاز", benefit: "🔹 دفع إلكتروني بدون وكالات", requirements: "📋 رقم العقد (14 رقم) + بطاقة بنكية", steps: "1️⃣ أدخل رقم العقد\n2️⃣ سيظهر المبلغ\n3️⃣ ادفع", needsCard: false },
            { name: "دفع فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 منصة SEAAL الرسمية", requirements: "📋 رقم المشترك + بطاقة بنكية", steps: "1️⃣ أدخل رقم المشترك\n2️⃣ اختر الفاتورة\n3️⃣ ادفع", needsCard: false },
            { name: "قسيمة السيارات", img: "مديرية-الضرائب.png", url: "https://qassimatouka.mf.gov.dz/home", description: "الاستعلام عن قسيمة السيارات", benefit: "🔹 الاستعلام عن الرصيد والمدة", requirements: "📋 رقم التسجيل المركزي", steps: "1️⃣ أدخل رقم التسجيل\n2️⃣ اضغط استعلام", needsCard: false }
        ];

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.backgroundColor = isError ? '#dc3545' : '#28a745';
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 4000);
        }

        function getSubscription() {
            if (!currentUser) return { active: false, days: 0 };
            const expiry = localStorage.getItem(`sub_${currentUser}`);
            if (expiry && Date.now() < parseInt(expiry)) {
                return { active: true, days: Math.ceil((parseInt(expiry) - Date.now()) / 86400000) };
            }
            return { active: false, days: 0 };
        }

        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            const sub = getSubscription();
            if (sub.active) {
                document.getElementById('daysLeft').innerHTML = `✅ مفعل - يتبقى ${sub.days} يوم`;
                document.getElementById('planText').innerHTML = 'جميع الخدمات متاحة';
            } else {
                document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
                document.getElementById('planText').innerHTML = '⚠️ يرجى الاشتراك (365 دج سنوياً)';
            }
        }

        // إنشاء رابط دفع آمن عبر السيرفر
        async function createPayment() {
            try {
                const response = await fetch(`${WEBHOOK_URL}/create-payment`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: currentUser, name: currentUser.split('@')[0] })
                });
                const data = await response.json();
                if (data.checkout_url) {
                    window.open(data.checkout_url, "_blank");
                    showToast("⏳ تم التحويل إلى بوابة الدفع");
                    startPaymentCheck();
                } else {
                    throw new Error("فشل إنشاء رابط الدفع");
                }
            } catch (error) {
                showToast("❌ خطأ في الاتصال", true);
            }
        }

        let paymentCheckInterval = null;
        function startPaymentCheck() {
            if (paymentCheckInterval) clearInterval(paymentCheckInterval);
            paymentCheckInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${WEBHOOK_URL}/check-payment?email=${encodeURIComponent(currentUser)}`);
                    const result = await res.json();
                    if (result.paid === true) {
                        clearInterval(paymentCheckInterval);
                        const expiry = Date.now() + (365 * 86400000);
                        localStorage.setItem(`sub_${currentUser}`, expiry);
                        updateUI();
                        showToast("✅ تم تفعيل اشتراكك السنوي!");
                    }
                } catch(e) { console.log("جاري انتظار الدفع..."); }
            }, 3000);
            setTimeout(() => { if (paymentCheckInterval) clearInterval(paymentCheckInterval); }, 300000);
        }

        document.getElementById('subscribeBtn').onclick = async () => {
            if (!currentUser) { showToast('سجل الدخول أولاً', true); return; }
            await createPayment();
        };

        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('emailInput').value.trim();
            if (!email || !email.includes('@')) {
                document.getElementById('loginMsg').innerText = '❌ بريد إلكتروني صحيح';
                return;
            }
            currentUser = email;
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            updateUI();
            showToast(`مرحباً ${email.split('@')[0]} 🚀`);
        };

        document.getElementById('logoutBtn').onclick = () => {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            showToast('تم تسجيل الخروج');
        };

        if (localStorage.getItem('currentUser')) {
            currentUser = localStorage.getItem('currentUser');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            updateUI();
        }

        // باقي كود الدردشة والأيقونات...
        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatFull = document.getElementById('chatFullscreen');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const topBotBar = document.getElementById('topBotBar');

        topBotBar.onclick = () => {
            const sub = getSubscription();
            if (!sub.active) { showToast('⚠️ اشترك أولاً (365 دج سنوياً)', true); return; }
            chatFull.classList.add('open');
            if (messagesDiv.children.length === 0) initChat();
        };
        closeChatBtn.onclick = () => chatFull.classList.remove('open');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'user-msg' : 'bot-msg';
            div.innerText = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function buildIcons() {
            const grid = document.createElement('div');
            grid.className = 'icon-grid';
            services.forEach(s => {
                const item = document.createElement('div');
                item.className = 'icon-item';
                const img = document.createElement('img');
                img.src = s.img;
                img.onerror = () => img.src = 'https://via.placeholder.com/55';
                const span = document.createElement('span');
                span.innerText = s.name;
                item.appendChild(img);
                item.appendChild(span);
                item.onclick = () => {
                    if (!getSubscription().active) {
                        addMessage(`⚠️ خدمة "${s.name}" تتطلب اشتراكاً سنوياً (365 دج)`, false);
                        return;
                    }
                    let msg = `📌 ${s.name}\n${s.benefit}\n${s.requirements}\n${s.steps}\n❓ جاهز لفتح الرابط؟ (نعم/لا)`;
                    addMessage(msg, false);
                    pendingService = s;
                };
                grid.appendChild(item);
            });
            return grid;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            addMessage(`✨ أهلاً بك! ✨\n💰 الاشتراك: 365 دج سنوياً\n📱 الخدمات: شحن الجوال، فواتير، قسيمة السيارات`, false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            const text = chatInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            chatInput.value = '';
            if (pendingService && (text === 'نعم' || text === 'لا')) {
                if (text === 'نعم') {
                    window.open(pendingService.url, '_blank');
                    addMessage(`✅ تم فتح رابط ${pendingService.name}`, false);
                } else {
                    addMessage("🙂 لا مشكلة! اختر خدمة أخرى", false);
                }
                pendingService = null;
                return;
            }
            addMessage("🤖 أنا بوت مصطفى! اشترك أولاً (365 دج) ثم اختر خدمة من الأيقونات 👆", false);
        };
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    </script>
</body>
</html>
