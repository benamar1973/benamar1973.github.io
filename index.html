<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        /* كل الأنماط الأصلية - لم تتغير */
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e 0%,#16213e 100%);font-family:'Cairo','Segoe UI','Tahoma',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
        .top-bot-bar{width:100%;max-width:650px;margin:0 auto 20px auto;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:80px;padding:20px 30px;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:all 0.3s ease;animation:glow 2s infinite}
        @keyframes glow{0%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}50%{box-shadow:0 10px 40px rgba(0,123,255,0.6)}100%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}}
        .top-bot-text{font-size:2.2rem;font-weight:bold;color:white;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
        .top-bot-text span:first-child{font-size:3rem;animation:bounce 1s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .top-bot-sub{font-size:0.9rem;color:rgba(255,255,255,0.9);margin-top:8px;display:block}
        .container{max-width:550px;width:100%}
        .card{background:white;border-radius:35px;padding:25px 20px;text-align:center;box-shadow:0 20px 35px rgba(0,0,0,0.2)}
        .version{font-size:14px;color:#6c757d;margin-bottom:20px;font-weight:bold}
        .auth-input{width:100%;padding:14px;margin:10px 0;border-radius:50px;border:1px solid #ddd;font-size:16px;text-align:center}
        .btn{background:#007bff;color:white;border:none;border-radius:50px;padding:14px;width:100%;font-size:16px;font-weight:bold;cursor:pointer;margin:8px 0}
        .btn-logout{background:#dc3545;margin-top:15px}
        .marketplace-link-btn{background:linear-gradient(135deg,#6f42c1,#8b5cf6);color:white;border:none;border-radius:50px;padding:12px 20px;margin-top:10px;cursor:pointer;font-weight:bold;width:100%}
        .user-info{background:#e8f0fe;border-radius:25px;padding:15px;margin:15px 0}
        .user-name{font-size:24px;font-weight:bold;color:#0f3460;word-break:break-all}
        .sub-days{background:#fff3cd;border-radius:40px;padding:8px;margin:10px 0;font-size:14px}
        .payment-buttons{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
        .payment-btn{background:linear-gradient(135deg,#28a745,#20c997);color:white;border:none;border-radius:50px;padding:12px 25px;font-size:16px;font-weight:bold;cursor:pointer;transition:transform 0.2s}
        .payment-btn:hover{transform:scale(1.05)}
        .chat-fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;z-index:10000;display:flex;flex-direction:column;transform:translateY(100%);transition:0.3s;direction:rtl}
        .chat-fullscreen.open{transform:translateY(0)}
        .chat-header{background:linear-gradient(135deg,#007bff,#0056b3);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:1.5rem;font-weight:bold}
        .close-btn{background:none;border:none;color:white;font-size:2rem;cursor:pointer}
        .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
        .bot-msg,.user-msg{padding:12px 16px;border-radius:20px;max-width:85%;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
        .bot-msg{background:#e3f2fd;align-self:flex-start;border-bottom-right-radius:5px}
        .user-msg{background:#d4edda;align-self:flex-end;border-bottom-left-radius:5px}
        .user-msg-img,.user-msg-video{background:#d4edda;align-self:flex-end;border-bottom-left-radius:5px;padding:8px 12px;max-width:85%}
        .user-msg-img img,.user-msg-video video{max-width:200px;max-height:200px;border-radius:12px}
        .input-area{background:white;padding:12px;display:flex;gap:10px;border-top:1px solid #ddd;flex-wrap:wrap}
        #chatInput{flex:1;border:1px solid #ccc;border-radius:30px;padding:12px;font-size:15px}
        #sendBtn{background:#28a745;color:white;border:none;border-radius:30px;padding:0 25px;cursor:pointer;font-weight:bold}
        #mediaUploadBtn{background:#007bff;color:white;border:none;border-radius:30px;padding:0 20px;cursor:pointer;font-weight:bold;display:none}
        #mediaInput{display:none}
        .contact-buttons{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
        .contact-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:50px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .contact-btn.messenger{background:linear-gradient(135deg,#0084ff,#0063d1)}
        .contact-btn.phone{background:linear-gradient(135deg,#34b7f1,#1c8ad9)}
        .confirm-buttons{display:flex;gap:10px;margin:10px 0;justify-content:center;flex-wrap:wrap}
        .confirm-yes{background:#28a745;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .confirm-no{background:#dc3545;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .edit-btn{background:#ffc107;color:#333;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:white;border-radius:20px;padding:16px;margin:10px 0}
        @media(min-width:550px){.icon-grid{grid-template-columns:repeat(3,1fr)}}
        .icon-item{background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:20px;padding:12px 8px;cursor:pointer;text-align:center;border:2px solid #dee2e6;transition:all 0.3s}
        .icon-item:hover{transform:translateY(-5px);border-color:#007bff}
        .icon-item img{width:55px;height:55px;object-fit:contain;border-radius:12px;margin-bottom:6px}
        .main-ad-icon{background:linear-gradient(135deg,#ff6b35,#f7931e);border-radius:20px;padding:25px 15px;cursor:pointer;text-align:center;margin:15px 0;border:3px solid #ffd700;transition:all 0.3s}
        .main-ad-icon:hover{transform:translateY(-8px) scale(1.02)}
        .main-ad-icon .main-icon-title{font-size:24px;font-weight:bold;color:white}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:9999;pointer-events:none}
        .typing{display:flex;gap:4px;align-items:center}
        .typing span{width:8px;height:8px;background:#888;border-radius:50%;display:inline-block;animation:typingAnim 1.4s infinite}
        .typing span:nth-child(2){animation-delay:0.2s}
        .typing span:nth-child(3){animation-delay:0.4s}
        @keyframes typingAnim{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
        .footer-links{text-align:center;margin-top:25px;padding:15px;background:rgba(0,0,0,0.3);border-radius:20px;max-width:550px;width:100%}
        .footer-links a{color:white;text-decoration:none;margin:0 8px;font-size:13px}
        .facebook-preview{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-width:100%;margin:10px 0}
        .fb-header{display:flex;align-items:center;padding:12px;gap:10px}
        .fb-avatar{width:40px;height:40px;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
        .fb-name{font-weight:bold;font-size:14px}
        .fb-time{font-size:11px;color:#65676B}
        .fb-content{padding:0 12px 8px}
        .fb-media{width:100%;max-height:300px;object-fit:cover}
        .fb-media-video{width:100%;max-height:300px}
        .fb-contact{padding:10px;background:#f0f2f5;margin:8px;border-radius:8px;text-align:center}
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>

<div class="top-bot-bar" id="topBotBar">
    <div class="top-bot-text">
        <span>🤖</span>
        <span>بوت مصطفى</span>
        <span>✨</span>
    </div>
    <div class="top-bot-sub">خدمة الإعلانات · شحن · فواتير</div>
</div>

<div class="container">
    <div class="card">
        <div class="version">⭐ بوت مصطفى · خدمة الإعلانات هي الأساس ⭐</div>
        <div id="loginSection">
            <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني" required>
            <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
            <button id="marketplaceGuestBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى (بدون تسجيل)</button>
            <div id="loginMsg" style="color:#e94560; margin-top:8px;"></div>
        </div>
        <div id="appSection" style="display:none;">
            <div class="user-info">
                <div class="user-name" id="userName"></div>
                <div class="sub-days" id="daysLeft"></div>
                <div id="paymentSection"></div>
            </div>
            <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
            <button id="marketplaceBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
        </div>
    </div>
</div>

<div class="footer-links">
    <a href="about.html">📖 من نحن</a> | <a href="contact.html">📞 اتصل بنا</a> | <a href="privacy.html">🔒 سياسة الخصوصية</a> | <a href="terms.html">📜 الشروط والأحكام</a>
</div>

<div id="toast" class="toast"></div>

<div id="chatFullscreen" class="chat-fullscreen">
    <div class="chat-header">
        <span>🤖 بوت مصطفى | خدمة الإعلانات</span>
        <button class="close-btn" id="closeChatBtn">✕</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
        <button id="mediaUploadBtn">📷 صورة / فيديو</button>
        <input type="file" id="mediaInput" accept="image/*,video/*">
        <button id="sendBtn">إرسال</button>
    </div>
</div>

<script>
    // ========== Firebase Config (نفس القديم) ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
        authDomain: "khadamati-dz-28051.firebaseapp.com",
        projectId: "khadamati-dz-28051",
        storageBucket: "khadamati-dz-28051.firebasestorage.app",
        messagingSenderId: "689071750342",
        appId: "1:689071750342:web:7eafee1d6e372e285dabc7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ========== Cloudinary ==========
    const CLOUD_NAME = "dmeq8fu4i";
    const UPLOAD_PRESET = "mustapha_preset";

    // ========== متغيرات عامة (نفس الأصل) ==========
    let currentUser = null;
    let isBotTyping = false;
    let pendingService = null;
    let pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null };

    // ========== دوال مساعدة (نفس الأصل) ==========
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2500); }
    function addMessage(text, isUser) { const div = document.createElement('div'); div.className = isUser ? 'user-msg' : 'bot-msg'; div.innerText = text; document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function addMediaMessage(base64, type) { const div = document.createElement('div'); div.className = 'user-msg-img'; const media = type === 'image' ? document.createElement('img') : document.createElement('video'); media.src = base64; if(type==='video') media.controls = true; media.style.maxWidth = '200px'; media.style.borderRadius = '12px'; div.appendChild(media); document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function showTypingIndicator() { const d = document.createElement('div'); d.className = 'bot-msg'; d.id = 'typingIndicator'; d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; document.getElementById('messages').appendChild(d); d.scrollIntoView(); }
    function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if(el) el.remove(); }

    // ========== التحقق من الاشتراك (كما كان في الأصل - من localStorage) ==========
    function getSubscription() {
        if (!currentUser) return { active: false, days: 0 };
        const userEmail = currentUser.email || localStorage.getItem('currentUserEmail');
        if (!userEmail) return { active: false, days: 0 };
        const expiry = localStorage.getItem(`sub_${userEmail}`);
        if (expiry && Date.now() < parseInt(expiry)) {
            const days = Math.ceil((parseInt(expiry) - Date.now()) / 86400000);
            return { active: true, days };
        }
        return { active: false, days: 0 };
    }

    function updateUI() {
        if (!currentUser) return;
        const displayEmail = currentUser.email || localStorage.getItem('currentUserEmail') || 'مستخدم';
        document.getElementById('userName').innerHTML = `👤 ${displayEmail.split('@')[0]}`;
        const sub = getSubscription();
        if (sub.active) {
            document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
            document.getElementById('paymentSection').innerHTML = '';
        } else {
            document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
            document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8', '_blank')">📅 اشتراك سنوي 1000 دج</button></div><div style="font-size:12px; color:#666; margin-top:8px;">💡 اشتراك سنوي 1000 دج فقط</div>`;
        }
    }

    // ========== رفع الملف إلى Cloudinary ==========
    async function uploadToCloudinary(base64Data) {
        try {
            showToast("🔄 جاري رفع الملف...");
            const blob = await fetch(base64Data).then(r => r.blob());
            const fd = new FormData();
            fd.append('file', blob);
            fd.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: 'POST', body: fd });
            const data = await res.json();
            if (!data.secure_url) throw new Error("فشل الرفع");
            showToast("✅ تم رفع الملف");
            return data.secure_url;
        } catch(e) { showToast("❌ فشل الرفع"); throw e; }
    }

    // ========== نشر الإعلان النهائي (يحفظ في Firestore) ==========
    window.finalPublish = async () => {
        if (window.isPublishing) return;
        if (!currentUser) { addMessage("⚠️ يرجى تسجيل الدخول أولاً", false); return; }
        const sub = getSubscription();
        if (!sub.active) { addMessage(`⚠️ خدمة الإعلانات تتطلب اشتراكاً نشطاً.\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).`, false); return; }
        if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaBase64) {
            addMessage("⚠️ البيانات غير مكتملة", false); return;
        }
        window.isPublishing = true;
        addMessage("🚀 جاري نشر إعلانك...", false);
        showTypingIndicator();
        try {
            const imageUrl = await uploadToCloudinary(pendingAd.mediaBase64);
            await db.collection('ads').add({
                name: pendingAd.fullName,
                phone: pendingAd.phone,
                description: pendingAd.description,
                contactMethod: pendingAd.contactMethod,
                imageUrl: imageUrl,
                imageType: pendingAd.mediaType,
                userId: currentUser.uid,
                userEmail: currentUser.email || localStorage.getItem('currentUserEmail'),
                date: firebase.firestore.FieldValue.serverTimestamp(),
                views: 0,
                likes: []
            });
            removeTypingIndicator();
            addMessage("✅ **تم نشر إعلانك بنجاح في سوق مصطفى!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.\nيمكنك مشاهدة إعلانك في السوق.", false);
            addMessage("🛒 **رابط سوق مصطفى:**\nmarketplace.html", false);
            pendingAd = { step: null };
            document.getElementById('mediaUploadBtn').style.display = 'none';
        } catch(e) { removeTypingIndicator(); addMessage("⚠️ خطأ في النشر: "+e.message, false); }
        finally { window.isPublishing = false; }
    };

    // ========== باقي دوال سير العمل (نفس الأصل) ==========
    const services = []; // ضع خدماتك هنا إن وجدت
    const AD_RULES = "📜 **قوانين نشر الإعلانات:**\n❌ لا إعلانات مخلة بالآداب\n❌ لا عنف أو كراهية\n✅ الإعلان يكون حلالاً ومفيداً\n⚠️ المخالفة تؤدي إلى حظر الحساب فوراً.";

    function startAdFlow() {
        const sub = getSubscription();
        if (!sub.active && currentUser) { addMessage(`⚠️ خدمة الإعلانات تتطلب اشتراكاً نشطاً.\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).`, false); return; }
        if (!currentUser) { addMessage(`⚠️ يرجى تسجيل الدخول أولاً.`, false); return; }
        addMessage(AD_RULES, false);
        setTimeout(() => {
            addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (الاسم واللقب) كما سيظهر في الإعلان (إجباري):", false);
            pendingAd = { step: 'fullName', fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null };
            document.getElementById('mediaUploadBtn').style.display = 'inline-block';
        }, 1000);
    }

    function showMediaTypeChoice() {
        const div = document.createElement('div'); div.className = 'bot-msg';
        div.innerHTML = `<div>📸 **اختر نوع الملف الذي تريد رفعه (إجباري):**</div><div class="contact-buttons"><button class="contact-btn" onclick="window.selectMediaType('image')">🖼️ صورة</button><button class="contact-btn messenger" onclick="window.selectMediaType('video')">🎬 فيديو</button></div>`;
        document.getElementById('messages').appendChild(div); div.scrollIntoView();
    }
    window.selectMediaType = (type) => {
        pendingAd.mediaTypeChoice = type;
        addMessage(`✅ تم اختيار ${type === 'image' ? 'صورة' : 'فيديو'}`, false);
        addMessage(`🖼️ **الآن قم برفع ${type === 'image' ? 'الصورة' : 'الفيديو'}** بالضغط على زر "📷 صورة / فيديو" (إجباري)`, false);
        pendingAd.step = 'media';
    };
    function showContactButtons() {
        const div = document.createElement('div'); div.className = 'bot-msg';
        div.innerHTML = `<div>📞 **اختر وسيلة التواصل التي ستظهر في الإعلان (إجباري):**</div><div class="contact-buttons"><button class="contact-btn" onclick="window.selectContactMethod('whatsapp')">💚 واتساب</button><button class="contact-btn messenger" onclick="window.selectContactMethod('messenger')">💬 مسنجر</button><button class="contact-btn phone" onclick="window.selectContactMethod('phone')">📱 هاتف</button></div>`;
        document.getElementById('messages').appendChild(div); div.scrollIntoView();
    }
    window.selectContactMethod = (method) => {
        pendingAd.contactMethod = method;
        addMessage(`✅ تم اختيار: ${method}`, false);
        setTimeout(() => { addMessage("📋 **تم اكتمال جميع البيانات!** جاري عرض ملخص المعلومات...", false); showSummaryWithEditOptions(); pendingAd.step = 'review'; }, 500);
    };
    function showSummaryWithEditOptions() {
        const summary = document.createElement('div'); summary.className = 'bot-msg';
        summary.innerHTML = `📋 **مراجعة معلومات الإعلان:**<br>👤 الاسم: ${pendingAd.fullName}<br>📞 الهاتف: ${pendingAd.phone}<br>📝 الوصف: ${pendingAd.description}<br>🖼️ نوع الملف: ${pendingAd.mediaTypeChoice}<br>💬 التواصل: ${pendingAd.contactMethod}<br><div class="confirm-buttons"><button class="confirm-yes" onclick="window.proceedToPreview()">✅ متابعة إلى المعاينة</button><button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء الإعلان</button></div>`;
        document.getElementById('messages').appendChild(summary); summary.scrollIntoView();
    }
    window.proceedToPreview = () => {
        if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaBase64) {
            addMessage("⚠️ يرجى التأكد من اكتمال جميع البيانات قبل المتابعة", false); return;
        }
        showFacebookPreview();
    };
    window.cancelAd = () => { addMessage("🙂 تم إلغاء الإعلان.", false); pendingAd = { step: null }; document.getElementById('mediaUploadBtn').style.display = 'none'; };
    function showFacebookPreview() {
        const previewDiv = document.createElement('div'); previewDiv.className = 'facebook-preview';
        const mediaHtml = pendingAd.mediaType === 'image' ? `<img class="fb-media" src="${pendingAd.mediaBase64}">` : `<video class="fb-media-video" src="${pendingAd.mediaBase64}" controls></video>`;
        previewDiv.innerHTML = `<div class="fb-header"><div class="fb-avatar">${pendingAd.fullName.charAt(0)}</div><div><div class="fb-name">${pendingAd.fullName}</div><div class="fb-time">الآن · 🌍</div></div></div><div class="fb-content">${pendingAd.description}</div>${mediaHtml}<div class="fb-contact">${pendingAd.contactMethod}: ${pendingAd.phone}</div><div class="fb-buttons"><span>👍 أعجبني</span><span>💬 تعليق</span><span>📤 مشاركة</span></div><div class="confirm-buttons"><button class="confirm-yes" onclick="window.finalPublish()">✅ تأكيد النشر</button><button class="edit-btn" onclick="window.backToEdit()">✏️ العودة للتعديل</button><button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء</button></div>`;
        document.getElementById('messages').appendChild(previewDiv); previewDiv.scrollIntoView();
    }
    window.backToEdit = () => { const last = document.getElementById('messages').lastChild; if(last) last.remove(); showSummaryWithEditOptions(); };

    async function handleAdFlow(msg) {
        if (pendingAd.step === 'fullName') { if(msg.trim().length<3){addMessage("❌ يرجى إدخال الاسم الكامل (3 أحرف على الأقل)",false); return false;} pendingAd.fullName=msg.trim(); addMessage(`✅ تم تسجيل الاسم: ${pendingAd.fullName}`,false); addMessage("📱 **رقم الهاتف (للتواصل):**\nأرسل رقم هاتفك (إجباري):",false); pendingAd.step='phone'; return true; }
        if (pendingAd.step === 'phone') { if(msg.length<9){addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)",false); return false;} pendingAd.phone=msg.trim(); addMessage(`✅ تم تسجيل رقم الهاتف: ${pendingAd.phone}`,false); showMediaTypeChoice(); pendingAd.step='waitingMedia'; return true; }
        if (pendingAd.step === 'description') { if(msg.length<5){addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)",false); return false;} pendingAd.description=msg.trim(); addMessage(`✅ تم تسجيل الوصف`,false); showContactButtons(); pendingAd.step='waitingContact'; return true; }
        return false;
    }

    function compressImage(file, maxWidth=800, quality=0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if(width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('mediaUploadBtn').onclick = () => document.getElementById('mediaInput').click();
    document.getElementById('mediaInput').onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const isImage = file.type.startsWith('image');
        const mediaType = isImage ? 'image' : 'video';
        if(pendingAd.mediaTypeChoice && pendingAd.mediaTypeChoice !== mediaType) { showToast(`❌ يرجى رفع ${pendingAd.mediaTypeChoice}`); return; }
        let processed = file;
        if(isImage) { showToast("🔄 جاري ضغط الصورة..."); processed = await compressImage(file); showToast("✅ تم ضغط الصورة"); }
        const reader = new FileReader();
        reader.onload = (ev) => {
            pendingAd.mediaBase64 = ev.target.result;
            pendingAd.mediaType = mediaType;
            addMediaMessage(pendingAd.mediaBase64, mediaType);
            addMessage(`✅ تم استلام ${mediaType === 'image' ? 'الصورة' : 'الفيديو'}`, false);
            setTimeout(() => { addMessage("📝 **الوصف:**\nأكتب وصفاً مفصلاً لمنتجك أو خدمتك (إجباري):", false); pendingAd.step = 'description'; }, 500);
        };
        reader.readAsDataURL(processed);
        document.getElementById('mediaInput').value = '';
    };

    async function handleGeneralMessage(msg) {
        const lower = msg.toLowerCase();
        if(lower.includes('مرحب') || lower.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى (شحن الجوال، فواتير، إنترنت) اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية الكبيرة";
        if(lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
        if(lower.includes('القوانين')) return AD_RULES;
        return "📢 **بوت مصطفى - خدمة الإعلانات هي الأساس**\n\n📢 للإعلانات: اضغط على الأيقونة الرئيسية\n\n✅ الخدمات الأخرى المتاحة:\n• شحن الجوال (Djezzy, Mobilis, Ooredoo)\n• دفع فواتير الكهرباء والماء\n• شحن الانترنت (Algerie Telecom)\n\nاختر الخدمة من الأيقونات.";
    }

    function buildIcons() {
        const container = document.createElement('div');
        const mainAdDiv = document.createElement('div'); mainAdDiv.className = 'main-ad-icon'; mainAdDiv.innerHTML = `<div style="font-size:42px; font-weight:bold; color:white; margin-bottom:10px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك</span>`; mainAdDiv.onclick = startAdFlow; container.appendChild(mainAdDiv);
        const grid = document.createElement('div'); grid.className = 'icon-grid';
        // يمكن إضافة الخدمات هنا إن وجدت
        container.appendChild(grid);
        return container;
    }

    async function initChat() {
        document.getElementById('messages').innerHTML = '';
        const sub = getSubscription();
        let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨\n\n📢 **خدمة الإعلانات هي خدمتنا الأساسية**\n\n**الخدمات الأخرى المتاحة:**\n📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)\n⚡ دفع فواتير الكهرباء والغاز والماء\n🌐 شحن الانترنت (Algerie Telecom)\n\n**كيف تبدأ؟**\n• للإعلانات: اضغط على الأيقونة الرئيسية\n• للخدمات الأخرى: اضغط على الأيقونات العادية`;
        if (!sub.active && currentUser) welcomeMsg += `\n\n⚠️ **ملاحظة:** ليس لديك اشتراك نشط.\n💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج) للوصول إلى جميع الخدمات.`;
        else if (!currentUser) welcomeMsg += `\n\n🔐 يرجى تسجيل الدخول أولاً ثم الاشتراك للوصول إلى الخدمات.`;
        else if (sub.active) welcomeMsg += `\n\n✅ اشتراكك مفعل - مرحبا بك في خدمات بوت مصطفى`;
        addMessage(welcomeMsg, false);
        document.getElementById('messages').appendChild(buildIcons());
    }

    // ========== أحداث المصادقة والأزرار ==========
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            const savedEmail = localStorage.getItem('currentUserEmail');
            if (savedEmail && !user.email) {
                await user.updateProfile({ displayName: savedEmail });
                // لا يمكن تحديث البريد الإلكتروني بهذه الطريقة، لكننا نخزنه في localStorage
            }
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            updateUI();
        } else {
            const savedEmail = localStorage.getItem('currentUserEmail');
            if (savedEmail) {
                auth.signInAnonymously().catch(console.error);
            } else {
                currentUser = null;
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('appSection').style.display = 'none';
            }
        }
    });

    document.getElementById('loginBtn').onclick = () => {
        const email = document.getElementById('emailInput').value.trim();
        if (!email || !email.includes('@')) { document.getElementById('loginMsg').innerText = '❌ أدخل بريداً إلكترونياً صحيحاً'; return; }
        localStorage.setItem('currentUserEmail', email);
        auth.signInAnonymously().then(() => {
            document.getElementById('loginMsg').innerText = '';
            showToast(`مرحباً ${email.split('@')[0]} في بوت مصطفى 🚀`);
        }).catch(err => { document.getElementById('loginMsg').innerText = '❌ خطأ في تسجيل الدخول'; console.error(err); });
    };
    document.getElementById('logoutBtn').onclick = () => { auth.signOut(); localStorage.removeItem('currentUserEmail'); location.reload(); };
    document.getElementById('marketplaceGuestBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('marketplaceBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('topBotBar').onclick = () => { document.getElementById('chatFullscreen').classList.add('open'); if(document.getElementById('messages').children.length === 0) initChat(); };
    document.getElementById('closeChatBtn').onclick = () => document.getElementById('chatFullscreen').classList.remove('open');

    document.getElementById('sendBtn').onclick = async () => {
        if (isBotTyping) return;
        const txt = document.getElementById('chatInput').value.trim();
        if (txt) addMessage(txt, true);
        document.getElementById('chatInput').value = '';
        if (pendingAd.step && pendingAd.step !== 'waitingMedia' && pendingAd.step !== 'waitingContact' && pendingAd.step !== 'review') {
            if (!txt) return;
            isBotTyping = true; showTypingIndicator(); await new Promise(r=>setTimeout(r,500)); removeTypingIndicator(); await handleAdFlow(txt); isBotTyping = false; return;
        }
        if (pendingService) {
            const lower = txt.toLowerCase();
            if (lower === 'نعم') { window.open(pendingService.url,'_blank'); addMessage(`✅ تم فتح الرابط`,false); pendingService=null; }
            else if (lower === 'لا') { addMessage("🙂 لا مشكلة! يمكنك اختيار خدمة أخرى.",false); pendingService=null; }
            else addMessage("أجب بـ نعم أو لا", false);
            return;
        }
        if (!txt) return;
        isBotTyping = true; showTypingIndicator(); await new Promise(r=>setTimeout(r,800)); removeTypingIndicator(); const reply = await handleGeneralMessage(txt); addMessage(reply, false); isBotTyping = false;
    };
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('sendBtn').click(); });
</script>
