<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .top-bot-bar {
            width: 100%;
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 80px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: glow 2s infinite;
        }
        .top-bot-bar:hover { transform: scale(1.02); box-shadow: 0 15px 40px rgba(0, 123, 255, 0.4); }
        @keyframes glow {
            0% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(0, 123, 255, 0.6); }
            100% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
        }
        .top-bot-text { font-size: 2.2rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .top-bot-text span:first-child { font-size: 3rem; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .top-bot-sub { font-size: 0.9rem; color: rgba(255, 255, 255, 0.9); margin-top: 8px; display: block; }
        .container { max-width: 550px; width: 100%; }
        .card { background: white; border-radius: 35px; padding: 25px 20px; text-align: center; box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2); }
        .version { font-size: 14px; color: #6c757d; margin-bottom: 20px; font-weight: bold; }
        .auth-input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 50px; border: 1px solid #ddd; font-size: 16px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; border-radius: 50px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .user-info { background: #e8f0fe; border-radius: 25px; padding: 15px; margin: 15px 0; }
        .user-name { font-size: 24px; font-weight: bold; color: #0f3460; word-break: break-all; }
        .sub-days { background: #fff3cd; border-radius: 40px; padding: 8px; margin: 10px 0; font-size: 14px; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .payment-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; border-radius: 50px; padding: 12px 25px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .payment-btn:hover { transform: scale(1.05); }
        .chat-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 10000; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.3s; direction: rtl; }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .bot-msg, .user-msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.5; animation: fadeIn 0.3s; white-space: pre-wrap; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bot-msg { background: #e3f2fd; align-self: flex-start; border-bottom-right-radius: 5px; }
        .user-msg { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; }
        .user-msg-img, .user-msg-video { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; padding: 8px 12px; max-width: 85%; }
        .user-msg-img img { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 5px; }
        .user-msg-video video { max-width: 220px; max-height: 220px; border-radius: 12px; margin-top: 5px; }
        
        /* معاينة إعلان فيسبوك */
        .facebook-preview {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 100%;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
        }
        .fb-header {
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 10px;
        }
        .fb-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .fb-name {
            font-weight: bold;
            font-size: 14px;
            color: #050505;
        }
        .fb-time {
            font-size: 11px;
            color: #65676B;
        }
        .fb-content {
            padding: 0 12px 8px 12px;
            font-size: 14px;
            color: #050505;
        }
        .fb-media {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            background: #f0f2f5;
        }
        .fb-media-video {
            width: 100%;
            max-height: 400px;
            background: #000;
        }
        .fb-contact {
            padding: 10px 12px;
            background: #f0f2f5;
            margin: 8px;
            border-radius: 8px;
            font-size: 13px;
            direction: rtl;
            text-align: center;
        }
        .fb-buttons {
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 1px solid #e4e6eb;
            color: #65676B;
            font-size: 13px;
        }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-wrap: wrap; }
        #chatInput { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px; font-family: inherit; font-size: 15px; min-width: 120px; }
        #sendBtn { background: #28a745; color: white; border: none; border-radius: 30px; padding: 0 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #mediaUploadBtn { background: #007bff; color: white; border: none; border-radius: 30px; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #mediaInput { display: none; }
        .contact-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .contact-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .contact-btn.messenger { background: linear-gradient(135deg, #0084ff, #0063d1); }
        .contact-btn.phone { background: linear-gradient(135deg, #34b7f1, #1c8ad9); }
        .contact-btn:hover { transform: scale(1.05); }
        .confirm-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            justify-content: center;
        }
        .confirm-yes { background: #28a745; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .confirm-no { background: #dc3545; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .icon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: white; border-radius: 20px; padding: 16px; margin: 10px 0; }
        @media (min-width: 550px) { .icon-grid { grid-template-columns: repeat(3, 1fr); } }
        .icon-item { background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 20px; padding: 12px 8px; cursor: pointer; text-align: center; border: 2px solid #dee2e6; transition: all 0.3s; }
        .icon-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); border-color: #007bff; }
        .icon-item img { width: 55px; height: 55px; object-fit: contain; border-radius: 12px; margin-bottom: 6px; }
        .icon-item span { font-size: 12px; display: block; font-weight: bold; color: #333; }
        .main-ad-icon {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            text-align: center;
            margin: 15px 0;
            border: 3px solid #ffd700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .main-ad-icon:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 107, 53, 0.4);
            border-color: #fff;
        }
        .main-ad-icon img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .main-ad-icon .main-icon-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            display: block;
            margin-bottom: 6px;
        }
        .main-ad-icon .main-icon-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            display: block;
        }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: 0.3s; z-index: 9999; font-weight: bold; pointer-events: none; }
        .typing { display: flex; gap: 4px; align-items: center; }
        .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; display: inline-block; animation: typingAnim 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        @media (max-width: 480px) {
            .top-bot-text { font-size: 1.6rem; }
            .top-bot-text span:first-child { font-size: 2.2rem; }
            .top-bot-bar { padding: 15px 20px; }
            .main-ad-icon img { width: 130px; height: 130px; }
            .main-ad-icon .main-icon-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="top-bot-bar" id="topBotBar">
        <div class="top-bot-text">
            <span>🤖</span>
            <span>بوت مصطفى</span>
            <span>✨</span>
        </div>
        <div class="top-bot-sub">خدمة الإعلانات · شحن · فواتير</div>

    <div class="container">
        <div class="card">

            <div id="loginSection">

                <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
                <div id="loginMsg" style="color:#e94560; margin-top:8px; font-size:13px;"></div>
            </div>

            <div id="appSection" style="display: none;">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="sub-days" id="daysLeft"></div>
                    <div style="font-size:13px; color:#856404;" id="planText"></div>
                    <div id="paymentSection" style="margin-top: 10px;"></div>
                </div>
                <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="chatFullscreen" class="chat-fullscreen">
        <div class="chat-header">
            <span>🤖 بوت مصطفى | خدمة الإعلانات</span>
            <button class="close-btn" id="closeChatBtn">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
            <button id="mediaUploadBtn">📷 صورة / فيديو</button>

    </div>

    <script>

            { name: "📱 mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد هاتف موبيليس", benefit: "🔹 **فائدة الرابط:** خدمة رسمية من موبيليس لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم موبيليس المراد شحنه 📱\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ افتح الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ حدد المبلغ\n4️⃣ أدخل بيانات البطاقة\n5️⃣ تأكيد", needsCard: true },
            { name: "📱 Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد هاتف أوريدو", benefit: "🔹 **فائدة الرابط:** خدمة E-Storm من أوريدو لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم أوريدو المراد شحنه 📱\n• بطاقة CIB أو ذهبية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اختر 'شحن الرصيد'\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد", needsCard: true },
            { name: "⚡ فاتورة الكهرباء", img: "SONELGAZ.png", url: "https://epayement.elit.dz/payementFacture.xhtml", description: "دفع فاتورة الكهرباء والغاز", benefit: "🔹 **فائدة الرابط:** دفع فواتير الكهرباء والغاز إلكترونياً بدون الحاجة للذهاب إلى الوكالات.\n🔹 تحصل على إشعار فوري بالدفع وإيصال إلكتروني.", requirements: "📋 **متطلبات الدفع:**\n• رقم العقد الموجود أعلى الفاتورة (14 رقم) 📄\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ أدخل رقم العقد المكون من 14 رقماً\n2️⃣ سيظهر المبلغ المطلوب دفعه\n3️⃣ اضغط على 'دفع الآن'\n4️⃣ اختر طريقة الدفع\n5️⃣ أدخل بيانات البطاقة\n6️⃣ تأكيد الدفع\n7️⃣ احفظ الإيصال الإلكتروني", needsCard: false },
            { name: "💧 فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 **فائدة الرابط:** منصة SEAAL الرسمية لدفع فواتير الماء.\n🔹 يمكنك دفع الفاتورة الشهرية أو السنوية.", requirements: "📋 **متطلبات الدفع:**\n• رقم المشترك الموجود على الفاتورة 📄\n• بطاقة دفع إلكترونية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ أدخل رقم المشترك\n2️⃣ اختر الفاتورة المراد دفعها\n3️⃣ اضغط على 'دفع'\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد وطباعة الإيصال", needsCard: false },
            { name: "🌐 شحن الانترنت", img: "ALGERIE TELECOM.png", url: "https://paiement.at.dz/index.php?p=internet_recharge&pr=in", description: "شحن رصيد الانترنت (Algerie Telecom)", benefit: "🔹 **فائدة الرابط:** شحن رصيد الانترنت الخاص بك من منزلك.\n🔹 خدمة سريعة وآمنة من اتصالات الجزائر.", requirements: "📋 **متطلبات الدفع:**\n• رقم الهاتف الثابت أو حساب الانترنت 📡\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اضغط على الرابط\n2️⃣ أدخل بيانات حسابك\n3️⃣ اختر المبلغ المناسب\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد العملية\n6️⃣ سيصلك الرصيد فوراً", needsCard: true }
        ];

        // قوانين نشر الإعلانات + فوائد البوت
        const AD_RULES = `📜 **قوانين نشر الإعلانات:**

❌ لا إعلانات مخلة بالآداب
❌ لا عنف أو كراهية
❌ لا منتجات ممنوعة أو احتيال
❌ لا إعلانات سياسية أو دينية
✅ الإعلان يكون حلالاً ومفيداً
✅ يحترم قوانين النشر في الجزائر

⚠️ المخالفة تؤدي إلى حظر الحساب فوراً.

━━━━━━━━━━━━━━━━━━━
🎯 **فوائد بوت مصطفى:**

💰 وصول لأكثر من 5000 عميل يومياً
📢 نشر إعلانك على صفحتنا بقوة
⚡ زيادة مبيعاتك بنسبة تصل إلى 70%
🖼️ دعم الصور والفيديوهات
📱 وسائل تواصل متعددة (واتساب - مسنجر - هاتف)
🛡️ أمان تام وحماية خصوصيتك
⏰ دعم فني على مدار الساعة
🎁 عروض وخصومات حصرية للمشتركين`;

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2500); }
        
        function getSubscription() { 
            if (!currentUser) return { active: false, days: 0 }; 
            const expiry = localStorage.getItem(`sub_${currentUser}`); 
            if (expiry && Date.now() < parseInt(expiry)) { 
                const days = Math.ceil((parseInt(expiry) - Date.now()) / 86400000); 
                return { active: true, days }; 
            } 
            return { active: false, days: 0 }; 
        }
        
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            const sub = getSubscription();
            if (sub.active) {
                document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
                document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                document.getElementById('paymentSection').innerHTML = '';
            } else {
                document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
                document.getElementById('planText').innerHTML = '⚠️ يرجى الاشتراك للوصول إلى جميع الخدمات';
                document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8', '_blank')">📅 اشتراك سنوي 1000 دج</button></div><div style="font-size:12px; color:#666; margin-top:8px;">💡 أقل من 4 دج إشتراك يومياً</div>`;
            }
        }

        // نظام الدخول
        document.getElementById('loginBtn').onclick = () => { 
            const email = document.getElementById('emailInput').value.trim(); 
            if (!email || !email.includes('@')) { 
                document.getElementById('loginMsg').innerText = '❌ أدخل بريداً إلكترونياً صحيحاً'; 
                return; 
            } 
            currentUser = email; 
            localStorage.setItem('currentUser', currentUser); 
            document.getElementById('loginSection').style.display = 'none'; 
            document.getElementById('appSection').style.display = 'block'; 
            updateUI(); 
            showToast(`مرحباً ${email.split('@')[0]} في بوت مصطفى 🚀`); 
        };
        
        document.getElementById('logoutBtn').onclick = () => { 
            currentUser = null; 
            localStorage.removeItem('currentUser'); 
            document.getElementById('loginSection').style.display = 'block'; 
            document.getElementById('appSection').style.display = 'none'; 
            document.getElementById('emailInput').value = ''; 
            pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, showType: null, media: null, mediaType: null }; 
            pendingService = null; 
            showToast('تم تسجيل الخروج'); 
        };
        
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) { 
            currentUser = savedUser; 
            document.getElementById('loginSection').style.display = 'none'; 
            document.getElementById('appSection').style.display = 'block'; 
            updateUI(); 
        }

        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatFull = document.getElementById('chatFullscreen');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const topBotBar = document.getElementById('topBotBar');
        const mediaUploadBtn = document.getElementById('mediaUploadBtn');
        const mediaInput = document.getElementById('mediaInput');

        topBotBar.onclick = () => { chatFull.classList.add('open'); if (messagesDiv.children.length === 0) initChat(); };
        closeChatBtn.onclick = () => chatFull.classList.remove('open');

        function showTypingIndicator() { const typingDiv = document.createElement('div'); typingDiv.className = 'bot-msg'; typingDiv.id = 'typingIndicator'; typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; messagesDiv.appendChild(typingDiv); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
        function removeTypingIndicator() { const indicator = document.getElementById('typingIndicator'); if (indicator) indicator.remove(); }
        
        function addMessage(text, isUser) { 
            const div = document.createElement('div'); 
            div.className = isUser ? 'user-msg' : 'bot-msg'; 
            div.innerText = text; 
            messagesDiv.appendChild(div); 
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        }
        
        function addMediaMessage(mediaDataUrl, type, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? (type === 'image' ? 'user-msg-img' : 'user-msg-video') : 'bot-msg';
            if (type === 'image') {
                const img = document.createElement('img');
                img.src = mediaDataUrl;
                img.style.maxWidth = '200px';
                img.style.maxHeight = '200px';
                img.style.borderRadius = '12px';
                div.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.src = mediaDataUrl;
                video.controls = true;
                video.style.maxWidth = '220px';
                video.style.maxHeight = '220px';
                video.style.borderRadius = '12px';
                div.appendChild(video);
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // عرض معاينة الإعلان كما سيظهر على فيسبوك - تظهر مباشرة للمستخدم
        function showFacebookPreview() {
            let contactText = '';
            let contactIcon = '';
            if (pendingAd.contactMethod === 'whatsapp') {
                contactText = `واتساب: ${pendingAd.phone}`;
                contactIcon = '💚';
            } else if (pendingAd.contactMethod === 'messenger') {
                contactText = `مسنجر: ${pendingAd.phone}`;
                contactIcon = '💬';
            } else {
                contactText = `هاتف: ${pendingAd.phone}`;
                contactIcon = '📱';
            }
            
            const previewContainer = document.createElement('div');
            previewContainer.style.margin = '10px 0';
            
            const previewTitle = document.createElement('div');
            previewTitle.className = 'bot-msg';
            previewTitle.innerText = '🔍 **معاينة الإعلان كما سيظهر على فيسبوك:**';
            previewContainer.appendChild(previewTitle);
            
            const previewDiv = document.createElement('div');
            previewDiv.className = 'facebook-preview';
            
            let mediaHtml = '';
            if (pendingAd.media && pendingAd.mediaType === 'image') {
                mediaHtml = `<img class="fb-media" src="${pendingAd.media}" alt="صورة الإعلان">`;
            } else if (pendingAd.media && pendingAd.mediaType === 'video') {
                mediaHtml = `<video class="fb-media-video" src="${pendingAd.media}" controls style="width:100%; max-height:400px;"></video>`;
            } else {
                mediaHtml = `<div style="background:#f0f2f5; height:200px; display:flex; align-items:center; justify-content:center; color:#65676B;">🖼️ بدون صورة</div>`;
            }
            
            previewDiv.innerHTML = `
                <div class="fb-header">
                    <div class="fb-avatar">${pendingAd.fullName ? pendingAd.fullName.charAt(0).toUpperCase() : 'م'}</div>
                    <div>
                        <div class="fb-name">${pendingAd.fullName || 'اسم المستخدم'}</div>
                        <div class="fb-time">الآن · 🌍</div>
                    </div>
                </div>
                <div class="fb-content">
                    ${pendingAd.description || '📢 إعلان جديد'}
                </div>
                ${mediaHtml}
                <div class="fb-contact">
                    ${contactIcon} ${contactText}
                </div>
                <div class="fb-buttons">
                    <span>👍 أعجبني</span>
                    <span>💬 تعليق</span>
                    <span>📤 مشاركة</span>
                </div>
            `;
            
            previewContainer.appendChild(previewDiv);
            
            // إضافة أزرار التأكيد
            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'confirm-buttons';
            buttonsDiv.innerHTML = `
                <button class="confirm-yes" onclick="window.confirmPublish(true)">✅ نعم، أنشر الإعلان</button>
                <button class="confirm-no" onclick="window.confirmPublish(false)">❌ لا، إلغاء</button>
            `;
            previewContainer.appendChild(buttonsDiv);
            
            messagesDiv.appendChild(previewContainer);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.confirmPublish = async (confirmed) => {
            if (confirmed) {
                addMessage("🚀 جاري نشر إعلانك على صفحة فيسبوك...", false);
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 2000));
                removeTypingIndicator();
                addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\n\nسيظهر إعلانك بهذه الطريقة لمئات العملاء يومياً.\nشكراً لاستخدامك بوت مصطفى.", false);
            } else {
                addMessage("🙂 تم إلغاء نشر الإعلان. يمكنك البدء من جديد.", false);
            }
            pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, showType: null, media: null, mediaType: null };
        };

        function showContactButtons() {
            const div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `
                <div>📞 **اختر وسيلة التواصل التي ستظهر في الإعلان:**</div>
                <div class="contact-buttons">
                    <button class="contact-btn" onclick="window.selectContactMethod('whatsapp')">💚 واتساب</button>
                    <button class="contact-btn messenger" onclick="window.selectContactMethod('messenger')">💬 مسنجر</button>
                    <button class="contact-btn phone" onclick="window.selectContactMethod('phone')">📱 هاتف</button>
                </div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.selectContactMethod = (method) => {
            pendingAd.contactMethod = method;
            let methodName = '';
            if (method === 'whatsapp') methodName = '💚 واتساب';
            else if (method === 'messenger') methodName = '💬 مسنجر';
            else methodName = '📱 هاتف';
            addMessage(`✅ تم اختيار: ${methodName}`, false);
            
            addMessage("📸 **كيف سيظهر منتجك أو خدمتك في الإعلان؟**\n\nاختر نوع العرض:", false);
            
            const typeDiv = document.createElement('div');
            typeDiv.className = 'contact-buttons';
            typeDiv.innerHTML = `
                <button class="contact-btn" onclick="window.selectShowType('image')">🖼️ صورة</button>
                <button class="contact-btn messenger" onclick="window.selectShowType('video')">🎬 فيديو</button>
            `;
            messagesDiv.appendChild(typeDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            pendingAd.step = 'waitingForShowType';
        };
        
        window.selectShowType = (type) => {
            pendingAd.showType = type;
            addMessage(`✅ تم اختيار العرض كـ ${type === 'image' ? 'صورة' : 'فيديو'}`, false);
            addMessage(`🖼️ الآن قم برفع ${type === 'image' ? 'الصورة' : 'الفيديو'} بالضغط على زر "📷 صورة / فيديو"`, false);
            pendingAd.step = 'media';
        };

        async function startAdFlow() {
            addMessage(AD_RULES, false);
            await new Promise(resolve => setTimeout(resolve, 1000));
            addMessage("📢 **لنبدأ عملية نشر إعلانك على فيسبوك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (الاسم واللقب) كما سيظهر في الإعلان:", false);
            pendingAd = { step: 'fullName', fullName: null, phone: null, description: null, contactMethod: null, showType: null, media: null, mediaType: null };
        }

        mediaUploadBtn.onclick = () => { mediaInput.click(); };
        mediaInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileType = file.type;
            let mediaType = null;
            if (fileType.startsWith('image/')) mediaType = 'image';
            else if (fileType.startsWith('video/')) mediaType = 'video';
            else {
                showToast("❌ يرجى اختيار صورة أو فيديو فقط");
                mediaInput.value = '';
                return;
            }
            
            if (pendingAd.showType && pendingAd.showType !== mediaType) {
                showToast(`❌ لقد اخترت عرض ${pendingAd.showType === 'image' ? 'صورة' : 'فيديو'} ولكنك رفعت ${mediaType === 'image' ? 'صورة' : 'فيديو'}. يرجى رفع الملف الصحيح`);
                mediaInput.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (event) => {
                pendingAd.media = event.target.result;
                pendingAd.mediaType = mediaType;
                addMediaMessage(pendingAd.media, mediaType, true);
                addMessage(`✅ تم استلام ${mediaType === 'image' ? 'الصورة' : 'الفيديو'} بنجاح!`, false);
                addMessage("🔄 جاري إنشاء معاينة الإعلان كما سيظهر على فيسبوك...", false);
                // عرض المعاينة للمستخدم
                setTimeout(() => {
                    showFacebookPreview();
                }, 500);
            };
            reader.readAsDataURL(file);
            mediaInput.value = '';
        };

        async function handleAdFlow(userMessage) {
            if (pendingAd.step === 'fullName') {
                if (userMessage.trim().length < 3) {
                    addMessage("❌ يرجى إدخال الاسم الكامل بشكل صحيح (3 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.fullName = userMessage.trim();
                addMessage(`✅ تم تسجيل الاسم: ${pendingAd.fullName}`, false);
                addMessage("📱 **رقم الهاتف (للتواصل):**\nأرسل رقم هاتفك الذي سيتواصل معك العملاء عليه:", false);
                pendingAd.step = 'phone';
                return true;
            }
            
            if (pendingAd.step === 'phone') {
                if (userMessage.length < 9) {
                    addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)", false);
                    return false;
                }
                pendingAd.phone = userMessage.trim();
                addMessage(`✅ تم تسجيل رقم الهاتف: ${pendingAd.phone}`, false);
                addMessage("📝 **الوصف:**\nأكتب وصفاً مفصلاً لمنتجك أو خدمتك (سيظهر في الإعلان):", false);
                pendingAd.step = 'description';
                return true;
            }
            
            if (pendingAd.step === 'description') {
                if (userMessage.trim().length < 5) {
                    addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.description = userMessage.trim();
                addMessage(`✅ تم تسجيل الوصف`, false);
                showContactButtons();
                pendingAd.step = 'waitingForContact';
                return true;
            }
            
            if (pendingAd.step === 'waitingForContact' || pendingAd.step === 'waitingForShowType') {
                return true;
            }
            
            return false;
        }

        async function handleGeneralMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى (شحن الجوال، فواتير، إنترنت) اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان على فيسبوك: اضغط على الأيقونة البرتقالية الكبيرة";
            if (lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            if (lower.includes('القوانين')) return AD_RULES;
            if (lower.includes('فوائد')) return AD_RULES;
            return "📢 **بوت مصطفى - خدمة الإعلانات**\n\n📢 لنشر إعلان على فيسبوك: اضغط على الأيقونة البرتقالية الكبيرة\n\n✅ للخدمات الأخرى: اضغط على الأيقونات العادية";
        }

        function buildIcons() {
            const container = document.createElement('div');
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `<img src="facebook-ads-logo.png" alt="خدمة الإعلانات" onerror="this.src='https://via.placeholder.com/180/ffffff/ff6b35?text=ADS'"><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك على فيسبوك</span>`;
            mainAdDiv.onclick = async () => { const sub = getSubscription(); if (!sub.active) { addMessage(`⚠️ **خدمة الإعلانات تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).`, false); return; } await startAdFlow(); };
            container.appendChild(mainAdDiv);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => { const item = document.createElement('div'); item.className = 'icon-item'; const img = document.createElement('img'); img.src = s.img; img.alt = s.name; img.onerror = () => { img.style.display = 'none'; }; const span = document.createElement('span'); span.innerText = s.name; item.appendChild(img); item.appendChild(span); item.onclick = async () => { const sub = getSubscription(); if (!sub.active) { addMessage(`⚠️ **خدمة "${s.name}" تتطلب اشتراكاً نشطاً.**`, false); return; } showDetailedServiceExplanation(s); }; grid.appendChild(item); });
            container.appendChild(grid);
            return container;
        }
        
        function showDetailedServiceExplanation(service) {
            let msg = `📌 **${service.name}** - ${service.description}\n\n${service.benefit}\n\n${service.requirements}\n\n${service.steps}\n\n`;
            if (service.needsCard) msg += `💳 **ملاحظة مهمة:** تحتاج إلى بطاقة بنكية (ذهبية أو CIB) لإتمام عملية الدفع.\n\n`;
            msg += `❓ **هل أنت جاهز لفتح الرابط الآن؟**\nأجب بـ 'نعم' لفتح الرابط مباشرة، أو 'لا' للعودة للقائمة.`;
            addMessage(msg, false);
            pendingService = service;
        }

        async function handleServiceReply(text) {
            const lower = text.trim().toLowerCase();
            if (lower === 'نعم' || lower === 'yes' || lower === 'جاهز') {
                if (pendingService) {
                    window.open(pendingService.url, '_blank');
                    addMessage(`✅ **تم فتح رابط "${pendingService.name}" بنجاح!**`, false);
                    pendingService = null;
                }
                return true;
            } else if (lower === 'لا' || lower === 'لأ') {
                addMessage("🙂 يمكنك اختيار خدمة أخرى من الأيقونات.", false);
                pendingService = null;
                return true;
            }
            return false;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            const sub = getSubscription();
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨

📢 **خدمة الإعلانات على فيسبوك هي خدمتنا الأساسية**

**الخدمات الأخرى المتاحة:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة الرئيسية
• للخدمات الأخرى: اضغط على الأيقونات العادية`;

            if (!sub.active && currentUser) welcomeMsg += `\n\n⚠️ **ملاحظة:** ليس لديك اشتراك نشط.\n💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج)`;
            else if (!currentUser) welcomeMsg += `\n\n🔐 يرجى تسجيل الدخول أولاً`;
            else if (sub.active) welcomeMsg += `\n\n✅ اشتراكك مفعل - مرحبا بك`;

            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            const text = chatInput.value.trim();
            
            if (text) {
                addMessage(text, true);
                chatInput.value = '';
            }
            
            if (pendingAd.step && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'waitingForShowType') {
                if (!text && pendingAd.step !== 'media') return;
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            
            if (pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            
            if (!text) return;
            
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 800));
            removeTypingIndicator();
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };

        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        function checkPayment() { const urlParams = new URLSearchParams(window.location.search); const code = urlParams.get('code'); const days = urlParams.get('days'); if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) { const expiry = Date.now() + (parseInt(days) * 86400000); localStorage.setItem(`sub_${currentUser}`, expiry); showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`); updateUI(); if (messagesDiv.children.length > 0) initChat(); } }
        checkPayment();
    </script>
</body>
</html>
