<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات (مجاني بالكامل)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .top-bot-bar {
            width: 100%;
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 80px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: glow 2s infinite;
        }
        .top-bot-bar:hover { transform: scale(1.02); }
        @keyframes glow {
            0% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(0, 123, 255, 0.6); }
            100% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
        }
        .top-bot-text { font-size: 2.2rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .top-bot-text span:first-child { font-size: 3rem; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .container { max-width: 550px; width: 100%; }
        .card { background: white; border-radius: 35px; padding: 25px 20px; text-align: center; box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2); }
        .version { font-size: 14px; color: #6c757d; margin-bottom: 20px; font-weight: bold; }
        .auth-input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 50px; border: 1px solid #ddd; font-size: 16px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; border-radius: 50px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .marketplace-link-btn {
            background: linear-gradient(135deg, #6f42c1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .user-info { background: #e8f0fe; border-radius: 25px; padding: 15px; margin: 15px 0; }
        .user-name { font-size: 24px; font-weight: bold; color: #0f3460; word-break: break-all; }
        .sub-days { background: #d4edda; border-radius: 40px; padding: 8px; margin: 10px 0; font-size: 14px; color: #155724; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .payment-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; border-radius: 50px; padding: 12px 25px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .chat-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 10000; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.3s; direction: rtl; }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .bot-msg, .user-msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.5; animation: fadeIn 0.3s; white-space: pre-wrap; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bot-msg { background: #e3f2fd; align-self: flex-start; border-bottom-right-radius: 5px; }
        .user-msg { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; }
        .user-msg-img, .user-msg-video { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; padding: 8px 12px; max-width: 85%; }
        .user-msg-img img { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 5px; }
        .user-msg-video video { max-width: 220px; max-height: 220px; border-radius: 12px; margin-top: 5px; }
        .facebook-preview {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 100%;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
        }
        .fb-header { display: flex; align-items: center; padding: 12px; gap: 10px; }
        .fb-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #007bff, #00c6ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .fb-name { font-weight: bold; font-size: 14px; color: #050505; }
        .fb-time { font-size: 11px; color: #65676B; }
        .fb-content { padding: 0 12px 8px 12px; font-size: 14px; color: #050505; }
        .fb-media { width: 100%; max-height: 400px; object-fit: cover; background: #f0f2f5; }
        .fb-media-video { width: 100%; max-height: 400px; background: #000; }
        .fb-contact { padding: 10px 12px; background: #f0f2f5; margin: 8px; border-radius: 8px; font-size: 13px; direction: rtl; text-align: center; }
        .fb-buttons { display: flex; justify-content: space-around; padding: 8px 12px; border-top: 1px solid #e4e6eb; color: #65676B; font-size: 13px; }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-wrap: wrap; }
        #chatInput { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px; font-family: inherit; font-size: 15px; min-width: 120px; }
        #sendBtn { background: #28a745; color: white; border: none; border-radius: 30px; padding: 0 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #mediaUploadBtn { background: #007bff; color: white; border: none; border-radius: 30px; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; }
        #mediaInput { display: none; }
        .contact-buttons { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
        .contact-btn { background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .contact-btn.messenger { background: linear-gradient(135deg, #0084ff, #0063d1); }
        .contact-btn.phone { background: linear-gradient(135deg, #34b7f1, #1c8ad9); }
        .contact-btn:hover { transform: scale(1.05); }
        .confirm-buttons { display: flex; gap: 10px; margin: 10px 0; justify-content: center; flex-wrap: wrap; }
        .confirm-yes { background: #28a745; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .confirm-no { background: #dc3545; color: white; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: #ffc107; color: #333; border: none; border-radius: 50px; padding: 10px 25px; cursor: pointer; font-weight: bold; }
        .icon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: white; border-radius: 20px; padding: 16px; margin: 10px 0; }
        @media (min-width: 550px) { .icon-grid { grid-template-columns: repeat(3, 1fr); } }
        .icon-item { background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 20px; padding: 12px 8px; cursor: pointer; text-align: center; border: 2px solid #dee2e6; transition: all 0.3s; }
        .icon-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); border-color: #007bff; }
        .icon-item img { width: 55px; height: 55px; object-fit: contain; border-radius: 12px; margin-bottom: 6px; }
        .icon-item span { font-size: 12px; display: block; font-weight: bold; color: #333; }
        .main-ad-icon {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            text-align: center;
            margin: 15px 0;
            border: 3px solid #ffd700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .main-ad-icon:hover { transform: translateY(-8px) scale(1.02); }
        .main-ad-icon .main-icon-title { font-size: 24px; font-weight: bold; color: white; display: block; margin-bottom: 6px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: 0.3s; z-index: 9999; font-weight: bold; pointer-events: none; }
        .typing { display: flex; gap: 4px; align-items: center; }
        .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; display: inline-block; animation: typingAnim 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        .footer-links { text-align: center; margin-top: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; max-width: 550px; width: 100%; }
        .footer-links a { color: white; text-decoration: none; margin: 0 8px; font-size: 13px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-bot-bar" id="topBotBar">
        <div class="top-bot-text">
            <span>🤖</span>
            <span>بوت مصطفى</span>
            <span>✨</span>
        </div>
        <div class="top-bot-sub">خدمة الإعلانات · شحن · فواتير (مجاني بالكامل)</div>
    </div>

    <div class="container">
        <div class="card">
            <div class="version">⭐ بوت مصطفى · جميع الخدمات مجانية ⭐</div>

            <div id="loginSection">
                <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني" required>
                <button id="loginBtn" class="btn">🚪 دخول / إنشاء حساب</button>
                <button id="marketplaceGuestBtn" class="marketplace-link-btn" style="margin-top:10px;">🛒 دخول إلى سوق مصطفى (بدون تسجيل)</button>
                <div id="loginMsg" style="color:#e94560; margin-top:8px; font-size:13px;"></div>
            </div>

            <div id="appSection" style="display: none;">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="sub-days" id="freeAccessMsg">✅ جميع الخدمات متاحة مجاناً</div>
                </div>
                <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
                <button id="marketplaceBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">📖 من نحن</a> |
        <a href="#">📞 اتصل بنا</a> |
        <a href="#">🔒 سياسة الخصوصية</a> |
        <a href="#">📜 الشروط والأحكام</a>
    </div>

    <div id="toast" class="toast"></div>

    <div id="chatFullscreen" class="chat-fullscreen">
        <div class="chat-header">
            <span>🤖 بوت مصطفى | خدمة الإعلانات (مجاني)</span>
            <button class="close-btn" id="closeChatBtn">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
            <button id="mediaUploadBtn">📷 صورة / فيديو</button>
            <input type="file" id="mediaInput" accept="image/*,video/*">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isBotTyping = false;
        let pendingService = null;
        let pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, media: null, mediaType: null };

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2500); }
        
        // إلغاء نظام الاشتراك: كل شيء متاح دائماً
        function isSubscribed() { return true; }
        
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            // إزالة أي رسائل دفع أو اشتراك
        }
        
        document.getElementById('marketplaceGuestBtn').onclick = () => { window.open('marketplace.html', '_blank'); };
        document.getElementById('marketplaceBtn').onclick = () => { window.open('marketplace.html', '_blank'); };

        document.getElementById('loginBtn').onclick = () => { 
            const email = document.getElementById('emailInput').value.trim(); 
            if (!email || !email.includes('@')) { 
                document.getElementById('loginMsg').innerText = '❌ أدخل بريداً إلكترونياً صحيحاً'; 
                return; 
            } 
            currentUser = email; 
            localStorage.setItem('currentUser', currentUser); 
            document.getElementById('loginSection').style.display = 'none'; 
            document.getElementById('appSection').style.display = 'block'; 
            updateUI(); 
            showToast(`مرحباً ${email.split('@')[0]} في بوت مصطفى 🚀`); 
        };
        
        document.getElementById('logoutBtn').onclick = () => { 
            currentUser = null; 
            localStorage.removeItem('currentUser'); 
            document.getElementById('loginSection').style.display = 'block'; 
            document.getElementById('appSection').style.display = 'none'; 
            document.getElementById('emailInput').value = ''; 
            pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, media: null, mediaType: null };
            pendingService = null; 
            document.getElementById('mediaUploadBtn').style.display = 'none';
            showToast('تم تسجيل الخروج'); 
        };
        
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) { 
            currentUser = savedUser; 
            document.getElementById('loginSection').style.display = 'none'; 
            document.getElementById('appSection').style.display = 'block'; 
            updateUI(); 
        }

        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatFull = document.getElementById('chatFullscreen');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const topBotBar = document.getElementById('topBotBar');
        const mediaUploadBtn = document.getElementById('mediaUploadBtn');
        const mediaInput = document.getElementById('mediaInput');

        topBotBar.onclick = () => { chatFull.classList.add('open'); if (messagesDiv.children.length === 0) initChat(); };
        closeChatBtn.onclick = () => chatFull.classList.remove('open');

        function showTypingIndicator() { const typingDiv = document.createElement('div'); typingDiv.className = 'bot-msg'; typingDiv.id = 'typingIndicator'; typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; messagesDiv.appendChild(typingDiv); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
        function removeTypingIndicator() { const indicator = document.getElementById('typingIndicator'); if (indicator) indicator.remove(); }
        
        function addMessage(text, isUser) { 
            const div = document.createElement('div'); 
            div.className = isUser ? 'user-msg' : 'bot-msg'; 
            div.innerText = text; 
            messagesDiv.appendChild(div); 
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        }
        
        function addMediaMessage(mediaDataUrl, type, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? (type === 'image' ? 'user-msg-img' : 'user-msg-video') : 'bot-msg';
            if (type === 'image') {
                const img = document.createElement('img');
                img.src = mediaDataUrl;
                img.style.maxWidth = '200px';
                img.style.maxHeight = '200px';
                img.style.borderRadius = '12px';
                div.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.src = mediaDataUrl;
                video.controls = true;
                video.style.maxWidth = '220px';
                video.style.maxHeight = '220px';
                video.style.borderRadius = '12px';
                div.appendChild(video);
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showDetailedServiceExplanation(service) {
            let msg = `📌 **${service.name}** - ${service.description}\n\n${service.benefit}\n\n${service.requirements}\n\n${service.steps}\n\n`;
            if (service.needsCard) msg += `💳 **ملاحظة مهمة:** تحتاج إلى بطاقة بنكية (ذهبية أو CIB) لإتمام عملية الدفع.\n\n`;
            msg += `❓ **هل أنت جاهز لفتح الرابط الآن؟**\nأجب بـ 'نعم' لفتح الرابط مباشرة، أو 'لا' للعودة للقائمة.`;
            addMessage(msg, false);
            pendingService = service;
        }

        async function handleServiceReply(text) {
            const lower = text.trim().toLowerCase();
            if (lower === 'نعم' || lower === 'yes' || lower === 'جاهز') {
                if (pendingService) {
                    window.open(pendingService.url, '_blank');
                    addMessage(`✅ **تم فتح رابط "${pendingService.name}" بنجاح!**`, false);
                    pendingService = null;
                }
                return true;
            } else if (lower === 'لا' || lower === 'لأ' || lower === 'ليس الآن') {
                addMessage("🙂 لا مشكلة! يمكنك اختيار خدمة أخرى.", false);
                pendingService = null;
                return true;
            }
            return false;
        }

        async function startAdFlow() {
            addMessage(AD_RULES, false);
            await new Promise(resolve => setTimeout(resolve, 1000));
            addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (الاسم واللقب) كما سيظهر في الإعلان (إجباري):", false);
            pendingAd = { step: 'fullName', fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, media: null, mediaType: null };
            document.getElementById('mediaUploadBtn').style.display = 'inline-block';
        }

        function showMediaTypeChoice() {
            const div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `
                <div>📸 **اختر نوع الملف الذي تريد رفعه (إجباري):**</div>
                <div class="contact-buttons">
                    <button class="contact-btn" onclick="window.selectMediaType('image')">🖼️ صورة</button>
                    <button class="contact-btn messenger" onclick="window.selectMediaType('video')">🎬 فيديو</button>
                </div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.selectMediaType = (type) => {
            pendingAd.mediaTypeChoice = type;
            addMessage(`✅ تم اختيار ${type === 'image' ? 'صورة' : 'فيديو'}`, false);
            addMessage(`🖼️ **الآن قم برفع ${type === 'image' ? 'الصورة' : 'الفيديو'}** بالضغط على زر "📷 صورة / فيديو" (إجباري)`, false);
            pendingAd.step = 'media';
        };

        function showContactButtons() {
            const div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `
                <div>📞 **اختر وسيلة التواصل التي ستظهر في الإعلان (إجباري):**</div>
                <div class="contact-buttons">
                    <button class="contact-btn" onclick="window.selectContactMethod('whatsapp')"><span>💚</span> واتساب</button>
                    <button class="contact-btn messenger" onclick="window.selectContactMethod('messenger')"><span>💬</span> مسنجر</button>
                    <button class="contact-btn phone" onclick="window.selectContactMethod('phone')">📱 هاتف</button>
                </div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.selectContactMethod = (method) => {
            pendingAd.contactMethod = method;
            let methodName = method === 'whatsapp' ? 'واتساب' : (method === 'messenger' ? 'مسنجر' : 'هاتف');
            addMessage(`✅ تم اختيار: ${methodName}`, false);
            setTimeout(() => {
                addMessage("📋 **تم اكتمال جميع البيانات!** جاري عرض ملخص المعلومات...", false);
                showSummaryWithEditOptions();
                pendingAd.step = 'review';
            }, 500);
        };

        function showSummaryWithEditOptions() {
            let contactText = '';
            let contactIcon = '';
            if (pendingAd.contactMethod === 'whatsapp') { contactText = `واتساب: ${pendingAd.phone}`; contactIcon = '💚'; }
            else if (pendingAd.contactMethod === 'messenger') { contactText = `مسنجر: ${pendingAd.phone}`; contactIcon = '💬'; }
            else { contactText = `هاتف: ${pendingAd.phone}`; contactIcon = '📱'; }
            
            const summaryContainer = document.createElement('div');
            summaryContainer.style.margin = '10px 0';
            const summaryTitle = document.createElement('div');
            summaryTitle.className = 'bot-msg';
            summaryTitle.innerText = '📋 **مراجعة معلومات الإعلان:**';
            summaryContainer.appendChild(summaryTitle);
            const infoDiv = document.createElement('div');
            infoDiv.className = 'bot-msg';
            infoDiv.style.direction = 'rtl';
            infoDiv.style.textAlign = 'right';
            infoDiv.innerHTML = `
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>👤 الاسم الكامل:</strong> ${pendingAd.fullName}
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('fullName')">تعديل</button>
                </div>
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>📞 رقم الهاتف:</strong> ${pendingAd.phone}
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('phone')">تعديل</button>
                </div>
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>📝 الوصف:</strong> ${pendingAd.description}
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('description')">تعديل</button>
                </div>
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>🖼️ نوع الملف:</strong> ${pendingAd.mediaTypeChoice === 'image' ? 'صورة' : 'فيديو'}
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('mediaTypeChoice')">تعديل</button>
                </div>
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>📎 الملف:</strong> ✅ مرفق
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('media')">تغيير الملف</button>
                </div>
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 12px;">
                    <strong>💬 وسيلة التواصل:</strong> ${contactIcon} ${contactText}
                    <button class="edit-btn" style="padding: 4px 12px; font-size: 12px; margin-right: 10px;" onclick="window.editField('contactMethod')">تعديل</button>
                </div>
            `;
            summaryContainer.appendChild(infoDiv);
            const confirmDiv = document.createElement('div');
            confirmDiv.className = 'confirm-buttons';
            confirmDiv.innerHTML = `
                <button class="confirm-yes" onclick="window.proceedToPreview()">✅ متابعة إلى المعاينة</button>
                <button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء الإعلان</button>
            `;
            summaryContainer.appendChild(confirmDiv);
            messagesDiv.appendChild(summaryContainer);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.editField = (field) => {
            let promptMessage = '';
            switch(field) {
                case 'fullName': promptMessage = 'أدخل الاسم الكامل الجديد:'; break;
                case 'phone': promptMessage = 'أدخل رقم الهاتف الجديد:'; break;
                case 'description': promptMessage = 'أدخل الوصف الجديد:'; break;
                case 'mediaTypeChoice': showMediaTypeChoice(); pendingAd.step = 'waitingForMediaTypeChoice'; return;
                case 'media': addMessage("🖼️ الرجاء رفع ملف جديد:", false); pendingAd.step = 'editingMedia'; return;
                case 'contactMethod': addMessage("📞 اختر وسيلة التواصل الجديدة:", false); showContactButtonsForEdit(); return;
            }
            addMessage(promptMessage, false);
            pendingAd.step = `editing_${field}`;
        };
        
        function showContactButtonsForEdit() {
            const div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `<div class="contact-buttons">
                <button class="contact-btn" onclick="window.selectContactMethodForEdit('whatsapp')">💚 واتساب</button>
                <button class="contact-btn messenger" onclick="window.selectContactMethodForEdit('messenger')">💬 مسنجر</button>
                <button class="contact-btn phone" onclick="window.selectContactMethodForEdit('phone')">📱 هاتف</button>
            </div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.selectContactMethodForEdit = (method) => {
            pendingAd.contactMethod = method;
            let methodName = method === 'whatsapp' ? 'واتساب' : (method === 'messenger' ? 'مسنجر' : 'هاتف');
            addMessage(`✅ تم تغيير وسيلة التواصل إلى: ${methodName}`, false);
            setTimeout(() => showSummaryWithEditOptions(), 500);
        };
        
        window.proceedToPreview = () => {
            if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaTypeChoice || !pendingAd.media) {
                addMessage("⚠️ يرجى التأكد من اكتمال جميع البيانات قبل المتابعة", false);
                return;
            }
            showFacebookPreview();
        };
        
        window.cancelAd = () => {
            addMessage("🙂 تم إلغاء الإعلان. يمكنك البدء من جديد بالضغط على الأيقونة البرتقالية.", false);
            pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, media: null, mediaType: null };
            document.getElementById('mediaUploadBtn').style.display = 'none';
        };

        function showFacebookPreview() {
            let contactText = '', contactIcon = '';
            if (pendingAd.contactMethod === 'whatsapp') { contactText = `واتساب: ${pendingAd.phone}`; contactIcon = '💚'; }
            else if (pendingAd.contactMethod === 'messenger') { contactText = `مسنجر: ${pendingAd.phone}`; contactIcon = '💬'; }
            else { contactText = `هاتف: ${pendingAd.phone}`; contactIcon = '📱'; }
            
            const previewContainer = document.createElement('div');
            previewContainer.style.margin = '10px 0';
            const previewTitle = document.createElement('div');
            previewTitle.className = 'bot-msg';
            previewTitle.innerText = '🔍 **معاينة الإعلان كما سيظهر:**';
            previewContainer.appendChild(previewTitle);
            const previewDiv = document.createElement('div');
            previewDiv.className = 'facebook-preview';
            let mediaHtml = '';
            if (pendingAd.media && pendingAd.mediaType === 'image') mediaHtml = `<img class="fb-media" src="${pendingAd.media}" alt="صورة الإعلان">`;
            else if (pendingAd.media && pendingAd.mediaType === 'video') mediaHtml = `<video class="fb-media-video" src="${pendingAd.media}" controls style="width:100%; max-height:400px;"></video>`;
            previewDiv.innerHTML = `
                <div class="fb-header"><div class="fb-avatar">${pendingAd.fullName ? pendingAd.fullName.charAt(0).toUpperCase() : 'م'}</div>
                <div><div class="fb-name">${pendingAd.fullName}</div><div class="fb-time">الآن · 🌍</div></div></div>
                <div class="fb-content">${pendingAd.description}</div>${mediaHtml}
                <div class="fb-contact">${contactIcon} ${contactText}</div>
                <div class="fb-buttons"><span>👍 أعجبني</span><span>💬 تعليق</span><span>📤 مشاركة</span></div>
            `;
            previewContainer.appendChild(previewDiv);
            const finalButtons = document.createElement('div');
            finalButtons.className = 'confirm-buttons';
            finalButtons.innerHTML = `
                <button class="confirm-yes" onclick="window.finalPublish()">✅ تأكيد النشر</button>
                <button class="edit-btn" onclick="window.backToEdit()">✏️ العودة للتعديل</button>
                <button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء</button>
            `;
            previewContainer.appendChild(finalButtons);
            messagesDiv.appendChild(previewContainer);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.backToEdit = () => {
            if (messagesDiv.lastChild) messagesDiv.removeChild(messagesDiv.lastChild);
            showSummaryWithEditOptions();
        };
        
        mediaUploadBtn.onclick = () => mediaInput.click();
        mediaInput.onchange = async (e) => {
            const file = (e.target as HTMLInputElement).files?.[0];
            if (!file) return;
            const fileType = file.type;
            let mediaType = null;
            let processedFile = file;
            if (fileType.startsWith('image/')) {
                mediaType = 'image';
                if (pendingAd.mediaTypeChoice !== 'image') {
                    showToast(`❌ يجب رفع ${pendingAd.mediaTypeChoice === 'image' ? 'صورة' : 'فيديو'} كما اخترت سابقاً`);
                    mediaInput.value = '';
                    return;
                }
                try {
                    showToast("🔄 جاري ضغط الصورة...");
                    const compressedBlob = await compressImage(file, 800, 800, 0.7);
                    processedFile = new File([compressedBlob], file.name, { type: 'image/jpeg' });
                    showToast("✅ تم ضغط الصورة بنجاح!");
                } catch(e) { console.error(e); }
            } else if (fileType.startsWith('video/')) {
                mediaType = 'video';
                if (pendingAd.mediaTypeChoice !== 'video') {
                    showToast(`❌ يجب رفع فيديو كما اخترت سابقاً`);
                    mediaInput.value = '';
                    return;
                }
                showToast("🎬 جاري تجهيز الفيديو...");
            } else {
                showToast("❌ يرجى اختيار صورة أو فيديو فقط");
                mediaInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
                pendingAd.media = event.target?.result as string;
                pendingAd.mediaType = mediaType;
                addMediaMessage(pendingAd.media, mediaType, true);
                addMessage(`✅ تم استلام ${mediaType === 'image' ? 'الصورة' : 'الفيديو'} بنجاح!`, false);
                setTimeout(() => {
                    addMessage("📝 **الوصف:**\nأكتب وصفاً مفصلاً لمنتجك أو خدمتك (إجباري):", false);
                    pendingAd.step = 'description';
                }, 500);
            };
            reader.readAsDataURL(processedFile);
            mediaInput.value = '';
        };

        window.finalPublish = async () => {
            if ((window as any).isPublishing) return;
            (window as any).isPublishing = true;
            try {
                addMessage("🚀 جاري نشر إعلانك...", false);
                showTypingIndicator();
                if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaTypeChoice || !pendingAd.media) {
                    addMessage("⚠️ خطأ: البيانات غير مكتملة.", false);
                    removeTypingIndicator();
                    (window as any).isPublishing = false;
                    return;
                }
                let existingAds = [];
                const stored = localStorage.getItem('marketplace_ads');
                if (stored) try { existingAds = JSON.parse(stored); } catch(e) {}
                const newAd = {
                    id: Date.now(), name: pendingAd.fullName, phone: pendingAd.phone, description: pendingAd.description,
                    contactMethod: pendingAd.contactMethod, image: pendingAd.media, imageType: pendingAd.mediaType,
                    userId: currentUser, date: Date.now(), views: 0, likes: 0
                };
                existingAds.unshift(newAd);
                localStorage.setItem('marketplace_ads', JSON.stringify(existingAds));
                await new Promise(resolve => setTimeout(resolve, 2000));
                removeTypingIndicator();
                addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\nشكراً لاستخدامك بوت مصطفى.\nيمكنك مشاهدة إعلانك في سوق مصطفى.", false);
                addMessage("🛒 **رابط سوق مصطفى:**\nhttps://benamar1973.github.io/marketplace.html", false);
                document.getElementById('mediaUploadBtn').style.display = 'none';
                pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, media: null, mediaType: null };
            } catch(error) {
                console.error(error);
                removeTypingIndicator();
                addMessage("⚠️ حدث خطأ أثناء النشر.", false);
            } finally {
                (window as any).isPublishing = false;
            }
        };

        async function handleAdFlow(userMessage) {
            if (pendingAd.step && pendingAd.step.startsWith('editing_')) {
                const field = pendingAd.step.replace('editing_', '');
                switch(field) {
                    case 'fullName': if (userMessage.trim().length < 3) { addMessage("❌ اسم قصير جداً", false); return false; } pendingAd.fullName = userMessage.trim(); addMessage(`✅ تم تحديث الاسم`, false); break;
                    case 'phone': if (userMessage.length < 9) { addMessage("❌ رقم غير صحيح", false); return false; } pendingAd.phone = userMessage.trim(); addMessage(`✅ تم تحديث الرقم`, false); break;
                    case 'description': if (userMessage.trim().length < 5) { addMessage("❌ وصف قصير جداً", false); return false; } pendingAd.description = userMessage.trim(); addMessage(`✅ تم تحديث الوصف`, false); break;
                }
                pendingAd.step = 'review';
                setTimeout(() => showSummaryWithEditOptions(), 500);
                return true;
            }
            if (pendingAd.step === 'fullName') {
                if (userMessage.trim().length < 3) { addMessage("❌ الاسم الكامل مطلوب (3 أحرف على الأقل)", false); return false; }
                pendingAd.fullName = userMessage.trim(); addMessage(`✅ تم تسجيل الاسم: ${pendingAd.fullName}`, false);
                addMessage("📱 **رقم الهاتف (للتواصل):**\nأرسل رقم هاتفك (إجباري):", false);
                pendingAd.step = 'phone'; return true;
            }
            if (pendingAd.step === 'phone') {
                if (userMessage.length < 9) { addMessage("❌ رقم هاتف غير صحيح", false); return false; }
                pendingAd.phone = userMessage.trim(); addMessage(`✅ تم تسجيل الرقم: ${pendingAd.phone}`, false);
                showMediaTypeChoice(); pendingAd.step = 'waitingForMediaTypeChoice'; return true;
            }
            if (pendingAd.step === 'description') {
                if (userMessage.trim().length < 5) { addMessage("❌ اكتب وصفاً أطول", false); return false; }
                pendingAd.description = userMessage.trim(); addMessage(`✅ تم تسجيل الوصف`, false);
                showContactButtons(); pendingAd.step = 'waitingForContact'; return true;
            }
            if (pendingAd.step === 'waitingForMediaTypeChoice' || pendingAd.step === 'waitingForContact') return true;
            return false;
        }

        async function handleGeneralMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى المجاني**.\n\n📢 **خدمة الإعلانات** متاحة للجميع بدون اشتراك.\n\n📱 للخدمات الأخرى (شحن الجوال، فواتير، إنترنت) اضغط على الأيقونات أدناه.";
            if (lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            if (lower.includes('القوانين')) return AD_RULES;
            return "📢 **بوت مصطفى - خدمة الإعلانات مجانية**\n\n✅ جميع الخدمات متاحة بدون دفع.\nاختر الخدمة من الأيقونات.";
        }

        function buildIcons() {
            const container = document.createElement('div');
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `<div style="font-size:42px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات (مجانية)</span><span class="main-icon-sub">انشر إعلانك الآن</span>`;
            mainAdDiv.onclick = async () => { await startAdFlow(); };
            container.appendChild(mainAdDiv);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => {
                const item = document.createElement('div'); item.className = 'icon-item';
                const img = document.createElement('img'); img.src = s.img; img.alt = s.name; img.onerror = () => img.style.display = 'none';
                const span = document.createElement('span'); span.innerText = s.name;
                item.appendChild(img); item.appendChild(span);
                item.onclick = () => { showDetailedServiceExplanation(s); };
                grid.appendChild(item);
            });
            container.appendChild(grid);
            return container;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى المجاني** ✨

📢 **خدمة الإعلانات متاحة للجميع بدون أي رسوم**

**الخدمات الأخرى المتاحة مجاناً:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة الرئيسية
• للخدمات الأخرى: اضغط على الأيقونات العادية`;
            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            const text = chatInput.value.trim();
            if (text) { addMessage(text, true); chatInput.value = ''; }
            if (pendingAd.step && pendingAd.step !== 'waitingForMediaTypeChoice' && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'review') {
                if (!text) return;
                isBotTyping = true; showTypingIndicator(); await new Promise(r => setTimeout(r, 500)); removeTypingIndicator();
                await handleAdFlow(text); isBotTyping = false; return;
            }
            if (pendingService) {
                isBotTyping = true; showTypingIndicator(); await new Promise(r => setTimeout(r, 500)); removeTypingIndicator();
                await handleServiceReply(text); isBotTyping = false; return;
            }
            if (!text) return;
            isBotTyping = true; showTypingIndicator(); await new Promise(r => setTimeout(r, 800)); removeTypingIndicator();
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    </script>
</body>
</html>
