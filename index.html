        // ضغط الصورة
        function compressImage(file, maxWidth=800, maxHeight=800, quality=0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w=img.width, h=img.height;
                        if(w>maxWidth) { h=(h*maxWidth)/w; w=maxWidth; }
                        if(h>maxHeight) { w=(w*maxHeight)/h; h=maxHeight; }
                        const canvas = document.createElement('canvas');
                        canvas.width=w; canvas.height=h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img,0,0,w,h);
                        canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

                <div class="fb-header"><div class="fb-avatar">${pendingAd.fullName.charAt(0)}</div><div><div class="fb-name">${pendingAd.fullName}</div><div class="fb-time">الآن</div></div></div>
                <div class="fb-content">${pendingAd.description}</div>
                <div style="background:#f0f2f5;padding:20px;text-align:center">📷 ${pendingAd.mediaTypeChoice==='image'?'الصورة':'الفيديو'} سيتم رفعه</div>
                <div class="fb-contact">${contactText}</div>
                <div class="fb-buttons"><span>👍 أعجبني</span><span>💬 تعليق</span><span>📤 مشاركة</span></div>
            `;
            container.appendChild(preview);
            const btns = document.createElement('div'); btns.className='confirm-buttons';
            btns.innerHTML = `<button class="confirm-yes" onclick="window.finalPublish()">✅ تأكيد النشر</button><button class="edit-btn" onclick="window.backToEdit()">✏️ تعديل</button><button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء</button>`;
            container.appendChild(btns);
            messagesDiv.appendChild(container);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.backToEdit = () => {
            const last = messagesDiv.lastChild;
            if(last) messagesDiv.removeChild(last);
            showSummaryWithEditOptions();
        };

        window.finalPublish = async () => {
            if(isPublishing) return;
            if(!pendingAd.mediaFile) { addMessage("⚠️ يرجى رفع ملف أولاً", false); return; }
            isPublishing = true;
            addMessage("🚀 جاري تجهيز الملف...", false);
            showTypingIndicator();
            
            let mediaData = null;
            if(pendingAd.mediaTypeChoice === 'image') {
                const compressed = await compressImage(pendingAd.mediaFile);
                mediaData = await fileToBase64(compressed);
            } else {
                mediaData = await fileToBase64(pendingAd.mediaFile);
            }
            removeTypingIndicator();
            addMessage("✅ تم تجهيز الملف! جاري الحفظ...", false);
            
            const newAd = {
                name: pendingAd.fullName,
                phone: pendingAd.phone,
                description: pendingAd.description,
                contactMethod: pendingAd.contactMethod,
                imageData: mediaData,
                imageType: pendingAd.mediaTypeChoice,
                userId: currentUser,
                date: Date.now(),
                views: 0,
                likes: []
            };
            
            try {
                await db.collection('ads').add(newAd);
                addMessage("✅ تم نشر إعلانك بنجاح! 🎉", false);
                addMessage("🛒 رابط سوق مصطفى: marketplace.html", false);
                pendingAd = { step:null };
                mediaUploadBtn.style.display = 'none';
            } catch(e) {
                console.error(e);
                addMessage("⚠️ فشل الحفظ، حاول مجدداً", false);
            } finally { isPublishing = false; }
        };

        mediaUploadBtn.onclick = () => mediaInput.click();
        mediaInput.onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const type = file.type.startsWith('image/') ? 'image' : (file.type.startsWith('video/') ? 'video' : null);
            if(!type || (pendingAd.mediaTypeChoice && pendingAd.mediaTypeChoice !== type)) {
                showToast(`يرجى اختيار ${pendingAd.mediaTypeChoice==='image'?'صورة':'فيديو'}`);
                mediaInput.value = '';
                return;
            }
            pendingAd.mediaFile = file;
            pendingAd.mediaType = type;
            const tempUrl = URL.createObjectURL(file);
            addMediaMessage(tempUrl, type, true);
            addMessage(`✅ تم اختيار ${type==='image'?'الصورة':'الفيديو'}`, false);
            setTimeout(() => {
                addMessage("📝 اكتب وصفاً للإعلان:", false);
                pendingAd.step = 'description';
            }, 500);
            mediaInput.value = '';
        };

        // ========== معالجة الرسائل ==========
        async function handleAdFlow(msg) {
            if(pendingAd.step && pendingAd.step.startsWith('editing_')) {
                const field = pendingAd.step.replace('editing_', '');
                switch(field){
                    case 'fullName': if(msg.trim().length<3){addMessage("❌ اسم قصير",false);return false;} pendingAd.fullName=msg.trim(); addMessage("✅ تم التحديث",false); break;
                    case 'phone': if(msg.length<9){addMessage("❌ رقم غير صحيح",false);return false;} pendingAd.phone=msg.trim(); addMessage("✅ تم التحديث",false); break;
                    case 'description': if(msg.length<5){addMessage("❌ وصف قصير",false);return false;} pendingAd.description=msg.trim(); addMessage("✅ تم التحديث",false); break;
                }
                pendingAd.step='review';
                setTimeout(()=>showSummaryWithEditOptions(),500);
                return true;
            }
            if(pendingAd.step === 'fullName') {
                if(msg.length<3){addMessage("❌ اسم قصير",false);return true;}
                pendingAd.fullName = msg;
                addMessage("📱 أرسل رقم هاتفك:",false);
                pendingAd.step = 'phone';
                return true;
            }
            if(pendingAd.step === 'phone') {
                if(msg.length<9){addMessage("❌ رقم غير صحيح",false);return true;}
                pendingAd.phone = msg;
                showMediaTypeChoice();
                pendingAd.step = 'waitingForMediaTypeChoice';
                return true;
            }
            if(pendingAd.step === 'description') {
                if(msg.length<5){addMessage("❌ وصف قصير",false);return true;}
                pendingAd.description = msg;
                showContactButtons();
                pendingAd.step = 'waitingForContact';
                return true;
            }
            if(pendingAd.step === 'waitingForMediaTypeChoice' || pendingAd.step === 'waitingForContact') return true;
            return false;
        }

        async function handleGeneralMessage(msg) {
            const lower = msg.toLowerCase();
            if(lower.includes('مرحب')) return "وعليكم السلام! أهلاً بك في بوت مصطفى. اضغط على الأيقونة البرتقالية لنشر إعلانك.";
            if(lower.includes('شكر')) return "العفو! 🤍";
            return "📢 بوت مصطفى - للخدمات اضغط على الأيقونات، وللإعلانات اضغط على الأيقونة البرتقالية.";
        }

        function buildIcons() {
            const container = document.createElement('div');
            const main = document.createElement('div');
            main.className = 'main-ad-icon';
            main.innerHTML = '📢 اضغط هنا لنشر إعلانك';
            main.onclick = startAdFlow;
            container.appendChild(main);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => {
                const item = document.createElement('div'); item.className = 'icon-item';
                const img = document.createElement('img'); img.src = s.img; img.style.width='55px';
                const span = document.createElement('span'); span.innerText = s.name;
                item.appendChild(img); item.appendChild(span);
                item.onclick = () => { showDetailedServiceExplanation(s); };
                grid.appendChild(item);
            });
            container.appendChild(grid);
            return container;
        }

        function initChat() {
            messagesDiv.innerHTML = '';
            addMessage("✨ أهلاً بك في بوت مصطفى! اضغط على الأيقونة البرتقالية لنشر إعلانك.", false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            if(isBotTyping) return;
            const text = chatInput.value.trim();
            if(text) { addMessage(text, true); chatInput.value = ''; }
            
            if(pendingAd.step && pendingAd.step !== 'waitingForMediaTypeChoice' && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'review' && !pendingAd.step.startsWith('editing_')) {
                if(!text) return;
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(r=>setTimeout(r,500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            if(pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(r=>setTimeout(r,500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            if(!text) return;
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(r=>setTimeout(r,800));
            removeTypingIndicator();
            const resp = await handleGeneralMessage(text);
            addMessage(resp, false);
            isBotTyping = false;
        };
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendBtn.click(); });
        
        // لا حاجة لـ checkPayment لأن الاشتراك مفعل دائماً
    </script>
</body>
</html>
