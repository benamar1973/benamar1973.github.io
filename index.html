            { name: "💧 فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 **فائدة الرابط:** منصة SEAAL الرسمية لدفع فواتير الماء.\n🔹 يمكنك دفع الفاتورة الشهرية أو السنوية.", requirements: "📋 **متطلبات الدفع:**\n• رقم المشترك الموجود على الفاتورة 📄\n• بطاقة دفع إلكترونية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ أدخل رقم المشترك\n2️⃣ اختر الفاتورة المراد دفعها\n3️⃣ اضغط على 'دفع'\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد وطباعة الإيصال", needsCard: false },

🎁 عروض وخصومات حصرية للمشتركين`;

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2500); }
        
        function getSubscription() { 
            if (!currentUser) return { active: false, days: 0 }; 
            const expiry = localStorage.getItem(`sub_${currentUser}`); 
            if (expiry && Date.now() < parseInt(expiry)) { 
                const days = Math.ceil((parseInt(expiry) - Date.now()) / 86400000); 
                return { active: true, days }; 
            } 
            return { active: false, days: 0 }; 
        }
        
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            const sub = getSubscription();
            if (sub.active) {
                document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
                document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                document.getElementById('paymentSection').innerHTML = '';

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                        if (height > maxHeight) { width = (width * maxHeight) / height; height = maxHeight; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob(resolve, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        mediaUploadBtn.onclick = () => { mediaInput.click(); };
        mediaInput.onchange = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            for (const file of files) {
                const fileType = file.type;
                let mediaItemType = null;
                let processedFile = file;
                
                if (fileType.startsWith('image/')) {
                    mediaItemType = 'image';
                    if (adData.mediaType === 'video') {
                        showToast(`❌ لقد اخترت رفع فيديوهات فقط، لكنك رفعت صورة`);
                        mediaInput.value = '';
                        return;
                    }
                    const compressedBlob = await compressImage(file, 800, 800, 0.7);
                    processedFile = new File([compressedBlob], file.name, { type: 'image/jpeg' });
                } else if (fileType.startsWith('video/')) {
                    mediaItemType = 'video';
                    if (adData.mediaType === 'image') {
                        showToast(`❌ لقد اخترت رفع صور فقط، لكنك رفعت فيديو`);
                        mediaInput.value = '';
                        return;
                    }
                } else {
                    showToast(`❌ الملف ${file.name} ليس صورة ولا فيديو`);
                    continue;
                }
                
                const reader = new FileReader();
                await new Promise((resolve) => {
                    reader.onload = (event) => {
                        adData.mediaList.push({ data: event.target.result, type: mediaItemType, name: file.name });
                        resolve();
                    };
                    reader.readAsDataURL(processedFile);
                });
            }
            
            addMessage(`✅ تم استلام ${files.length} ملف بنجاح!`, false);

            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) {
                return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية";
            }
            if (lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            if (lower.includes('القوانين')) return AD_RULES;
            return "📢 **بوت مصطفى - خدمة الإعلانات**\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية";
        }

        function buildIcons() {
            const container = document.createElement('div');
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `<div style="font-size:42px; font-weight:bold; color:white; text-shadow:2px 2px 4px rgba(0,0,0,0.3); margin-bottom:10px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك</span>`;
            mainAdDiv.onclick = async () => { await startAdFlow(); };
            container.appendChild(mainAdDiv);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => { 
                const item = document.createElement('div'); item.className = 'icon-item'; 
                const img = document.createElement('img'); img.src = s.img; img.alt = s.name; 
                img.onerror = () => { img.style.display = 'none'; }; 
                const span = document.createElement('span'); span.innerText = s.name; 
                item.appendChild(img); item.appendChild(span); 
                item.onclick = async () => { 
                    const sub = getSubscription(); 
                    if (!sub.active) { addMessage(`⚠️ **خدمة "${s.name}" تتطلب اشتراكاً نشطاً.**`, false); return; } 
                    showDetailedServiceExplanation(s); 
                }; 
                grid.appendChild(item); 
            });
            container.appendChild(grid);
            return container;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            const sub = getSubscription();
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨

📢 **خدمة الإعلانات هي خدمتنا الأساسية**

**الخدمات الأخرى المتاحة:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة البرتقالية
• للخدمات الأخرى: اضغط على الأيقونات أدناه`;

            if (!sub.active && currentUser) welcomeMsg += `\n\n⚠️ **ملاحظة:** ليس لديك اشتراك نشط.\n💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج)`;
            else if (!currentUser) welcomeMsg += `\n\n🔐 يرجى تسجيل الدخول أولاً`;
            else if (sub.active) welcomeMsg += `\n\n✅ اشتراكك مفعل - مرحبا بك`;

            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            const text = chatInput.value.trim();
            
            if (text) {
                addMessage(text, true);
                chatInput.value = '';
            }
            
            if (adData.step && !['waitingMediaType', 'waitingContact', 'review'].includes(adData.step)) {
                if (!text) return;
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            
            if (pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            
            if (!text) return;
            
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 800));
            removeTypingIndicator();
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };

        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        function checkPayment() { 
            const urlParams = new URLSearchParams(window.location.search); 
            const code = urlParams.get('code'); 
            const days = urlParams.get('days'); 
            if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) { 
                const expiry = Date.now() + (parseInt(days) * 86400000); 
                localStorage.setItem(`sub_${currentUser}`, expiry); 
                showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`); 
                updateUI(); 
                if (messagesDiv.children.length > 0) initChat(); 
            } 
        }
        checkPayment();
    </script>
</body>
</html>
