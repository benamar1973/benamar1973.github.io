<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>خدماتي - مساعدك boot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Tahoma', 'Cairo', 'Noto Sans Arabic', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .app-container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
        }

        /* النموذج الأساسي (الصورة 1574) */
        .primary-card {
            background: #ffffff;
            border-radius: 48px 32px 48px 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.02);
            padding: 2rem 1.8rem;
            text-align: center;
            margin-bottom: 28px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 215, 150, 0.4);
            background: #fffef7;
        }

        .brand-icon {
            font-size: 3.8rem;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(2px 4px 12px rgba(0,0,0,0.1));
        }

        .github-badge {
            background: #1e293b;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            color: #facc15;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 6px rgba(0,0,0,0.1);
        }

        .service-title {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2c3e50, #1e2a36);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 12px 0 8px 0;
            letter-spacing: -0.3px;
        }

        .boot-tagline {
            font-size: 1.2rem;
            color: #b45309;
            background: #ffedd5;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 500;
            margin-top: 8px;
        }

        /* البطاقات الثانوية */
        .info-card {
            background: white;
            border-radius: 32px;
            padding: 1.8rem;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.12);
            border: 1px solid #fde68a;
            transition: all 0.2s;
        }

        .welcome-message {
            background: #fef9e3;
            border-right: 6px solid #f59e0b;
            padding: 1rem 1.2rem;
            border-radius: 28px;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #92400e;
        }

        .subscription-detail {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1rem 1.5rem;
            margin: 18px 0;
        }

        .plan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .plan-item:last-child {
            border-bottom: none;
        }

        .plan-name {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price {
            font-weight: 800;
            color: #0f3b2c;
            background: #e0f2fe;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .check-badge {
            color: #10b981;
            background: #d1fae5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 8px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: scale(0.97);
        }

        /* form styling */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 28px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
        }

        .plan-selector {
            display: flex;
            gap: 14px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .plan-option {
            flex: 1;
            background: #f1f5f9;
            border-radius: 36px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            font-weight: 600;
        }

        .plan-option.selected {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
        }

        .create-btn {
            background: #f59e0b;
            color: #2d1f00;
            font-weight: 800;
            padding: 14px;
            border-radius: 60px;
            border: none;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .create-btn:hover {
            background: #d97706;
            color: white;
        }

        .sub-link {
            display: inline-block;
            background: #eef2ff;
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #1e40af;
        }

        hr {
            margin: 20px 0;
            border: 1px dashed #ffd966;
        }

        .demo-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #5b6e8c;
        }

        button {
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .primary-card {
                padding: 1.4rem;
            }
            .service-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- نموذج الصورة 1574 (ثابت دائماً) -->
    <div class="primary-card">
        <div class="brand-icon">🥾⚡</div>
        <div class="github-badge">benamar1973.github.io</div>
        <div class="service-title">خدماتي مساعدك boot</div>
        <div class="boot-tagline">🚀 boot الذكي | دعم فوري</div>
        <div style="margin-top: 12px; font-size: 0.75rem; color: #9ca3af;">نسخة 2.0 · خدمات رقمية متكاملة</div>
    </div>

    <!-- المحتوى الديناميكي (حسب حالة المستخدم) -->
    <div id="dynamicContent"></div>
</div>

<script>
    // مفتاح التخزين المحلي
    const STORAGE_KEY = "khidmati_current_user";

    // بيانات افتراضية لمستخدم تجريبي (يمكن استخدامها للعرض)
    const demoSubscribedUser = {
        fullName: "مصطفى بن عمار",
        email: "mustaphabenamar40@gmail.com",
        plan: "monthly",     // 'monthly' or 'yearly'
        planPrice: 100,
        planNameAr: "اشتراك شهري",
        startDate: new Date().toISOString(), // لنحسب الأيام المتبقية بشكل ديناميكي
        remainingDays: 29    // سنعرض 29 يوم كما في الصورة ولكن نحسبها بناءً على تاريخ البداية
    };

    // دالة لحساب الأيام المتبقية من تاريخ الاشتراك والخطة
    function calculateRemainingDays(startDateISO, planType) {
        const start = new Date(startDateISO);
        const now = new Date();
        const diffTime = now - start;
        const daysPassed = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        let totalDays = 0;
        if (planType === 'monthly') totalDays = 30;
        else totalDays = 365;
        let remaining = totalDays - daysPassed;
        return remaining > 0 ? remaining : 0;
    }

    // الحصول على المستخدم الحالي من localStorage
    function getCurrentUser() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) { return null; }
        }
        return null;
    }

    // حفظ المستخدم
    function setCurrentUser(user) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        renderApp();
    }

    // تسجيل الخروج
    function logout() {
        localStorage.removeItem(STORAGE_KEY);
        renderApp();
    }

    // إنشاء حساب جديد (مستخدم مشترك)
    function createNewUser(fullName, email, password, planType) {
        if (!fullName || !email || !password) {
            alert("الرجاء ملء جميع الحقول (الاسم، البريد، كلمة المرور)");
            return false;
        }
        if (!email.includes('@')) {
            alert("البريد الإلكتروني غير صالح");
            return false;
        }
        if (password.length < 4) {
            alert("كلمة المرور يجب أن تكون 4 أحرف على الأقل");
            return false;
        }
        let planPrice, planNameAr;
        let totalDays = 0;
        if (planType === 'monthly') {
            planPrice = 100;
            planNameAr = "اشتراك شهري";
            totalDays = 30;
        } else {
            planPrice = 365;
            planNameAr = "اشتراك سنوي";
            totalDays = 365;
        }
        const startDate = new Date();
        // جعل الأيام المتبقية = totalDays - 1 لإظهار 29 للشهري و 364 للسنوي (كما في الإشارة)
        // لكن نستخدم دقيقة: سنجعل الأيام المتبقية = totalDays - 1 إذا بدأ اليوم (لإعطاء شعور واقعي)
        let remaining = totalDays - 1; 
        if (remaining < 0) remaining = totalDays;
        
        const newUser = {
            fullName: fullName.trim(),
            email: email.trim(),
            plan: planType,
            planPrice: planPrice,
            planNameAr: planNameAr,
            startDate: startDate.toISOString(),
            remainingDays: remaining, // سيتم تحديثها ديناميكياً عند العرض
        };
        setCurrentUser(newUser);
        return true;
    }

    // دالة لعرض واجهة المستخدم المشترك (ترحيب، تفاصيل الاشتراك)
    function renderSubscribedView(user) {
        // تحديث الأيام المتبقية بناءً على تاريخ البداية الحقيقي
        let daysLeft = user.remainingDays;
        if (user.startDate) {
            const computed = calculateRemainingDays(user.startDate, user.plan);
            daysLeft = computed;
        }
        // صياغة خطة الاشتراك
        const monthlyPlanActive = user.plan === 'monthly';
        const yearlyPlanActive = user.plan === 'yearly';
        
        // للتوافق مع الصورة 1576 حيث يعرض كلا الخطتين مع علامة صح ، لكننا سنبرز الخطة النشطة بشكل خاص ونشير إلى الأخرى كخيار
        // لكن المطلوب "رسالة ترحيب بالمستخدم المشترك" وتحته تفاصيل تشبه 1576
        return `
            <div class="info-card">
                <div class="welcome-message">
                    ✨ مرحباً ${user.fullName} ✨<br>
                    📧 ${user.email}
                </div>
                <div style="background: #fff7ed; border-radius: 24px; padding: 0.8rem 1rem;">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;">
                        <span style="font-weight: bold; color:#b45309;">✅ اشتراكك مفعل</span>
                        <span style="background:#facc15; padding: 4px 12px; border-radius: 40px;">⏳ يتبقى ${daysLeft} يوم</span>
                    </div>
                </div>
                
                <div class="subscription-detail">
                    <div class="plan-item">
                        <div class="plan-name">
                            📆 اشتراك شهري
                            ${user.plan === 'monthly' ? '<span class="check-badge">✓</span>' : ''}
                        </div>
                        <div class="price">100 دج</div>
                    </div>
                    <div class="plan-item">
                        <div class="plan-name">
                            🌟 اشتراك سنوي
                            ${user.plan === 'yearly' ? '<span class="check-badge">✓</span>' : ''}
                        </div>
                        <div class="price">365 دج</div>
                    </div>
                    ${user.plan === 'monthly' ? '<div style="margin-top: 10px; font-size:0.8rem; background:#e6f7e6; padding:8px; border-radius:20px; text-align:center;">⭐ خطتك الحالية: شهري (100 دج) - تجدد تلقائياً</div>' : ''}
                    ${user.plan === 'yearly' ? '<div style="margin-top: 10px; font-size:0.8rem; background:#e6f7e6; padding:8px; border-radius:20px; text-align:center;">⭐ خطتك الحالية: سنوي (365 دج) - الأفضل قيمة</div>' : ''}
                </div>
                
                <button class="logout-btn" id="logoutButton">
                    🚪 تسجيل الخروج
                </button>
                <div class="demo-note">
                    🔒 مدعوم بخدمات boot | اشتراكك نشط
                </div>
            </div>
        `;
    }

    // عرض صفحة إنشاء حساب لمستخدم جديد (مع روابط الاشتراك)
    function renderNewUserView() {
        // سنضيف اختيار الخطة ونموذج إنشاء حساب
        return `
            <div class="info-card">
                <h3 style="font-size:1.6rem; margin-bottom: 6px; color:#1e293b;">📝 إنشاء حساب جديد</h3>
                <p style="margin-bottom: 20px; color:#475569;">انضم إلى خدماتنا boot وابدأ تجربة مميزة</p>
                
                <div class="form-group">
                    <label>👤 الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="مثال: أحمد محمد" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>📧 البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@domain.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>🔒 كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••" autocomplete="new-password">
                </div>
                
                <label>📦 اختر باقة الاشتراك (روابط الاشتراك):</label>
                <div class="plan-selector" id="planSelector">
                    <div class="plan-option" data-plan="monthly">
                        🗓️ شهري <br> <strong>100 دج</strong>
                    </div>
                    <div class="plan-option" data-plan="yearly">
                        🎉 سنوي <br> <strong>365 دج</strong>
                    </div>
                </div>
                <input type="hidden" id="selectedPlan" value="monthly">
                
                <button class="create-btn" id="createAccountBtn">
                    🚀 إنشاء حساب & الاشتراك الآن
                </button>
                
                <hr>
                <div style="text-align: center;">
                    <div class="sub-link">✨ اشتراك شهري - 100 دج ✨</div>
                    <div class="sub-link" style="background:#fef3c7;">🔥 اشتراك سنوي - 365 دج (وفر 20%) 🔥</div>
                </div>
                <div class="demo-note">
                    💡 بعد إنشاء حساب، سيتم تفعيل اشتراكك فوراً مع الفترة التجريبية (29 يوم متبقي للشهري / 364 للسنوي)
                </div>
            </div>
        `;
    }

    // إضافة أحداث الصفحة بعد تحميل المحتوى الديناميكي
    function attachEvents() {
        // أحداث خاصة بصفحة المستخدم الجديد (إنشاء الحساب)
        const createBtn = document.getElementById('createAccountBtn');
        if (createBtn) {
            createBtn.addEventListener('click', () => {
                const fullName = document.getElementById('fullName')?.value.trim() || '';
                const email = document.getElementById('email')?.value.trim() || '';
                const password = document.getElementById('password')?.value || '';
                let selectedPlanElem = document.querySelector('.plan-option.selected');
                let plan = 'monthly';
                if (selectedPlanElem) plan = selectedPlanElem.getAttribute('data-plan') || 'monthly';
                else {
                    const hiddenPlan = document.getElementById('selectedPlan');
                    if (hiddenPlan) plan = hiddenPlan.value;
                }
                const success = createNewUser(fullName, email, password, plan);
                if (success) {
                    // إعادة الرندر تلقائيًا عبر setCurrentUser
                }
            });
        }

        // اختيار الخطة ديناميكيًا
        const planOptions = document.querySelectorAll('.plan-option');
        if (planOptions.length) {
            planOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    planOptions.forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    const planVal = this.getAttribute('data-plan');
                    const hiddenPlan = document.getElementById('selectedPlan');
                    if (hiddenPlan) hiddenPlan.value = planVal;
                });
                // تحديد الافتراضي (شهري)
                if (opt.getAttribute('data-plan') === 'monthly') {
                    opt.classList.add('selected');
                    const hiddenPlan = document.getElementById('selectedPlan');
                    if (hiddenPlan) hiddenPlan.value = 'monthly';
                }
            });
        }

        // زر تسجيل الخروج
        const logoutBtn = document.getElementById('logoutButton');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                logout();
            });
        }
    }

    // دالة العرض الرئيسية بناءً على وجود مستخدم أم لا
    function renderApp() {
        const dynamicDiv = document.getElementById('dynamicContent');
        const currentUser = getCurrentUser();
        
        if (currentUser) {
            // مستخدم مشترك -> عرض رسالة ترحيب + تفاصيل الاشتراك (مشابه للصورة 1576)
            dynamicDiv.innerHTML = renderSubscribedView(currentUser);
        } else {
            // مستخدم جديد -> عرض نفس النموذج (1574) وتحته صفحة إنشاء حساب وروابط الاشتراك
            dynamicDiv.innerHTML = renderNewUserView();
        }
        
        // إعادة ربط الأحداث بعد تحديث الـ DOM
        attachEvents();
    }

    // تهيئة: إذا لم يكن هناك مستخدم و أردنا عرض مستخدم تجريبي لأغراض العرض المباشر للمشترك؟
    // حسب متطلبات السؤال: "عند فتح التطبيق اريد نموذج الصورة 1574 وتحته رسالة ترحيب بالمستخدم المشترك"
    // هذا يشير إلى أنه يفضل أن يظهر التطبيق فوراً حالة مشترك (كمثال حي).
    // ولكن أيضاً يجب توفير آلية للمستخدم الجديد. ولتلبية كلا السيناريو بشكل مثالي:
    // سنقوم بإنشاء مستخدم تجريبي "افتراضي" فقط إذا لم يكن هناك أي مستخدم مخزّن ولا نريد أن تظهر صفحة فارغة،
    // لكن مع مراعاة أن المستخدم الجديد يمكنه تسجيل الخروج أو إنشاء حساب جديد.
    // ولضمان أن أول فتح للتطبيق تظهر رسالة ترحيب "لمستخدم مشترك" كما هو مطلوب، سنقوم بتحميل مستخدم تجريبي 
    // (mustaphabenamar40@gmail.com) مرة واحدة فقط عند عدم وجود أي بيانات. هذا يلبي الشرط الأول: فتح التطبيق يظهر نموذج وتحته ترحيب مشترك.
    // بينما المستخدم الجديد يمكنه الضغط على "تسجيل الخروج" من واجهة المشترك (ليظهر له نموذج إنشاء حساب)،
    // وكذلك يمكن مسح التخزين المحلي يدوياً لكننا سنضيف زر واضح لتسجيل الخروج.
    // هكذا نرضي الجانبين: عند أول دخول = مشترك (بدون إنشاء حساب)، ولكن إن أراد مستخدم جديد يقوم بتسجيل الخروج ثم إنشاء حساب خاص به.
    // هذا أفضل من ترك الصفحة فارغة أو عرض مستخدم جديد أولي.
    
    function initializeWithDemoIfNeeded() {
        const existing = localStorage.getItem(STORAGE_KEY);
        if (!existing) {
            // إنشاء مستخدم تجريبي مشابه لـ mustaphabenamar40@gmail.com مع تفاصيل الاشتراك الشهري (29 يوم متبقي)
            const demoStartDate = new Date();
            demoStartDate.setDate(demoStartDate.getDate() - 1); // مضى يوم واحد
            const demoUser = {
                fullName: "مصطفى بن عمار",
                email: "mustaphabenamar40@gmail.com",
                plan: "monthly",
                planPrice: 100,
                planNameAr: "اشتراك شهري",
                startDate: demoStartDate.toISOString(),
                remainingDays: 29,   // فقط للعرض الأولي
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(demoUser));
        }
        renderApp();
    }
    
    // بدء التطبيق مع مستخدم تجريبي (مشترك) لإظهار رسالة الترحيب كما هو مطلوب.
    initializeWithDemoIfNeeded();
    // عند تسجيل الخروج، سيعمل renderApp بشكل صحيح ويعرض واجهة المستخدم الجديد
    // كما أن المستخدم الجديد يمكنه إنشاء حساب جديد فيتحول إلى مشترك بتفاصيله.
    // لضمان تحديث الأيام المتبقية بشكل صحيح لكل مستخدم جديد يعتمد على تاريخ البداية.
    
    // إضافة معالج إضافي: تحديث عرض الأيام المتبقية في حالة المشترك ديناميكياً عند تحميل الصفحة
    // لكنه يتم حسابه في renderSubscribedView عبر دالة calculateRemainingDays.
    // نضيف أيضاً مراقبة لأي تغييرات إضافية
    window.addEventListener('storage', () => {
        renderApp();
    });
</script>
