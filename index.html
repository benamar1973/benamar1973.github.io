<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e 0%,#16213e 100%);font-family:'Cairo','Segoe UI','Tahoma',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
        .top-bot-bar{width:100%;max-width:650px;margin:0 auto 20px auto;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:80px;padding:20px 30px;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:all 0.3s ease;animation:glow 2s infinite}
        @keyframes glow{0%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}50%{box-shadow:0 10px 40px rgba(0,123,255,0.6)}100%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}}
        .top-bot-text{font-size:2.2rem;font-weight:bold;color:white;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
        .top-bot-text span:first-child{font-size:3rem;animation:bounce 1s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .top-bot-sub{font-size:0.9rem;color:rgba(255,255,255,0.9);margin-top:8px;display:block}
        .container{max-width:550px;width:100%}
        .card{background:white;border-radius:35px;padding:25px 20px;text-align:center;box-shadow:0 20px 35px rgba(0,0,0,0.2)}
        .version{font-size:14px;color:#6c757d;margin-bottom:20px;font-weight:bold}
        .auth-input{width:100%;padding:14px;margin:10px 0;border-radius:50px;border:1px solid #ddd;font-size:16px;text-align:center}
        .btn{background:#007bff;color:white;border:none;border-radius:50px;padding:14px;width:100%;font-size:16px;font-weight:bold;cursor:pointer;margin:8px 0}
        .btn-logout{background:#dc3545;margin-top:15px}
        .marketplace-link-btn{background:linear-gradient(135deg,#6f42c1,#8b5cf6);color:white;border:none;border-radius:50px;padding:12px 20px;margin-top:10px;cursor:pointer;font-weight:bold;width:100%}
        .user-info{background:#e8f0fe;border-radius:25px;padding:15px;margin:15px 0}
        .user-name{font-size:24px;font-weight:bold;color:#0f3460;word-break:break-all}
        .sub-days{background:#fff3cd;border-radius:40px;padding:8px;margin:10px 0;font-size:14px}
        .payment-buttons{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
        .payment-btn{background:linear-gradient(135deg,#28a745,#20c997);color:white;border:none;border-radius:50px;padding:12px 25px;font-size:16px;font-weight:bold;cursor:pointer;transition:transform 0.2s}
        .payment-btn:hover{transform:scale(1.05)}
        .chat-fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;z-index:10000;display:flex;flex-direction:column;transform:translateY(100%);transition:0.3s;direction:rtl}
        .chat-fullscreen.open{transform:translateY(0)}
        .chat-header{background:linear-gradient(135deg,#007bff,#0056b3);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:1.5rem;font-weight:bold}
        .close-btn{background:none;border:none;color:white;font-size:2rem;cursor:pointer}
        .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
        .bot-msg,.user-msg{padding:12px 16px;border-radius:20px;max-width:85%;font-size:15px;line-height:1.5;animation:fadeIn 0.3s;white-space:pre-wrap;word-wrap:break-word}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .bot-msg{background:#e3f2fd;align-self:flex-start;border-bottom-right-radius:5px}
        .user-msg{background:#d4edda;align-self:flex-end;border-bottom-left-radius:5px}
        .user-msg-img,.user-msg-video{background:#d4edda;align-self:flex-end;border-bottom-left-radius:5px;padding:8px 12px;max-width:85%}
        .user-msg-img img,.user-msg-video video{max-width:200px;max-height:200px;border-radius:12px;margin-top:5px}
        .facebook-preview{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-width:100%;margin:10px 0;direction:ltr;text-align:left}
        .fb-header{display:flex;align-items:center;padding:12px;gap:10px}
        .fb-avatar{width:40px;height:40px;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:18px}
        .fb-name{font-weight:bold;font-size:14px;color:#050505}
        .fb-time{font-size:11px;color:#65676B}
        .fb-content{padding:0 12px 8px 12px;font-size:14px;color:#050505}
        .fb-media{width:100%;max-height:400px;object-fit:cover;background:#f0f2f5}
        .fb-media-video{width:100%;max-height:400px;background:#000}
        .fb-contact{padding:10px 12px;background:#f0f2f5;margin:8px;border-radius:8px;font-size:13px;direction:rtl;text-align:center}
        .fb-buttons{display:flex;justify-content:space-around;padding:8px 12px;border-top:1px solid #e4e6eb;color:#65676B;font-size:13px}
        .input-area{background:white;padding:12px;display:flex;gap:10px;border-top:1px solid #ddd;flex-wrap:wrap}
        #chatInput{flex:1;border:1px solid #ccc;border-radius:30px;padding:12px;font-family:inherit;font-size:15px;min-width:120px}
        #sendBtn{background:#28a745;color:white;border:none;border-radius:30px;padding:0 25px;cursor:pointer;font-weight:bold;font-size:16px}
        #mediaUploadBtn{background:#007bff;color:white;border:none;border-radius:30px;padding:0 20px;cursor:pointer;font-weight:bold;font-size:16px;display:none}
        #mediaInput{display:none}
        .contact-buttons{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
        .contact-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:50px;padding:10px 20px;font-size:14px;font-weight:bold;cursor:pointer;transition:transform 0.2s;display:inline-flex;align-items:center;gap:8px}
        .contact-btn.messenger{background:linear-gradient(135deg,#0084ff,#0063d1)}
        .contact-btn.phone{background:linear-gradient(135deg,#34b7f1,#1c8ad9)}
        .contact-btn:hover{transform:scale(1.05)}
        .confirm-buttons{display:flex;gap:10px;margin:10px 0;justify-content:center;flex-wrap:wrap}
        .confirm-yes{background:#28a745;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer;font-weight:bold}
        .confirm-no{background:#dc3545;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer;font-weight:bold}
        .edit-btn{background:#ffc107;color:#333;border:none;border-radius:50px;padding:10px 25px;cursor:pointer;font-weight:bold}
        .icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:white;border-radius:20px;padding:16px;margin:10px 0}
        @media(min-width:550px){.icon-grid{grid-template-columns:repeat(3,1fr)}}
        .icon-item{background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:20px;padding:12px 8px;cursor:pointer;text-align:center;border:2px solid #dee2e6;transition:all 0.3s}
        .icon-item:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,0.1);border-color:#007bff}
        .icon-item img{width:55px;height:55px;object-fit:contain;border-radius:12px;margin-bottom:6px}
        .icon-item span{font-size:12px;display:block;font-weight:bold;color:#333}
        .main-ad-icon{background:linear-gradient(135deg,#ff6b35,#f7931e);border-radius:20px;padding:25px 15px;cursor:pointer;text-align:center;margin:15px 0;border:3px solid #ffd700;transition:all 0.3s ease;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
        .main-ad-icon:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 40px rgba(255,107,53,0.4);border-color:#fff}
        .main-ad-icon .main-icon-title{font-size:24px;font-weight:bold;color:white;display:block;margin-bottom:6px}
        .main-ad-icon .main-icon-sub{font-size:14px;color:rgba(255,255,255,0.9);display:block}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:9999;font-weight:bold;pointer-events:none}
        .typing{display:flex;gap:4px;align-items:center}
        .typing span{width:8px;height:8px;background:#888;border-radius:50%;display:inline-block;animation:typingAnim 1.4s infinite}
        .typing span:nth-child(2){animation-delay:0.2s}
        .typing span:nth-child(3){animation-delay:0.4s}
        @keyframes typingAnim{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
        .footer-links{text-align:center;margin-top:25px;padding:15px;background:rgba(0,0,0,0.3);border-radius:20px;max-width:550px;width:100%}
        .footer-links a{color:white;text-decoration:none;margin:0 8px;font-size:13px}
        .footer-links a:hover{text-decoration:underline}
        @media(max-width:480px){.top-bot-text{font-size:1.6rem}.top-bot-text span:first-child{font-size:2.2rem}.top-bot-bar{padding:15px 20px}.main-ad-icon .main-icon-title{font-size:20px}.footer-links a{font-size:11px;margin:0 5px}}
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>

<div class="top-bot-bar" id="topBotBar">

<div class="container">

<script>
    // ========== Firebase Config ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
        authDomain: "khadamati-dz-28051.firebaseapp.com",
        projectId: "khadamati-dz-28051",
        storageBucket: "khadamati-dz-28051.firebasestorage.app",
        messagingSenderId: "689071750342",
        appId: "1:689071750342:web:7eafee1d6e372e285dabc7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ========== Cloudinary ==========
    const CLOUD_NAME = "dmeq8fu4i";
    const UPLOAD_PRESET = "mustapha_preset";

    let currentUser = null;
    let isBotTyping = false;
    let pendingService = null;
    let pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaBase64: null, mediaType: null };

    // ========== دوال مساعدة ==========
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2500); }
    function addMessage(text, isUser) { const div = document.createElement('div'); div.className = isUser ? 'user-msg' : 'bot-msg'; div.innerText = text; document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function addMediaMessage(base64, type) { const div = document.createElement('div'); div.className = 'user-msg-img'; const media = type === 'image' ? document.createElement('img') : document.createElement('video'); media.src = base64; if(type==='video') media.controls = true; media.style.maxWidth = '200px'; media.style.borderRadius = '12px'; div.appendChild(media); document.getElementById('messages').appendChild(div); div.scrollIntoView(); }
    function showTypingIndicator() { const d = document.createElement('div'); d.className = 'bot-msg'; d.id = 'typingIndicator'; d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; document.getElementById('messages').appendChild(d); d.scrollIntoView(); }
    function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if(el) el.remove(); }

    // ========== الاشتراك (من Firestore) ==========
    async function getSubscription(email) {
        if (!email) return { active: false, days: 0 };
        try {
            const doc = await db.collection('subscriptions').doc(email).get();
            if (doc.exists) {
                const data = doc.data();
                const expiry = data.expiryDate?.toDate ? data.expiryDate.toDate() : new Date(data.expiryDate);
                if (expiry && expiry.getTime() > Date.now()) {
                    const days = Math.ceil((expiry.getTime() - Date.now()) / 86400000);
                    return { active: true, days };
                }
            }
        } catch(e) { console.error(e); }
        return { active: false, days: 0 };
    }

    async function updateUI() {
        if (!currentUser) return;
        const userEmail = currentUser.email || localStorage.getItem('currentUserEmail');
        document.getElementById('userName').innerHTML = `👤 ${userEmail ? userEmail.split('@')[0] : 'مستخدم'}`;
        const sub = await getSubscription(userEmail);
        if (sub.active) {
            document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
            document.getElementById('paymentSection').innerHTML = '';
        } else {
            document.getElementById('daysLeft').innerHTML = '⚠️ لا يوجد اشتراك نشط';
            document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8', '_blank')">📅 اشتراك سنوي 1000 دج</button></div><div style="font-size:12px; color:#666; margin-top:8px;">💡 اشتراك سنوي 1000 دج فقط</div>`;
        }
    }

    // ========== رفع الملف إلى Cloudinary ==========
    async function uploadToCloudinary(base64Data) {
        try {
            showToast("🔄 جاري رفع الملف...");
            const blob = await fetch(base64Data).then(r => r.blob());
            const fd = new FormData();
            fd.append('file', blob);
            fd.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: 'POST', body: fd });
            const data = await res.json();
            if (!data.secure_url) throw new Error("فشل الرفع");
            showToast("✅ تم رفع الملف");
            return data.secure_url;
        } catch(e) { showToast("❌ فشل الرفع"); throw e; }
    }

    // ========== نشر الإعلان النهائي (يحفظ في Firestore) ==========
    window.finalPublish = async () => {
        if (window.isPublishing) return;
        if (!currentUser) { addMessage("⚠️ يرجى تسجيل الدخول أولاً", false); return; }
        const userEmail = currentUser.email || localStorage.getItem('currentUserEmail');
        const sub = await getSubscription(userEmail);
        if (!sub.active) { addMessage(`⚠️ خدمة الإعلانات تتطلب اشتراكاً نشطاً.\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).`, false); return; }
        if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || !pendingAd.mediaBase64) {
            addMessage("⚠️ البيانات غير مكتملة", false); return;
        }
        window.isPublishing = true;
        addMessage("🚀 جاري نشر إعلانك...", false);
        showTypingIndicator();
        try {
            const imageUrl = await uploadToCloudinary(pendingAd.mediaBase64);
            await db.collection('ads').add({
                name: pendingAd.fullName,
                phone: pendingAd.phone,
                description: pendingAd.description,
                contactMethod: pendingAd.contactMethod,
                imageUrl: imageUrl,
                imageType: pendingAd.mediaType,
                userId: currentUser.uid,
                userEmail: userEmail,
                date: firebase.firestore.FieldValue.serverTimestamp(),
                views: 0,
                likes: []
            });
            removeTypingIndicator();
            addMessage("✅ **تم نشر إعلانك بنجاح في سوق مصطفى!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.\nيمكنك مشاهدة إعلانك في السوق.", false);
            addMessage("🛒 **رابط سوق مصطفى:**\nmarketplace.html", false);
            pendingAd = { step: null };
            document.getElementById('mediaUploadBtn').style.display = 'none';
        } catch(e) { removeTypingIndicator(); addMessage("⚠️ خطأ في النشر: "+e.message, false); }
        finally { window.isPublishing = false; }
    };

    // ========== الخدمات والأيقونات (كما كانت في الأصل) ==========
    const services = [
        { name: "📱 DJEZZY", img: "DJEZZY.png", url: "https://moncompte.djezzy.dz/fr/guest/recharge", description: "شحن رصيد هاتف دجازي", benefit: "🔹 **فائدة الرابط:** يتيح لك شحن رصيد هاتفك بسهولة وأمان.", requirements: "📋 **متطلبات الدفع:** رقم هاتف دجازي + بطاقة ذهبية", steps: "📝 **الخطوات:** اضغط الرابط ← أدخل رقم الهاتف ← اختر المبلغ ← أدخل بيانات الدفع", needsCard: true },
        { name: "📱 mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد موبيليس", benefit: "🔹 خدمة رسمية", requirements: "📋 رقم موبيليس + بطاقة", steps: "نفس الخطوات", needsCard: true },
        { name: "📱 Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد أوريدو", benefit: "🔹 خدمة E-Storm", requirements: "📋 رقم أوريدو + CIB", steps: "اختر 'شحن الرصيد' ← أدخل رقم الهاتف ← اختر المبلغ ← أدخل بيانات الدفع", needsCard: true },
        { name: "⚡ فاتورة الكهرباء", img: "SONELGAZ.png", url: "https://epayement.elit.dz/payementFacture.xhtml", description: "دفع فاتورة الكهرباء والغاز", benefit: "🔹 دفع الفواتير إلكترونياً", requirements: "📋 رقم العقد (14 رقم)", steps: "أدخل رقم العقد ← سيظهر المبلغ ← اضغط 'دفع الآن' ← أدخل بيانات البطاقة", needsCard: false },
        { name: "💧 فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 منصة SEAAL", requirements: "📋 رقم المشترك", steps: "أدخل رقم المشترك ← اختر الفاتورة ← دفع", needsCard: false },
        { name: "🌐 شحن الانترنت", img: "ALGERIE TELECOM.png", url: "https://paiement.at.dz/index.php?p=internet_recharge&pr=in", description: "شحن رصيد الانترنت", benefit: "🔹 اتصالات الجزائر", requirements: "📋 رقم الهاتف الثابت أو حساب الانترنت", steps: "اضغط الرابط ← أدخل بيانات حسابك ← اختر المبلغ ← أدخل بيانات الدفع", needsCard: true }

    function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    if (height > maxHeight) { width = (width * maxHeight) / height; height = maxHeight; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

        } else if (fileType.startsWith('video/')) {

            document.getElementById('loginMsg').innerText = '';
            showToast(`مرحباً ${email.split('@')[0]} في بوت مصطفى 🚀`);
        }).catch(err => { document.getElementById('loginMsg').innerText = '❌ خطأ في تسجيل الدخول'; console.error(err); });
    };
    document.getElementById('logoutBtn').onclick = () => { auth.signOut(); localStorage.removeItem('currentUserEmail'); location.reload(); };
    document.getElementById('marketplaceGuestBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('marketplaceBtn').onclick = () => window.open('marketplace.html');
    document.getElementById('topBotBar').onclick = () => { document.getElementById('chatFullscreen').classList.add('open'); if (document.getElementById('messages').children.length === 0) initChat(); };
    document.getElementById('closeChatBtn').onclick = () => document.getElementById('chatFullscreen').classList.remove('open');

    document.getElementById('sendBtn').onclick = async () => {
        if (isBotTyping) return;
        const txt = document.getElementById('chatInput').value.trim();
        if (txt) addMessage(txt, true);
        document.getElementById('chatInput').value = '';
        if (pendingAd.step && pendingAd.step !== 'waitingForMediaTypeChoice' && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'review' && !pendingAd.step?.startsWith('editing_')) {
            if (!txt) return;
            isBotTyping = true; showTypingIndicator(); await new Promise(r => setTimeout(r, 500)); removeTypingIndicator(); await handleAdFlow(txt); isBotTyping = false; return;
        }
        if (pendingService) {
            const lower = txt.toLowerCase();
            if (lower === 'نعم' || lower === 'yes') { window.open(pendingService.url, '_blank'); addMessage(`✅ تم فتح رابط "${pendingService.name}" بنجاح!`, false); pendingService = null; }
            else if (lower === 'لا' || lower === 'لأ') { addMessage("🙂 لا مشكلة! يمكنك اختيار خدمة أخرى.", false); pendingService = null; }
            else addMessage("أجب بـ نعم أو لا", false);
            return;
        }
        if (!txt) return;
        isBotTyping = true; showTypingIndicator(); await new Promise(r => setTimeout(r, 800)); removeTypingIndicator(); const reply = await handleGeneralMessage(txt); addMessage(reply, false); isBotTyping = false;
    };
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
</script>
</body>
</html>
