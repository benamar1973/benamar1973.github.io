
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>boot خدماتي - مساعدك الذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%); font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; width: 100%; }
        .main-card { background: #ffffff; border-radius: 35px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 10px; }
        
        /* أقسام المصادقة */
        .auth-section { background: #f8f9fa; border-radius: 25px; padding: 15px; margin-bottom: 20px; }
        .auth-section input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 40px; font-size: 14px; }
        .auth-section button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 40px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-login { background: #0f3460; color: white; }
        .btn-signup { background: #e94560; color: white; }
        .btn-logout { background: #dc3545; color: white; }
        .btn-reset { background: #6c757d; color: white; margin-top: 5px !important; }
        .user-info { text-align: center; margin: 10px 0; color: #0f3460; font-weight: bold; }
        
        .subscription-box { background: #e8f0fe; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .subscription-status { font-size: 14px; margin-bottom: 12px; padding: 8px; border-radius: 40px; background: white; }
        .subscription-status.active { background: #d4edda; color: #155724; border-right: 4px solid #28a745; }
        .subscription-status.inactive { background: #f8d7da; color: #721c24; border-right: 4px solid #dc3545; }
        .plan-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .plan-btn { display: inline-block; background: #0f3460; color: white; padding: 10px 20px; border-radius: 40px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .plan-btn:hover { opacity: 0.8; transform: scale(0.97); }
        .plan-btn.monthly { background: #28a745; }
        .plan-btn.yearly { background: #e94560; }
        
        .open-chat-btn { background: linear-gradient(135deg, #007bff, #00c6ff); border: none; border-radius: 60px; padding: 14px 24px; font-size: 1.3rem; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: 0.3s; font-family: inherit; display: inline-flex; align-items: center; gap: 12px; width: 100%; justify-content: center; margin-top: 10px; }
        .open-chat-btn:hover { transform: scale(1.02); }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2c3e; color: white; padding: 8px 16px; border-radius: 30px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 999; }
        
        /* -------------------- شات بوت Fullscreen -------------------- */
        .chat-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f9f9f9; z-index: 10000; display: flex; flex-direction: column; direction: rtl; font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transform: translateY(100%); transition: transform 0.3s ease-out; }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header { background: #007bff; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.4rem; font-weight: bold; }
        .chat-header .close-btn { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #f0f2f5; }
        .original-icons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: white; border-radius: 20px; padding: 16px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .icon-item { background: #f8f9fa; border-radius: 18px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid #ddd; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px 5px; }
        .icon-item:active { transform: scale(0.96); }
        .icon-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; margin-bottom: 6px; }
        .icon-item span { font-size: 12px; font-weight: 500; color: #1e2a3a; text-align: center; }
        .bot-message { background-color: #e3f2fd; padding: 10px 14px; border-radius: 20px; max-width: 85%; align-self: flex-start; font-size: 14px; line-height: 1.5; }
        .user-message { background-color: #d4edda; padding: 10px 14px; border-radius: 20px; max-width: 85%; align-self: flex-end; font-size: 14px; }
        .quick-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; justify-content: center; }
        .quick-btn { background: #e9ecef; border: none; border-radius: 40px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
        .input-area { background: white; padding: 12px; border-top: 1px solid #ddd; display: flex; gap: 10px; position: relative; }
        #chat-input { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px 16px; font-family: inherit; }
        #chat-send { background-color: #28a745; color: white; border: none; border-radius: 30px; padding: 0 20px; cursor: pointer; }
        #suggestions-list { position: absolute; bottom: 70px; left: 10px; right: 10px; background: white; border: 1px solid #ddd; border-radius: 16px; max-height: 160px; overflow-y: auto; z-index: 10001; display: none; }
        .suggestion-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #eee; }
        .suggestion-item:hover { background-color: #007bff; color: white; }
        .bot-link-btn { display: inline-block; background-color: #007bff; color: white; border: none; border-radius: 30px; padding: 8px 16px; margin-top: 10px; cursor: pointer; font-size: 13px; }
        .flex-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="header"><h1>boot خدماتي</h1></div>

        <div id="authSection" class="auth-section">
            <input type="email" id="email" placeholder="البريد الإلكتروني (Gmail)">
            <input type="password" id="password" placeholder="كلمة المرور">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور (للحساب الجديد)">
            <button id="loginBtn" class="btn-login">تسجيل الدخول</button>
            <button id="signupBtn" class="btn-signup">إنشاء حساب جديد</button>
            <button id="resetPasswordBtn" class="btn-reset">نسيت كلمة المرور؟</button>
            <div id="authStatus" style="text-align:center; margin-top:10px; color:#e94560;"></div>
        </div>

        <div id="appSection" style="display: none;">
            <div class="user-info" id="userEmailDisplay"></div>
            <div id="subscriptionBox" class="subscription-box">
                <div id="subscriptionStatus" class="subscription-status inactive">⚠️ لا يوجد اشتراك نشط</div>
                <div class="plan-buttons" id="planButtons">
                    <a href="http://pay.chargily.com/payment-links/01ksbj2yny90tgfyka6hrd89yz" target="_blank" class="plan-btn monthly">📅 اشتراك شهري - 100 دج</a>
                    <a href="http://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8" target="_blank" class="plan-btn yearly">📅 اشتراك سنوي - 365 دج</a>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout" style="width: 100%; margin-bottom: 10px;">🚪 تسجيل الخروج</button>
            <button id="openChatBtn" class="open-chat-btn">💬 boot خدماتي مساعدك</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<!-- الشات بوت (Fullscreen) -->
<div id="chatFullscreen" class="chat-fullscreen">
    <div class="chat-header">
        <span>🤖 boot خدماتي | مساعدك الذكي</span>
        <button class="close-btn" id="closeChatBtn">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <!-- سيتم ملؤه ديناميكياً -->
    </div>
    <div class="input-area">
        <input type="text" id="chat-input" placeholder="اكتب سؤالك هنا...">
        <button id="chat-send">إرسال</button>
        <div id="suggestions-list"></div>
    </div>
</div>

<script type="module">
    // ---------- Firebase (نفس الكود الأصلي) ----------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
        authDomain: "khadamati-dz-28051.firebaseapp.com",
        projectId: "khadamati-dz-28051",
        storageBucket: "khadamati-dz-28051.firebasestorage.app",
        messagingSenderId: "689071750342",
        appId: "1:689071750342:web:10c232ebb79149385dabc7"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // عناصر DOM
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const resetPasswordBtn = document.getElementById('resetPasswordBtn');
    const authStatus = document.getElementById('authStatus');
    const subscriptionStatusDiv = document.getElementById('subscriptionStatus');
    const openChatBtn = document.getElementById('openChatBtn');
    const chatFull = document.getElementById('chatFullscreen');
    const closeChatBtn = document.getElementById('closeChatBtn');

    // إعادة تعيين كلمة المرور
    resetPasswordBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) { authStatus.innerText = '❌ الرجاء إدخال البريد الإلكتروني'; return; }
        try {
            await sendPasswordResetEmail(auth, email);
            authStatus.innerText = '✅ تم إرسال رابط إعادة التعيين إلى بريدك';
        } catch (error) {
            authStatus.innerText = '❌ ' + (error.code === 'auth/user-not-found' ? 'البريد غير مسجل' : error.message);
        }
    });

    // التحقق من الاشتراك (localStorage)
    function isUserSubscribed() {
        const expiry = localStorage.getItem('subscription_expiry');
        return expiry && Date.now() < parseInt(expiry);
    }

    function checkAndApplySubscription() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const days = urlParams.get('days');
        if (code && days && (code === 'MONTHLY2024' || code === 'YEARLY2024' || code === 'ABC123')) {
            const expiryDate = Date.now() + (parseInt(days) * 24 * 60 * 60 * 1000);
            localStorage.setItem('subscription_expiry', expiryDate);
            showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`);
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        const expiry = localStorage.getItem('subscription_expiry');
        const now = Date.now();
        let isActive = false;
        if (expiry && now < parseInt(expiry)) {
            isActive = true;
            const daysLeft = Math.ceil((parseInt(expiry) - now) / (1000 * 60 * 60 * 24));
            subscriptionStatusDiv.innerHTML = `✅ اشتراكك مفعل - يتبقى ${daysLeft} يوم`;
            subscriptionStatusDiv.className = "subscription-status active";
        } else {
            localStorage.removeItem('subscription_expiry');
            subscriptionStatusDiv.innerHTML = `⚠️ لا يوجد اشتراك نشط. يرجى الاشتراك للوصول إلى جميع الخدمات.`;
            subscriptionStatusDiv.className = "subscription-status inactive";
        }
        return isActive;
    }

    // تحديث واجهة المستخدم بعد المصادقة
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = 'none';
            appSection.style.display = 'block';
            userEmailDisplay.innerHTML = `👤 مرحباً ${user.email}`;
            checkAndApplySubscription();
        } else {
            authSection.style.display = 'block';
            appSection.style.display = 'none';
            emailInput.value = ''; passwordInput.value = ''; confirmInput.value = '';
        }
    });

    loginBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim(), password = passwordInput.value.trim();
        if (!email || !password) { authStatus.innerText = '❌ الرجاء إدخال البريد وكلمة المرور'; return; }
        try {
            await signInWithEmailAndPassword(auth, email, password);
            authStatus.innerText = '✅ تم تسجيل الدخول بنجاح';
        } catch (error) {
            let msg = '❌ ';
            if (error.code === 'auth/user-not-found') msg += 'المستخدم غير موجود';
            else if (error.code === 'auth/wrong-password') msg += 'كلمة المرور غير صحيحة';
            else msg += error.message;
            authStatus.innerText = msg;
        }
    });

    signupBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim(), password = passwordInput.value.trim(), confirm = confirmInput.value.trim();
        if (!email || !password || !confirm) { authStatus.innerText = '❌ الرجاء ملء جميع الحقول'; return; }
        if (password !== confirm) { authStatus.innerText = '❌ كلمتا المرور غير متطابقتين'; return; }
        if (password.length < 6) { authStatus.innerText = '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
        try {
            await createUserWithEmailAndPassword(auth, email, password);
            authStatus.innerText = '✅ تم إنشاء الحساب بنجاح! جارٍ تسجيل الدخول...';
        } catch (error) {
            authStatus.innerText = '❌ ' + (error.code === 'auth/email-already-in-use' ? 'البريد مستخدم بالفعل' : error.message);
        }
    });

    logoutBtn.addEventListener('click', async () => { await signOut(auth); });
    openChatBtn.addEventListener('click', () => { chatFull.classList.add('open'); });
    closeChatBtn.addEventListener('click', () => { chatFull.classList.remove('open'); });

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.opacity = '1';
        toast.style.background = '#28a745';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }
    window.showToast = showToast;

    // ---------- بيانات الخدمات (مثل السابق) ----------
    const allServices = [
        { name: 'دفع فاتورة الكهرباء', img: 'SONELGAZ.png', url: 'https://epayement.elit.dz/payementFacture.xhtml', instructions: '🔹 أدخل رقم العقد (13 رقماً) الموجود على الفاتورة.\n🔹 ستظهر قيمة الفاتورة.\n🔹 اختر طريقة الدفع (بطاقة بنكية أو CCP).' },
        { name: 'دفع فاتورة الماء', img: 'SEAAL.png', url: 'https://fatourati.seaal.dz/', instructions: '🔹 أدخل رقم المشترك الموجود على الفاتورة.\n🔹 سيتم عرض المبلغ المستحق.\n🔹 ادفع إلكترونياً.' },
        { name: 'mobilis', img: 'MOBILIS.png', url: 'https://e-paiement.mobilis.dz/', instructions: '🔹 أدخل رقم الهاتف.\n🔹 اختر المبلغ أو الباقة.\n🔹 ادفع عبر بطاقة أو CCP.' },
        { name: 'DJEZZY', img: 'DJEZZY.png', url: 'https://moncompte.djezzy.dz/fr/guest/recharge', instructions: '🔹 أدخل رقم الهاتف.\n🔹 اختر طريقة الشحن.\n🔹 أكمل الدفع.' },
        { name: 'Ooredoo', img: 'OOREDOO.png', url: 'https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar', instructions: '🔹 اختر الخدمة (شحن رصيد، دفع فاتورة، إنترنت).\n🔹 أدخل رقم الهاتف.\n🔹 ادفع.' },
        { name: 'تسديد فاتورة الهاتف', img: 'ALGERIE TELECOM.png', url: 'https://paiement.at.dz/AR/index.php?p=internet_recharge&pr=in', instructions: '🔹 اختر "شحن الإنترنت" أو "دفع الفاتورة".\n🔹 أدخل رقم الهاتف الثابت.\n🔹 ادفع.' },
        { name: 'منحة البطالة', img: 'ANEM.png', url: 'https://minha.anem.dz/pre_inscription', instructions: '🔹 تحتاج إلى: شهادة ميلاد، رقم التسجيل في ANEM، بطاقة تعريف.\n🔹 املأ البيانات في الموقع.' },
        { name: 'تجنيد الجيش', img: 'الجيش الوطني.png', url: 'https://preinscription.mdn.dz/', instructions: '🔹 أنشئ حساباً جديداً.\n🔹 تعبئة البيانات الشخصية.\n🔹 رفع الصور والمستندات.' },
        { name: 'فضاء الأولياء', img: 'فضاء الاولياء.png', url: 'https://awlyaa.education.dz/login', instructions: '🔹 اسم المستخدم: رقم تسجيل التلميذ.\n🔹 كلمة المرور: من المدرسة.' },
        { name: 'سكنات عدل', img: 'AADEL.png', url: 'https://www.aadl.dz', instructions: '🔹 أنشئ ملفاً على الموقع الرسمي.\n🔹 تابع الإعلانات عن الاكتتابات.' },
        { name: 'وسيط ANEM', img: 'ANEM.png', url: 'https://wassitonline.anem.dz', instructions: '🔹 سجل دخولك برقم ANEM.\n🔹 اختر الوساطة.' },
        { name: 'التكوين المهني', img: 'التكوين-المهني.png', url: 'https://takwin.dz', instructions: '🔹 اختر الولاية والتخصص.\n🔹 املأ طلب التسجيل.' },
        { name: 'المخيم الشبابي', img: 'المخيم-الشبابي.png', url: 'https://youthcamp.mjeunesse.gov.dz', instructions: '🔹 سجل في الموقع.\n🔹 اختر المخيم المناسب.' },
        { name: 'التصريح بضياع وثائق', img: 'POLICE.png', url: 'https://www.dgsn.dz/e-declaration/', instructions: '🔹 أدخل بياناتك الشخصية.\n🔹 اختر نوع الوثيقة المفقودة.' },
        { name: 'CCP', img: 'CCP.png', url: 'https://eccp.poste.dz', instructions: '🔹 أدخل رقم CCP ورمز التحقق.\n🔹 يمكنك الاستعلام عن الرصيد، دفع الفواتير.' },
        { name: 'قسيمة السيارات', img: 'مديرية-الضرائب.png', url: 'https://qassimatouka.mf.gov.dz/home', instructions: '🔹 أدخل رقم التسجيل المركزي للسيارة.\n🔹 اختر السنة المطلوبة.\n🔹 ادفع عبر بطاقة أو CCP.' },
        { name: 'شهادة عدم الانتساب', img: 'CNAS.png', url: 'https://elhanaa.cnas.dz/attestation_no_affiliation.xhtml', instructions: '🔹 أدخل رقم الضمان الاجتماعي.\n🔹 ستظهر الشهادة مباشرة.' },
        { name: 'دفع الاشتراك', img: 'CASNOS.jpeg', url: 'https://damancom.casnos.dz/public-space', instructions: '🔹 سجل دخولك.\n🔹 اختر دفع الاشتراك.' },
        { name: 'الفروض والإمتحانات', img: 'DZEXAMIN.png', url: 'https://www.dzexams.com/', instructions: '🔹 اختر المستوى الدراسي.\n🔹 تصفح الفروض والامتحانات.' },
        { name: 'شراء العجلات', img: 'NAFTAL.png', url: 'https://e-mahata.naftal.dz/', instructions: '🔹 أدخل رقم الهاتف.\n🔹 اختر كمية العجلات.\n🔹 ادفع إلكترونياً.' },
        { name: 'نتائج BEM', img: 'ONEC.png', url: 'https://bem.onec.dz/', instructions: '🔹 أدخل رقم التسجيل الخاص بك.\n🔹 ستظهر النتيجة مباشرة.' },
        { name: 'نتائج BAC', img: 'ONEC.png', url: 'https://bac.onec.dz/', instructions: '🔹 أدخل رقم التسجيل.\n🔹 تظهر النتيجة فوراً.' }
    ];

    // ---------- دوال الشات بوت (مثل السابق) ----------
    const messagesDiv = document.getElementById('chatMessages');
    const sendBtn = document.getElementById('chat-send');
    const chatInput = document.getElementById('chat-input');

    function addMessage(text, isUser, linkUrl = null, extraButtons = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = isUser ? 'user-message' : 'bot-message';
        msgDiv.innerText = text;
        if (!isUser && linkUrl) {
            const btn = document.createElement('button');
            btn.innerText = '🔗 افتح الرابط';
            btn.className = 'bot-link-btn';
            btn.onclick = () => window.open(linkUrl, '_blank');
            msgDiv.appendChild(document.createElement('br'));
            msgDiv.appendChild(btn);
        }
        if (!isUser && extraButtons && extraButtons.length) {
            const flexDiv = document.createElement('div');
            flexDiv.className = 'flex-buttons';
            extraButtons.forEach(btn => {
                const b = document.createElement('button');
                b.innerText = btn.text;
                b.className = 'bot-link-btn';
                b.onclick = () => window.open(btn.url, '_blank');
                flexDiv.appendChild(b);
            });
            msgDiv.appendChild(flexDiv);
        }
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function getServiceReply(serviceName) {
        const service = allServices.find(s => s.name === serviceName);
        if (!service) return null;
        let replyText = `📌 **${service.name}**\n\n📝 **خطوات التسجيل:**\n${service.instructions}\n\n`;
        if (!isUserSubscribed()) {
            replyText += '⚠️ **أنت غير مشترك.** يرجى الاشتراك أولاً من الصفحة الرئيسية.';
            return { text: replyText, link: null };
        } else {
            replyText += '🔻 اضغط على الزر أدناه لفتح الرابط.';
            return { text: replyText, link: service.url };
        }
    }

    function getSpecialReply(userMessage) {
        const msg = userMessage.toLowerCase();
        if (msg.includes('مساعدة') || msg.includes('help') || msg.includes('قائمة')) {
            return { text: '📋 قائمة الخدمات:\n' + allServices.map(s => '• ' + s.name).join('\n'), link: null };
        }
        if (msg.includes('اشتراك')) {
            return { text: '📝 للاشتراك، استخدم الروابط في الصفحة الرئيسية.', extraButtons: [
                { text: 'اشتراك شهري', url: 'http://pay.chargily.com/payment-links/01ksbj2yny90tgfyka6hrd89yz' },
                { text: 'اشتراك سنوي', url: 'http://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8' }
            ] };
        }
        const matched = allServices.find(s => userMessage.includes(s.name) || s.name.includes(userMessage));
        return matched ? getServiceReply(matched.name) : null;
    }

    function handleServiceRequest(serviceName) {
        addMessage(serviceName, true);
        setTimeout(() => {
            const reply = getServiceReply(serviceName);
            if (reply) addMessage(reply.text, false, reply.link, reply.extraButtons);
            else addMessage('❌ لم نجد هذه الخدمة.', false);
        }, 500);
    }

    function buildIconsGrid() {
        const grid = document.createElement('div');
        grid.className = 'original-icons-grid';
        allServices.forEach(service => {
            const icon = document.createElement('div');
            icon.className = 'icon-item';
            const img = document.createElement('img');
            img.src = service.img;
            img.alt = service.name;
            img.onerror = () => { img.style.display = 'none'; };
            const span = document.createElement('span');
            span.innerText = service.name;
            icon.appendChild(img);
            icon.appendChild(span);
            icon.onclick = () => {
                if (!isUserSubscribed()) addMessage(`⚠️ خدمة "${service.name}" تتطلب اشتراكاً نشطاً.`, false);
                else handleServiceRequest(service.name);
            };
            grid.appendChild(icon);
        });
        return grid;
    }

    function initChat() {
        messagesDiv.innerHTML = '';
        const welcomeMsg = document.createElement('div');
        welcomeMsg.className = 'bot-message';
        welcomeMsg.innerText = 'مرحباً! أنا boot خدماتي 🤖\nسأرشدك خطوة بخطوة للتسجيل في أي خدمة.\n📌 اضغط على أيقونة الخدمة أو اكتب اسمها.';
        messagesDiv.appendChild(welcomeMsg);
        
        const quickDiv = document.createElement('div');
        quickDiv.className = 'quick-buttons';
        const buttons = ['اشتراك', 'نتائج BEM', 'نتائج BAC', 'منحة البطالة', 'فضاء الأولياء', 'تجنيد الجيش', 'قسيمة السيارات', 'مساعدة'];
        buttons.forEach(btnText => {
            const btn = document.createElement('button');
            btn.innerText = btnText;
            btn.className = 'quick-btn';
            btn.setAttribute('data-service', btnText);
            btn.onclick = () => {
                addMessage(btnText, true);
                setTimeout(() => {
                    const special = getSpecialReply(btnText);
                    if (special) addMessage(special.text, false, special.link, special.extraButtons);
                    else handleServiceRequest(btnText);
                }, 500);
            };
            quickDiv.appendChild(btn);
        });
        messagesDiv.appendChild(quickDiv);
        messagesDiv.appendChild(buildIconsGrid());
    }

    sendBtn.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (!text) return;
        addMessage(text, true);
        chatInput.value = '';
        setTimeout(() => {
            const special = getSpecialReply(text);
            if (special) addMessage(special.text, false, special.link, special.extraButtons);
            else addMessage('❓ لم أفهم طلبك. اكتب "مساعدة" أو استخدم الأيقونات.', false);
        }, 500);
    });
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    // الاقتراحات التلقائية
    const suggestionsDiv = document.getElementById('suggestions-list');
    chatInput.addEventListener('input', function() {
        const val = this.value.trim().toLowerCase();
        if (val.length < 2) { suggestionsDiv.style.display = 'none'; return; }
        const matches = allServices.map(s => s.name).filter(n => n.toLowerCase().includes(val)).concat(['اشتراك', 'مساعدة']);
        if (matches.length) {
            suggestionsDiv.style.display = 'block';
            suggestionsDiv.innerHTML = matches.map(m => `<div class="suggestion-item" data-suggestion="${m}">${m}</div>`).join('');
        } else suggestionsDiv.style.display = 'none';
    });
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('suggestion-item')) {
            chatInput.value = e.target.getAttribute('data-suggestion');
            suggestionsDiv.style.display = 'none';
            sendBtn.click();
        } else if (!suggestionsDiv.contains(e.target) && e.target !== chatInput) {
            suggestionsDiv.style.display = 'none';
        }
    });

    // بدء الشات بوت عند أول فتح (لن يتم تحميله إلا بعد تسجيل الدخول، لكننا نهيئه الآن)
    initChat();
    // تحديث حالة الأزرار في الشات بوت عند تغير الاشتراك (اختياري)
    window.refreshChatSubscription = () => {
        // يمكن إعادة بناء الشبكة أو تحديث الأنماط، لكنها ستحدث تلقائياً عند الضغط على أيقونة لأن isUserSubscribed() تقرأ localStorage
    };
</script>
</body>
</html>
