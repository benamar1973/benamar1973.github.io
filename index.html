<!DOCTYPE html>
<html lang="ar" dir="rtl">

        body {

            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);

        .auth-input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 50px; border: 1px solid #ddd; font-size: 16px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; border-radius: 50px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .marketplace-link-btn {

        .payment-btn:hover { transform: scale(1.05); }
        .chat-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 10000; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.3s; direction: rtl; }
        .chat-fullscreen.open { transform: translateY(0); }
        .chat-header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: bold; }

        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .main-badge { position: absolute; bottom: 2px; left: 2px; background: #ffc107; color: #333; padding: 2px 5px; border-radius: 10px; font-size: 9px; font-weight: bold; }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-wrap: wrap; }
        #chatInput { flex: 1; border: 1px solid #ccc; border-radius: 30px; padding: 12px; font-family: inherit; font-size: 15px; }
        #sendBtn { background: #28a745; color: white; border: none; border-radius: 30px; padding: 0 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #mediaUploadBtn { background: #007bff; color: white; border: none; border-radius: 30px; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 16px; display: none; }

        .main-ad-icon {

        }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: 0.3s; z-index: 9999; font-weight: bold; pointer-events: none; }
        .typing { display: flex; gap: 4px; align-items: center; }

        @keyframes typingAnim { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        .footer-links { text-align: center; margin-top: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; max-width: 550px; width: 100%; }
        .footer-links a { color: white; text-decoration: none; margin: 0 8px; font-size: 13px; }
        .preview-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        .preview-header { display: flex; align-items: center; padding: 12px; gap: 10px; }
        .preview-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #007bff, #00c6ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .preview-name { font-weight: bold; font-size: 14px; color: #050505; }
        .preview-time { font-size: 11px; color: #65676B; }
        .preview-content { padding: 0 12px 8px 12px; font-size: 14px; color: #050505; }

        .preview-video { width: 100%; max-height: 400px; background: #000; }
        .preview-thumbnails { display: flex; gap: 8px; padding: 12px; overflow-x: auto; }
        .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .preview-thumb.active { border-color: #007bff; }
        .preview-thumb-video { width: 70px; height: 70px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: pointer; border: 2px solid transparent; }

        .preview-contact { padding: 10px 12px; background: #f0f2f5; margin: 8px; border-radius: 8px; font-size: 13px; text-align: center; }
        .preview-buttons { display: flex; justify-content: space-around; padding: 8px 12px; border-top: 1px solid #e4e6eb; color: #65676B; font-size: 13px; }
        @media (max-width: 480px) {
            .top-bot-text { font-size: 1.6rem; }
            .contact-btn img { width: 20px; height: 20px; }
            .media-item { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

            { name: "📱 mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد هاتف موبيليس", benefit: "🔹 **فائدة الرابط:** خدمة رسمية من موبيليس لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم موبيليس المراد شحنه 📱\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ افتح الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ حدد المبلغ\n4️⃣ أدخل بيانات البطاقة\n5️⃣ تأكيد", needsCard: true },
            { name: "📱 Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد هاتف أوريدو", benefit: "🔹 **فائدة الرابط:** خدمة E-Storm من أوريدو لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم أوريدو المراد شحنه 📱\n• بطاقة CIB أو ذهبية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اختر 'شحن الرصيد'\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد", needsCard: true },

            { name: "🌐 شحن الانترنت", img: "ALGERIE TELECOM.png", url: "https://paiement.at.dz/index.php?p=internet_recharge&pr=in", description: "شحن رصيد الانترنت (Algerie Telecom)", benefit: "🔹 **فائدة الرابط:** شحن رصيد الانترنت الخاص بك من منزلك.\n🔹 خدمة سريعة وآمنة من اتصالات الجزائر.", requirements: "📋 **متطلبات الدفع:**\n• رقم الهاتف الثابت أو حساب الانترنت 📡\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اضغط على الرابط\n2️⃣ أدخل بيانات حسابك\n3️⃣ اختر المبلغ المناسب\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد العملية\n6️⃣ سيصلك الرصيد فوراً", needsCard: true }

        function showToast(msg) { let t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2500); }

        const messagesDiv = document.getElementById('messages'), chatInput = document.getElementById('chatInput'), sendBtn = document.getElementById('sendBtn'), chatFull = document.getElementById('chatFullscreen'), closeChatBtn = document.getElementById('closeChatBtn'), topBotBar = document.getElementById('topBotBar'), mediaUploadBtn = document.getElementById('mediaUploadBtn'), mediaInput = document.getElementById('mediaInput');

        async function startAdFlow() { let sub=getSubscription(); if(!sub.active) { addMessage(`⚠️ **خدمة الإعلانات تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).`,false); return; } addMessage(AD_RULES,false); await new Promise(r=>setTimeout(r,1000)); addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n📝 من فضلك أرسل **الاسم الكامل** (الاسم واللقب) (إجباري):",false); ad = { step: 'fullName', fullName: null, phone: null, description: null, contactMethod: null, mediaType: null, mediaList: [], mainMediaIndex: 0 }; document.getElementById('mediaUploadBtn').style.display = 'inline-block'; }
        function showMediaTypeChoice() { let d=document.createElement('div'); d.className='contact-buttons'; d.innerHTML=`<button class="contact-btn" onclick="selectMediaType('image')">🖼️ صور فقط</button><button class="contact-btn messenger" onclick="selectMediaType('video')">🎬 فيديوهات فقط</button><button class="contact-btn phone" onclick="selectMediaType('mixed')">🖼️🎬 صور وفيديوهات</button>`; messagesDiv.appendChild(d); messagesDiv.scrollTop=messagesDiv.scrollHeight; }

        function removeMedia(i) { ad.mediaList.splice(i,1); if(ad.mainMediaIndex>=ad.mediaList.length) ad.mainMediaIndex=Math.max(0,ad.mediaList.length-1); displayMediaGallery(); showToast(`🗑️ تم حذف الملف`); }
        function showContactButtons() { let d=document.createElement('div'); d.className='contact-buttons'; d.innerHTML=`<button class="contact-btn" onclick="selectContactMethod('whatsapp')"><img src="whatsapp.png"> واتساب</button><button class="contact-btn messenger" onclick="selectContactMethod('messenger')"><img src="Messenger.png"> مسنجر</button><button class="contact-btn phone" onclick="selectContactMethod('phone')">📱 هاتف</button>`; messagesDiv.appendChild(d); messagesDiv.scrollTop=messagesDiv.scrollHeight; }
        function selectContactMethod(m) { ad.contactMethod=m; let n=m==='whatsapp'?'واتساب':(m==='messenger'?'مسنجر':'هاتف'); addMessage(`✅ تم اختيار: ${n}`,false); showSummaryWithEditOptions(); ad.step='review'; }
        function showSummaryWithEditOptions() { let ct=`${ad.contactMethod==='whatsapp'?'💚':(ad.contactMethod==='messenger'?'💬':'📱')} ${ad.contactMethod==='whatsapp'?'واتساب':(ad.contactMethod==='messenger'?'مسنجر':'هاتف')}: ${ad.phone}`; let s=document.createElement('div'); s.className='bot-msg'; s.style.direction='rtl'; s.style.textAlign='right'; s.innerHTML=`<div><strong>📋 مراجعة معلومات الإعلان:</strong></div><div>👤 الاسم: ${ad.fullName} <button class="edit-btn" style="padding:2px 10px;font-size:12px;" onclick="editField('fullName')">تعديل</button></div><div>📞 رقم الهاتف: ${ad.phone} <button class="edit-btn" style="padding:2px 10px;font-size:12px;" onclick="editField('phone')">تعديل</button></div><div>📝 الوصف: ${ad.description} <button class="edit-btn" style="padding:2px 10px;font-size:12px;" onclick="editField('description')">تعديل</button></div><div>🖼️ الملفات: ${ad.mediaList.length} ملف (الرئيسي: ${ad.mainMediaIndex+1}) <button class="edit-btn" style="padding:2px 10px;font-size:12px;" onclick="editField('media')">تعديل</button></div><div>💬 وسيلة التواصل: ${ct} <button class="edit-btn" style="padding:2px 10px;font-size:12px;" onclick="editField('contactMethod')">تعديل</button></div>`; messagesDiv.appendChild(s); let b=document.createElement('div'); b.className='confirm-buttons'; b.innerHTML=`<button class="confirm-yes" onclick="proceedToPreview()">✅ متابعة إلى المعاينة</button><button class="confirm-no" onclick="cancelAd()">❌ إلغاء الإعلان</button>`; messagesDiv.appendChild(b); messagesDiv.scrollTop=messagesDiv.scrollHeight; }
        function editField(f) { if(f==='fullName') { addMessage("أدخل الاسم الكامل الجديد:",false); ad.step='edit_fullName'; } else if(f==='phone') { addMessage("أدخل رقم الهاتف الجديد:",false); ad.step='edit_phone'; } else if(f==='description') { addMessage("أدخل الوصف الجديد:",false); ad.step='edit_description'; } else if(f==='media') { addMessage("🖼️ الرجاء رفع ملفات جديدة:",false); ad.step='edit_media'; } else if(f==='contactMethod') { showContactButtons(); ad.step='edit_contact'; } }
        function proceedToPreview() { if(!ad.fullName||!ad.phone||!ad.description||!ad.contactMethod||ad.mediaList.length===0) { addMessage("⚠️ يرجى التأكد من اكتمال جميع البيانات قبل المتابعة",false); return; } showFacebookPreview(); }
        function cancelAd() { addMessage("🙂 تم إلغاء الإعلان. يمكنك البدء من جديد.",false); ad = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaType: null, mediaList: [], mainMediaIndex: 0 }; document.getElementById('mediaUploadBtn').style.display = 'none'; }
        function showFacebookPreview() { let m=ad.mediaList[ad.mainMediaIndex], cs=ad.contactMethod==='whatsapp'?'💚':(ad.contactMethod==='messenger'?'💬':'📱'), cn=ad.contactMethod==='whatsapp'?'واتساب':(ad.contactMethod==='messenger'?'مسنجر':'هاتف'); let mh=m.type==='image'?`<img class="preview-media" src="${m.data}">`:`<video class="preview-video" src="${m.data}" controls></video>`; let th=''; if(ad.mediaList.length>1) { th='<div class="preview-thumbnails">'; for(let i=0;i<ad.mediaList.length;i++) { let x=ad.mediaList[i], act=i===ad.mainMediaIndex?'active':''; if(x.type==='image') th+=`<img src="${x.data}" class="preview-thumb ${act}" onclick="changeMainMedia(${i})">`; else th+=`<div class="preview-thumb-video ${act}" onclick="changeMainMedia(${i})">🎬</div>`; } th+='</div>'; } let p=document.createElement('div'); p.className='preview-card'; p.innerHTML=`<div class="preview-header"><div class="preview-avatar">${ad.fullName.charAt(0).toUpperCase()}</div><div><div class="preview-name">${ad.fullName}</div><div class="preview-time">الآن · 🌍</div></div></div><div class="preview-content">${ad.description}</div>${mh}${th}<div class="preview-contact">${cs} ${cn}: ${ad.phone}</div><div class="preview-buttons"><span>👍 أعجبني</span><span>💬 تعليق</span><span>📤 مشاركة</span></div>`; messagesDiv.appendChild(p); let b=document.createElement('div'); b.className='confirm-buttons'; b.innerHTML=`<button class="confirm-yes" onclick="finalPublish()">✅ تأكيد النشر</button><button class="edit-btn" onclick="backToSummary()">✏️ العودة للتعديل</button><button class="confirm-no" onclick="cancelAd()">❌ إلغاء</button>`; messagesDiv.appendChild(b); messagesDiv.scrollTop=messagesDiv.scrollHeight; }
        window.changeMainMedia = function(i) { ad.mainMediaIndex=i; let p=document.querySelector('.preview-card'); if(p) p.remove(); let b=document.querySelectorAll('.confirm-buttons'); if(b.length) b[b.length-1].remove(); showFacebookPreview(); };
        function backToSummary() { let p=document.querySelector('.preview-card'); if(p) p.remove(); let b=document.querySelectorAll('.confirm-buttons'); if(b.length) b[b.length-1].remove(); showSummaryWithEditOptions(); ad.step='review'; }
        function compressImage(f,mw=800,mh=800,q=0.7) { return new Promise((r,e)=>{ let rd=new FileReader(); rd.onload=(ev)=>{ let img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>mw){ h=(h*mw)/w; w=mw; } if(h>mh){ w=(w*mh)/h; h=mh; } let c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(r,'image/jpeg',q); }; img.onerror=e; img.src=ev.target.result; }; rd.onerror=e; rd.readAsDataURL(f); }); }
        mediaUploadBtn.onclick = () => mediaInput.click();
        mediaInput.onchange = async (e) => { let fs=Array.from(e.target.files); if(fs.length===0) return; for(let f of fs) { let ft=f.type, mit=null, pf=f; if(ft.startsWith('image/')) { mit='image'; if(ad.mediaType==='video') { showToast("❌ يجب رفع فيديوهات فقط"); mediaInput.value=''; return; } let cb=await compressImage(f,800,800,0.7); pf=new File([cb],f.name,{type:'image/jpeg'}); } else if(ft.startsWith('video/')) { mit='video'; if(ad.mediaType==='image') { showToast("❌ يجب رفع صور فقط"); mediaInput.value=''; return; } } else { showToast(`❌ الملف ${f.name} ليس صورة ولا فيديو`); continue; } let rd=new FileReader(); await new Promise(res=>{ rd.onload=(ev)=>{ ad.mediaList.push({data:ev.target.result,type:mit,name:f.name}); res(); }; rd.readAsDataURL(pf); }); } addMessage(`✅ تم استلام ${fs.length} ملف بنجاح!`,false); displayMediaGallery(); if(ad.step==='media') { setTimeout(()=>{ addMessage("📝 **الوصف:**\nأكتب وصفاً مفصلاً لمنتجك أو خدمتك (إجباري):",false); ad.step='description'; },500); } else if(ad.step==='edit_media') { setTimeout(()=>{ showSummaryWithEditOptions(); ad.step='review'; },500); } mediaInput.value=''; };
        window.finalPublish = async () => { if(window.isPublishing) return; window.isPublishing=true; addMessage("🚀 جاري نشر إعلانك...",false); showTypingIndicator(); try { let existingAds=JSON.parse(localStorage.getItem('marketplace_ads')||'[]'); let newAd={id:Date.now(),name:ad.fullName,phone:ad.phone,description:ad.description,contactMethod:ad.contactMethod,mediaList:ad.mediaList,mainMediaIndex:ad.mainMediaIndex,mediaType:ad.mediaType,userId:currentUser,date:Date.now(),views:0,likes:0}; existingAds.unshift(newAd); localStorage.setItem('marketplace_ads',JSON.stringify(existingAds)); await new Promise(r=>setTimeout(r,2000)); removeTypingIndicator(); addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.\nيمكنك مشاهدة إعلانك في سوق مصطفى.",false); addMessage("🛒 **رابط سوق مصطفى:**\nhttps://benamar1973.github.io/marketplace.html",false); ad = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaType: null, mediaList: [], mainMediaIndex: 0 }; document.getElementById('mediaUploadBtn').style.display='none'; } catch(e) { console.error(e); removeTypingIndicator(); addMessage("⚠️ حدث خطأ أثناء نشر الإعلان. يرجى المحاولة مرة أخرى.",false); } finally { window.isPublishing=false; } };
        async function handleAdFlow(t) { if(ad.step==='edit_fullName') { if(t.trim().length<3) { addMessage("❌ الاسم قصير جداً",false); return false; } ad.fullName=t.trim(); addMessage(`✅ تم تحديث الاسم إلى: ${ad.fullName}`,false); showSummaryWithEditOptions(); ad.step='review'; return true; } if(ad.step==='edit_phone') { if(t.length<9) { addMessage("❌ رقم هاتف غير صحيح",false); return false; } ad.phone=t.trim(); addMessage(`✅ تم تحديث رقم الهاتف إلى: ${ad.phone}`,false); showSummaryWithEditOptions(); ad.step='review'; return true; } if(ad.step==='edit_description') { if(t.trim().length<5) { addMessage("❌ وصف قصير جداً",false); return false; } ad.description=t.trim(); addMessage(`✅ تم تحديث الوصف`,false); showSummaryWithEditOptions(); ad.step='review'; return true; } if(ad.step==='fullName') { if(t.trim().length<3) { addMessage("❌ الاسم قصير جداً",false); return false; } ad.fullName=t.trim(); addMessage(`✅ تم تسجيل الاسم: ${ad.fullName}`,false); addMessage("📱 **رقم الهاتف:**\nأرسل رقم هاتفك (إجباري):",false); ad.step='phone'; return true; } if(ad.step==='phone') { if(t.length<9) { addMessage("❌ رقم هاتف غير صحيح",false); return false; } ad.phone=t.trim(); addMessage(`✅ تم تسجيل رقم الهاتف: ${ad.phone}`,false); showMediaTypeChoice(); ad.step='waitingMediaType'; return true; } if(ad.step==='description') { if(t.trim().length<5) { addMessage("❌ وصف قصير جداً",false); return false; } ad.description=t.trim(); addMessage(`✅ تم تسجيل الوصف`,false); showContactButtons(); ad.step='waitingContact'; return true; } if(ad.step==='waitingMediaType'||ad.step==='waitingContact'||ad.step==='review') return true; return false; }
        async function handleGeneralMessage(m) { let l=m.toLowerCase(); if(l.includes('مرحب')||l.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية"; if(l.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً."; if(l.includes('القوانين')) return AD_RULES; return "📢 **بوت مصطفى - خدمة الإعلانات**\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية"; }

        sendBtn.onclick = async () => { if(isBotTyping) return; let t=chatInput.value.trim(); if(t) { addMessage(t,true); chatInput.value=''; } if(ad.step && !['waitingMediaType','waitingContact','review'].includes(ad.step)) { if(!t) return; isBotTyping=true; showTypingIndicator(); await new Promise(r=>setTimeout(r,500)); removeTypingIndicator(); await handleAdFlow(t); isBotTyping=false; return; } if(pendingService) { isBotTyping=true; showTypingIndicator(); await new Promise(r=>setTimeout(r,500)); removeTypingIndicator(); await handleServiceReply(t); isBotTyping=false; return; } if(!t) return; isBotTyping=true; showTypingIndicator(); await new Promise(r=>setTimeout(r,800)); removeTypingIndicator(); let r=await handleGeneralMessage(t); addMessage(r,false); isBotTyping=false; };
