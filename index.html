<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e,#16213e);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
        .top-bot-bar{width:100%;max-width:650px;margin:0 auto 20px;background:linear-gradient(135deg,#007bff,#00c6ff);border-radius:80px;padding:20px;text-align:center;cursor:pointer;animation:glow 2s infinite}
        @keyframes glow{0%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}50%{box-shadow:0 10px 40px rgba(0,123,255,0.6)}100%{box-shadow:0 5px 20px rgba(0,123,255,0.3)}}
        .top-bot-text{font-size:2rem;color:white}
        .container{max-width:550px;width:100%}
        .card{background:white;border-radius:35px;padding:25px;text-align:center}
        .auth-input{width:100%;padding:14px;margin:10px 0;border-radius:50px;border:1px solid #ddd;text-align:center}
        .btn{background:#007bff;color:white;border:none;border-radius:50px;padding:14px;width:100%;margin:8px 0;cursor:pointer;font-weight:bold}
        .btn-logout{background:#dc3545}
        .marketplace-link-btn{background:linear-gradient(135deg,#6f42c1,#8b5cf6);color:white;border-radius:50px;padding:12px;width:100%;display:inline-block;text-align:center;margin-top:10px;cursor:pointer}
        .user-info{background:#e8f0fe;border-radius:25px;padding:15px;margin:15px 0}
        .user-name{font-size:24px;font-weight:bold;color:#0f3460}
        .sub-days{background:#fff3cd;border-radius:40px;padding:8px;margin:10px 0;font-size:14px}
        .payment-btn{background:#28a745;color:white;border:none;border-radius:50px;padding:12px;margin:5px;cursor:pointer}
        .chat-fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;z-index:10000;display:flex;flex-direction:column;transform:translateY(100%);transition:0.3s;direction:rtl}
        .chat-fullscreen.open{transform:translateY(0)}
        .chat-header{background:#007bff;color:white;padding:16px;display:flex;justify-content:space-between;font-size:1.5rem}
        .close-btn{background:none;border:none;color:white;font-size:2rem;cursor:pointer}
        .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
        .bot-msg,.user-msg{padding:12px;border-radius:20px;max-width:85%}
        .bot-msg{background:#e3f2fd;align-self:flex-start}
        .user-msg{background:#d4edda;align-self:flex-end}
        .input-area{background:white;padding:12px;display:flex;gap:10px;border-top:1px solid #ddd}
        #chatInput{flex:1;border:1px solid #ccc;border-radius:30px;padding:12px}
        #sendBtn{background:#28a745;color:white;border:none;border-radius:30px;padding:0 25px;cursor:pointer}
        #mediaUploadBtn{background:#007bff;color:white;border:none;border-radius:30px;padding:0 20px;cursor:pointer;display:none}
        #mediaInput{display:none}
        .contact-buttons{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap}
        .contact-btn{background:#25D366;color:white;border:none;border-radius:50px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .contact-btn.messenger{background:#0084ff}
        .contact-btn.phone{background:#34b7f1}
        .contact-btn img{width:24px;height:24px;border-radius:50%}
        .confirm-buttons{display:flex;gap:10px;justify-content:center;margin:10px 0}
        .confirm-yes{background:#28a745;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .confirm-no{background:#dc3545;color:white;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .edit-btn{background:#ffc107;color:#333;border:none;border-radius:50px;padding:10px 25px;cursor:pointer}
        .icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:white;border-radius:20px;padding:16px;margin:10px 0}
        @media(min-width:550px){.icon-grid{grid-template-columns:repeat(3,1fr)}}
        .icon-item{background:#f8f9fa;border-radius:20px;padding:12px;cursor:pointer;text-align:center;border:2px solid #dee2e6}
        .icon-item img{width:55px;height:55px;object-fit:contain}
        .main-ad-icon{background:linear-gradient(135deg,#ff6b35,#f7931e);border-radius:20px;padding:25px;cursor:pointer;text-align:center;margin:15px 0;border:3px solid #ffd700}
        .main-ad-icon .main-icon-title{font-size:24px;font-weight:bold;color:white}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:9999}
        .typing span{width:8px;height:8px;background:#888;border-radius:50%;display:inline-block;animation:typingAnim 1.4s infinite}
        @keyframes typingAnim{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
        .footer-links{text-align:center;margin-top:25px;padding:15px;background:rgba(0,0,0,0.3);border-radius:20px;width:100%}
        .footer-links a{color:white;text-decoration:none;margin:0 8px}
        .alice-preview{background:white;border-radius:16px;overflow:hidden;margin:10px 0}
        .alice-main-media{width:100%;background:#f5f5f5;min-height:300px;display:flex;align-items:center;justify-content:center}
        .alice-main-media img,.alice-main-media video{width:100%;max-height:350px;object-fit:contain}
        .alice-thumbnails{display:flex;gap:8px;padding:12px;overflow-x:auto;background:white}
        .alice-thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid transparent}
        .alice-thumb.active{border-color:#ff6b35}
        .alice-info{padding:16px}
        .alice-description{font-size:14px;background:#f8f9fa;border-radius:12px;padding:12px;margin-bottom:16px}
        .alice-contact-btn{background:#ff6b35;color:white;border:none;border-radius:50px;padding:12px;width:100%;cursor:pointer;font-weight:bold}
        .media-preview-list{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
        .media-preview-item{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;border:2px solid #ddd}
        .media-preview-item img,.media-preview-item video{width:100%;height:100%;object-fit:cover}
        .remove-media-btn{position:absolute;top:2px;right:2px;background:#dc3545;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer}
        .selected-media-info{background:#e8f0fe;border-radius:12px;padding:10px;margin:10px 0}
    </style>
</head>
<body>
    <div class="top-bot-bar" id="topBotBar">
        <div class="top-bot-text">🤖 بوت مصطفى ✨</div>
        <div style="font-size:0.8rem">خدمة الإعلانات · شحن · فواتير</div>
    </div>
    <div class="container">
        <div class="card">
            <div id="loginSection">
                <input type="email" id="emailInput" class="auth-input" placeholder="بريدك الإلكتروني">
                <input type="password" id="passwordInput" class="auth-input" placeholder="كلمة المرور">
                <button id="loginBtn" class="btn">🚪 دخول</button>
                <button id="registerBtn" class="btn" style="background:#28a745">📝 حساب جديد</button>
                <button id="marketplaceGuestBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
                <div id="loginMsg" style="color:#e94560;font-size:13px"></div>
            </div>
            <div id="appSection" style="display:none">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="sub-days" id="daysLeft"></div>
                    <div id="paymentSection"></div>
                </div>
                <button id="logoutBtn" class="btn btn-logout">تسجيل الخروج</button>
                <button id="marketplaceBtn" class="marketplace-link-btn">🛒 دخول إلى سوق مصطفى</button>
                <button id="clearStorageBtn" style="background:#dc3545;margin-top:10px" class="btn">🗑️ مسح الإعلانات القديمة</button>
            </div>
        </div>
    </div>
    <div class="footer-links">
        <a href="about.html">📖 من نحن</a> | <a href="contact.html">📞 اتصل بنا</a> | <a href="privacy.html">🔒 سياسة الخصوصية</a> | <a href="terms.html">📜 الشروط</a>
    </div>
    <div id="toast" class="toast"></div>
    <div id="chatFullscreen" class="chat-fullscreen">
        <div class="chat-header"><span>🤖 بوت مصطفى</span><button class="close-btn" id="closeChatBtn">✕</button></div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button id="mediaUploadBtn">📷 صورة/فيديو</button>
            <input type="file" id="mediaInput" accept="image/*,video/*" multiple>
            <button id="sendBtn">إرسال</button>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
            authDomain: "khadamati-dz-28051.firebaseapp.com",
            projectId: "khadamati-dz-28051",
            storageBucket: "khadamati-dz-28051.firebasestorage.app",
            messagingSenderId: "689071750342",
            appId: "1:689071750342:web:7eafee1d6e372e285dabc7"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        let isBotTyping = false;
        let pendingService = null;
        let pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaFiles: [] };
        
        // ========== دوال مساعدة ==========
        function showToast(msg) { let t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2000); }
        function getSubscription() { if(!currentUser) return {active:false}; let expiry = localStorage.getItem(`sub_${currentUser.email}`); if(expiry && Date.now()<parseInt(expiry)) return {active:true, days:Math.ceil((parseInt(expiry)-Date.now())/86400000)}; return {active:false}; }
        function updateUI() { if(!currentUser) return; document.getElementById('userName').innerHTML = `👤 ${currentUser.email.split('@')[0]}`; let sub = getSubscription(); if(sub.active) { document.getElementById('daysLeft').innerHTML = `✅ مفعل - يتبقى ${sub.days} يوم`; document.getElementById('paymentSection').innerHTML = ''; } else { document.getElementById('daysLeft').innerHTML = '⚠️ لا اشتراك نشط'; document.getElementById('paymentSection').innerHTML = `<div class="payment-buttons"><button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8','_blank')">📅 اشتراك 1000 دج</button></div>`; } }
        
        // ========== مصادقة Firebase ==========
        onAuthStateChanged(auth, (user) => {
            if(user) {
                currentUser = user;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'block';
                updateUI();
                showToast(`مرحباً ${user.email.split('@')[0]}`);
            } else {
                currentUser = null;
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('appSection').style.display = 'none';
            }
        });
        document.getElementById('loginBtn').onclick = async () => {
            let email = document.getElementById('emailInput').value.trim();
            let password = document.getElementById('passwordInput').value;
            try { await signInWithEmailAndPassword(auth, email, password); } catch(e) { document.getElementById('loginMsg').innerText = e.message; }
        };
        document.getElementById('registerBtn').onclick = async () => {
            let email = document.getElementById('emailInput').value.trim();
            let password = document.getElementById('passwordInput').value;
            try { await createUserWithEmailAndPassword(auth, email, password); showToast('تم إنشاء الحساب'); } catch(e) { document.getElementById('loginMsg').innerText = e.message; }
        };
        document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); showToast('تم الخروج'); };
        document.getElementById('marketplaceGuestBtn').onclick = () => window.open('marketplace.html', '_blank');
        document.getElementById('marketplaceBtn').onclick = () => window.open('marketplace.html', '_blank');
        document.getElementById('clearStorageBtn').onclick = () => { if(confirm('حذف كل الإعلانات المحلية؟')) { localStorage.removeItem('marketplace_ads'); showToast('تم المسح'); location.reload(); } };
        
        // ========== ضغط الصور ==========
        function compressImage(file, maxWidth=350, maxHeight=350, quality=0.3) {
            return new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = (e) => {
                    let img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if(w>maxWidth) { h = h*maxWidth/w; w=maxWidth; }
                        if(h>maxHeight) { w = w*maxHeight/h; h=maxHeight; }
                        let canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img,0,0,w,h);
                        canvas.toBlob(b => resolve(b), 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        // ========== دوال الدردشة والإعلانات ==========
        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatFull = document.getElementById('chatFullscreen');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const topBotBar = document.getElementById('topBotBar');
        const mediaUploadBtn = document.getElementById('mediaUploadBtn');
        const mediaInput = document.getElementById('mediaInput');
        
        topBotBar.onclick = () => { chatFull.classList.add('open'); if(messagesDiv.children.length===0) initChat(); };
        closeChatBtn.onclick = () => chatFull.classList.remove('open');
        
        function addMessage(text, isUser) { let d = document.createElement('div'); d.className = isUser ? 'user-msg' : 'bot-msg'; d.innerText = text; messagesDiv.appendChild(d); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
        function addMediaMessage(url, type, isUser) { let d = document.createElement('div'); d.className = isUser ? (type==='image'?'user-msg':'user-msg') : 'bot-msg'; let el = type==='image' ? document.createElement('img') : document.createElement('video'); if(type==='image') { el.src = url; el.style.maxWidth='200px'; } else { el.src = url; el.controls = true; el.style.maxWidth='220px'; } d.appendChild(el); messagesDiv.appendChild(d); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
        function showTyping() { let d = document.createElement('div'); d.className = 'bot-msg'; d.id = 'typing'; d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; messagesDiv.appendChild(d); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
        function hideTyping() { let t = document.getElementById('typing'); if(t) t.remove(); }
        
        // الخدمات (مختصرة)
        const services = [
            {name:"📱 DJEZZY", img:"DJEZZY.png", url:"https://moncompte.djezzy.dz/fr/guest/recharge"},
            {name:"📱 mobilis", img:"MOBILIS.png", url:"https://e-paiement.mobilis.dz/"},
            {name:"📱 Ooredoo", img:"OOREDOO.png", url:"https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar"},
            {name:"⚡ فاتورة الكهرباء", img:"SONELGAZ.png", url:"https://epayement.elit.dz/payementFacture.xhtml"},
            {name:"💧 فاتورة الماء", img:"SEAAL.png", url:"https://fatourati.seaal.dz/"},
            {name:"🌐 شحن الانترنت", img:"ALGERIE TELECOM.png", url:"https://paiement.at.dz/index.php?p=internet_recharge&pr=in"}
        ];
        
        function buildIcons() {
            let container = document.createElement('div');
            let mainDiv = document.createElement('div');
            mainDiv.className = 'main-ad-icon';
            mainDiv.innerHTML = '<div class="main-icon-title">📢 خدمة الإعلانات</div><div>انشر إعلانك</div>';
            mainDiv.onclick = async () => { if(!getSubscription().active) { addMessage("⚠️ يجب الاشتراك أولاً", false); return; } await startAdFlow(); };
            container.appendChild(mainDiv);
            let grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => {
                let item = document.createElement('div'); item.className = 'icon-item';
                let img = document.createElement('img'); img.src = s.img; img.alt = s.name; img.onerror = () => img.style.display='none';
                let span = document.createElement('span'); span.innerText = s.name;
                item.appendChild(img); item.appendChild(span);
                item.onclick = async () => { if(!getSubscription().active) { addMessage("⚠️ اشتراك مطلوب", false); return; } window.open(s.url,'_blank'); addMessage(`✅ تم فتح ${s.name}`, false); };
                grid.appendChild(item);
            });
            container.appendChild(grid);
            return container;
        }
        
        async function startAdFlow() {
            addMessage("📢 لنبدأ... أرسل اسمك الكامل:", false);
            pendingAd = { step:'fullName', fullName:null, phone:null, description:null, contactMethod:null, mediaFiles:[] };
            mediaUploadBtn.style.display = 'inline-block';
        }
        
        function showMediaUI() {
            let div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `<div>📸 اختر ملفات (صور/فيديو، عدة ملفات)</div>
                <div class="selected-media-info" id="mediaInfo">📎 لم يتم اختيار</div>
                <div class="media-preview-list" id="mediaPreview"></div>
                <div class="contact-buttons"><button class="contact-btn" id="pickFilesBtn" style="background:#007bff">📁 اختيار</button></div>`;
            messagesDiv.appendChild(div);
            document.getElementById('pickFilesBtn').onclick = () => mediaInput.click();
            window.updateMediaPreview = () => {
                let info = document.getElementById('mediaInfo');
                let preview = document.getElementById('mediaPreview');
                if(pendingAd.mediaFiles.length===0) {
                    info.innerHTML = '📎 لم يتم اختيار ملفات';
                    preview.innerHTML = '';
                } else {
                    info.innerHTML = `✅ ${pendingAd.mediaFiles.length} ملف`;
                    preview.innerHTML = '';
                    pendingAd.mediaFiles.forEach((file,idx) => {
                        let wrap = document.createElement('div'); wrap.className = 'media-preview-item';
                        let url = URL.createObjectURL(file);
                        if(file.type.startsWith('image')) {
                            let img = document.createElement('img'); img.src = url; wrap.appendChild(img);
                        } else {
                            let vid = document.createElement('video'); vid.src = url; vid.muted = true; wrap.appendChild(vid);
                        }
                        let btn = document.createElement('button'); btn.className = 'remove-media-btn'; btn.innerHTML = '✕';
                        btn.onclick = () => { pendingAd.mediaFiles.splice(idx,1); window.updateMediaPreview(); };
                        wrap.appendChild(btn);
                        preview.appendChild(wrap);
                    });
                }
            };
            pendingAd.step = 'waitingForMedia';
        }
        
        mediaUploadBtn.onclick = () => { if(pendingAd.step==='waitingForMedia') mediaInput.click(); else showToast("⚠️ ليس الوقت"); };
        mediaInput.onchange = async (e) => {
            let files = Array.from(e.target.files);
            if(!files.length) return;
            if(pendingAd.step!=='waitingForMedia') { showToast("⚠️ انتظر دورك"); mediaInput.value=''; return; }
            if(pendingAd.mediaFiles.length+files.length>5) { showToast("⚠️ حد أقصى 5 ملفات"); mediaInput.value=''; return; }
            for(let f of files) {
                let proc = f;
                if(f.type.startsWith('image')) {
                    let blob = await compressImage(f,350,350,0.3);
                    proc = new File([blob], f.name, {type:'image/jpeg'});
                }
                pendingAd.mediaFiles.push(proc);
                let url = URL.createObjectURL(proc);
                addMediaMessage(url, proc.type.startsWith('image')?'image':'video', true);
                await new Promise(r=>setTimeout(r,50));
            }
            window.updateMediaPreview();
            showToast(`✅ ${pendingAd.mediaFiles.length} ملف`);
            if(pendingAd.mediaFiles.length>0 && pendingAd.step==='waitingForMedia') {
                addMessage(`✅ تم استلام ${pendingAd.mediaFiles.length} ملف`, false);
                setTimeout(() => { addMessage("📝 أرسل وصف الإعلان:", false); pendingAd.step='description'; }, 500);
            }
            mediaInput.value='';
        };
        
        function showContactButtons() {
            let div = document.createElement('div');
            div.className = 'bot-msg';
            div.innerHTML = `<div>📞 وسيلة التواصل:</div><div class="contact-buttons">
                <button class="contact-btn" onclick="window.selectContact('whatsapp')"><img src="whatsapp.png"> واتساب</button>
                <button class="contact-btn messenger" onclick="window.selectContact('messenger')"><img src="Messenger.png"> مسنجر</button>
                <button class="contact-btn phone" onclick="window.selectContact('phone')">📱 هاتف</button>
            </div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.selectContact = (m) => {
            pendingAd.contactMethod = m;
            addMessage(`✅ تم اختيار ${m==='whatsapp'?'واتساب':(m==='messenger'?'مسنجر':'هاتف')}`, false);
            setTimeout(() => { showSummary(); pendingAd.step='review'; }, 500);
        };
        
        function showSummary() {
            let contact = pendingAd.contactMethod==='whatsapp'?`💚 واتساب: ${pendingAd.phone}`:(pendingAd.contactMethod==='messenger'?`💬 مسنجر: ${pendingAd.phone}`:`📱 هاتف: ${pendingAd.phone}`);
            let div = document.createElement('div');
            div.innerHTML = `<div class="bot-msg">📋 مراجعة:</div>
                <div class="bot-msg"><div>👤 ${pendingAd.fullName} <button class="edit-btn" onclick="editField('fullName')">تعديل</button></div>
                <div>📞 ${pendingAd.phone} <button class="edit-btn" onclick="editField('phone')">تعديل</button></div>
                <div>📝 ${pendingAd.description} <button class="edit-btn" onclick="editField('description')">تعديل</button></div>
                <div>🖼️ ${pendingAd.mediaFiles.length} ملف <button class="edit-btn" onclick="editField('media')">تعديل</button></div>
                <div>${contact} <button class="edit-btn" onclick="editField('contact')">تعديل</button></div></div>
                <div class="confirm-buttons"><button class="confirm-yes" onclick="goPreview()">✅ معاينة</button><button class="confirm-no" onclick="cancelAd()">❌ إلغاء</button></div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.editField = (f) => {
            if(f==='media') { addMessage("🖼️ أضف ملفات جديدة:", false); pendingAd.step='waitingForMedia'; showMediaUI(); return; }
            if(f==='contact') { addMessage("📞 اختر وسيلة جديدة:", false); showContactButtons(); return; }
            let msg = f==='fullName'?'أدخل الاسم الجديد:':(f==='phone'?'أدخل رقم الهاتف:':'أدخل الوصف الجديد:');
            addMessage(msg, false);
            pendingAd.step = `edit_${f}`;
        };
        
        window.goPreview = () => {
            if(!pendingAd.fullName||!pendingAd.phone||!pendingAd.description||!pendingAd.contactMethod||pendingAd.mediaFiles.length===0) {
                addMessage("⚠️ أكمل جميع البيانات", false); return;
            }
            showAliPreview();
        };
        
        window.cancelAd = () => { addMessage("🙂 تم الإلغاء", false); pendingAd = { step:null, fullName:null, phone:null, description:null, contactMethod:null, mediaFiles:[] }; mediaUploadBtn.style.display='none'; };
        
        function showAliPreview() {
            let link = pendingAd.contactMethod==='whatsapp' ? `https://wa.me/${pendingAd.phone.replace(/^0/,'213')}` : (pendingAd.contactMethod==='messenger' ? `https://m.me/${pendingAd.phone}` : `tel:${pendingAd.phone}`);
            let icon = pendingAd.contactMethod==='whatsapp'?'💚':(pendingAd.contactMethod==='messenger'?'💬':'📱');
            let container = document.createElement('div');
            container.innerHTML = `<div class="bot-msg">🔍 معاينة الإعلان:</div>
                <div class="alice-preview"><div id="mainMedia" class="alice-main-media"></div><div id="thumbList" class="alice-thumbnails"></div>
                <div class="alice-info"><div class="alice-description">${pendingAd.description}</div>
                <div style="background:#f0f2f5;padding:8px;border-radius:12px;text-align:center">${icon} ${pendingAd.contactMethod==='whatsapp'?'واتساب':(pendingAd.contactMethod==='messenger'?'مسنجر':'هاتف')}: ${pendingAd.phone}</div>
                <button class="alice-contact-btn" onclick="window.open('${link}','_blank')">📞 اتصل الآن</button></div></div>
                <div class="confirm-buttons"><button class="confirm-yes" onclick="finalPublish()">✅ تأكيد النشر</button><button class="edit-btn" onclick="backToSummary()">✏️ تعديل</button><button class="confirm-no" onclick="cancelAd()">❌ إلغاء</button></div>`;
            messagesDiv.appendChild(container);
            let mainDiv = container.querySelector('#mainMedia'), thumbDiv = container.querySelector('#thumbList');
            let idx=0, currVideo=null;
            let tempUrls = pendingAd.mediaFiles.map(f=>URL.createObjectURL(f));
            let types = pendingAd.mediaFiles.map(f=>f.type.startsWith('image')?'image':'video');
            function renderMain(i) {
                mainDiv.innerHTML = '';
                if(types[i]==='image') {
                    let img = document.createElement('img'); img.src = tempUrls[i]; mainDiv.appendChild(img);
                    if(currVideo) { currVideo.pause(); currVideo=null; }
                } else {
                    let vid = document.createElement('video'); vid.src = tempUrls[i]; vid.controls = true; vid.style.width='100%'; mainDiv.appendChild(vid);
                    currVideo = vid;
                }
            }
            function renderThumbs() {
                thumbDiv.innerHTML = '';
                tempUrls.forEach((url,i)=>{
                    let wrap = document.createElement('div'); wrap.style.position='relative'; wrap.style.cursor='pointer';
                    let thumb = document.createElement('img'); thumb.src = url; thumb.className = 'alice-thumb';
                    if(types[i]==='video') { let play = document.createElement('div'); play.innerHTML='▶'; play.style.position='absolute'; play.style.top='50%'; play.style.left='50%'; play.style.transform='translate(-50%,-50%)'; play.style.background='rgba(0,0,0,0.6)'; play.style.borderRadius='50%'; play.style.width='24px'; play.style.height='24px'; play.style.display='flex'; play.style.alignItems='center'; play.style.justifyContent='center'; play.style.color='white'; wrap.appendChild(play); }
                    if(i===idx) thumb.classList.add('active');
                    wrap.onclick = () => { idx=i; renderMain(idx); document.querySelectorAll('.alice-thumb').forEach((t,ti)=>{ if(ti===idx) t.classList.add('active'); else t.classList.remove('active'); }); };
                    wrap.appendChild(thumb);
                    thumbDiv.appendChild(wrap);
                });
            }
            renderMain(0); renderThumbs();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.backToSummary = () => { let last = messagesDiv.lastChild; if(last) messagesDiv.removeChild(last); showSummary(); };
        
        window.finalPublish = async () => {
            if(window.publishing) return;
            window.publishing = true;
            addMessage("🚀 جاري النشر...", false);
            showTyping();
            try {
                // رفع الملفات إلى Firebase Storage
                let uploaded = [];
                for(let i=0; i<pendingAd.mediaFiles.length; i++) {
                    let file = pendingAd.mediaFiles[i];
                    let ext = file.type.split('/')[1] || 'jpg';
                    let refPath = ref(storage, `ads/${currentUser.uid}/${Date.now()}_${i}.${ext}`);
                    await uploadBytes(refPath, file);
                    let url = await getDownloadURL(refPath);
                    uploaded.push({ type: file.type.startsWith('image')?'image':'video', data: url });
                }
                await addDoc(collection(db, 'ads'), {
                    name: pendingAd.fullName,
                    phone: pendingAd.phone,
                    description: pendingAd.description,
                    contactMethod: pendingAd.contactMethod,
                    mediaItems: uploaded,
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    date: Date.now(),
                    views: 0,
                    likes: []
                });
                hideTyping();
                addMessage("✅ تم نشر إعلانك بنجاح! 🎉", false);
                addMessage("🛒 سوق مصطفى: marketplace.html", false);
                pendingAd = { step:null, fullName:null, phone:null, description:null, contactMethod:null, mediaFiles:[] };
                mediaUploadBtn.style.display = 'none';
            } catch(e) {
                hideTyping();
                addMessage("⚠️ خطأ: "+e.message, false);
            } finally {
                window.publishing = false;
            }
        };
        
        async function handleAdFlow(msg) {
            if(pendingAd.step && pendingAd.step.startsWith('edit_')) {
                let f = pendingAd.step.replace('edit_','');
                if(f==='fullName') pendingAd.fullName = msg.trim();
                else if(f==='phone') pendingAd.phone = msg.trim();
                else if(f==='description') pendingAd.description = msg.trim();
                addMessage(`✅ تم تحديث`, false);
                pendingAd.step = 'review';
                setTimeout(() => showSummary(), 500);
                return true;
            }
            if(pendingAd.step === 'fullName') {
                if(msg.length<3) { addMessage("❌ اسم قصير", false); return false; }
                pendingAd.fullName = msg.trim();
                addMessage(`✅ الاسم: ${pendingAd.fullName}`, false);
                addMessage("📱 أرسل رقم هاتفك:", false);
                pendingAd.step = 'phone';
                return true;
            }
            if(pendingAd.step === 'phone') {
                if(msg.length<9) { addMessage("❌ رقم غير صحيح", false); return false; }
                pendingAd.phone = msg.trim();
                addMessage(`✅ رقم: ${pendingAd.phone}`, false);
                showMediaUI();
                return true;
            }
            if(pendingAd.step === 'description') {
                if(msg.length<5) { addMessage("❌ وصف قصير", false); return false; }
                pendingAd.description = msg.trim();
                addMessage(`✅ وصف: ${pendingAd.description}`, false);
                showContactButtons();
                pendingAd.step = 'waitingForContact';
                return true;
            }
            return false;
        }
        
        async function handleGeneral(msg) {
            let low = msg.toLowerCase();
            if(low.includes('مرحب')) return "وعليكم السلام! 😊 أهلاً بك في بوت مصطفى.\n📢 للإعلانات اضغط الأيقونة البرتقالية.";
            return "📢 بوت مصطفى - خدمة الإعلانات. اختر أيقونة الخدمة.";
        }
        
        async function initChat() {
            messagesDiv.innerHTML = '';
            addMessage("✨ أهلاً بك في بوت مصطفى ✨\n📢 للإعلانات: اضغط الأيقونة البرتقالية.\n📱 للخدمات: اختر من الأيقونات.", false);
            messagesDiv.appendChild(buildIcons());
        }
        
        sendBtn.onclick = async () => {
            if(isBotTyping) return;
            let text = chatInput.value.trim();
            if(text) { addMessage(text, true); chatInput.value = ''; }
            if(pendingAd.step && !['waitingForMedia','waitingForContact','review'].includes(pendingAd.step)) {
                if(!text) return;
                isBotTyping = true; showTyping(); await new Promise(r=>setTimeout(r,300)); hideTyping();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            if(!text) return;
            isBotTyping = true; showTyping(); await new Promise(r=>setTimeout(r,500)); hideTyping();
            let resp = await handleGeneral(text);
            addMessage(resp, false);
            isBotTyping = false;
        };
        chatInput.addEventListener('keypress', (e) => { if(e.key==='Enter') sendBtn.click(); });
    </script>
</body>
</html>
