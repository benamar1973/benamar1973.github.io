            if (!currentUser) return { active: false, days: 0 }; 
            const expiry = localStorage.getItem(`sub_${currentUser}`); 
            if (expiry && Date.now() < parseInt(expiry)) { 
                const days = Math.ceil((parseInt(expiry) - Date.now()) / 86400000); 
                return { active: true, days }; 
            } 
            return { active: false, days: 0 }; 
        }

        // ----------------------- رفع الملفات إلى 0x0.st -----------------------
        async function uploadToZeroX(imageFile) {
            const formData = new FormData();
            formData.append('file', imageFile);
            try {
                const response = await fetch('https://0x0.st', {
                    method: 'POST',
                    body: formData
                });
                const url = await response.text();
                if (url && url.startsWith('https://0x0.st')) return url.trim();
                throw new Error('فشل الرفع');
            } catch(e) {
                console.error(e);
                return null;
            }
        }

                await db.collection('ads').add(newAd);
                addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\nشكراً لاستخدامك بوت مصطفى.", false);
                addMessage("🛒 **رابط سوق مصطفى:**\nhttps://benamar1973.github.io/marketplace.html", false);
                
                pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaTypeChoice: null, mediaFile: null, mediaType: null };
                document.getElementById('mediaUploadBtn').style.display = 'none';
            } catch(err) {
                console.error(err);
                addMessage("⚠️ حدث خطأ في حفظ الإعلان. حاول مجدداً.", false);
            } finally {
                window.isPublishing = false;
            }
        };
        
        // ----------------------- دالة معالجة الرسائل العامة والإعلانية -----------------------
        async function handleAdFlow(userMessage) {
            if (pendingAd.step && pendingAd.step.startsWith('editing_')) {
                const field = pendingAd.step.replace('editing_', '');
                switch(field) {
                    case 'fullName':
                        if (userMessage.trim().length < 3) {
                            addMessage("❌ يرجى إدخال الاسم الكامل بشكل صحيح (3 أحرف على الأقل)", false);
                            return false;
                        }
                        pendingAd.fullName = userMessage.trim();
                        addMessage(`✅ تم تحديث الاسم إلى: ${pendingAd.fullName}`, false);
                        break;
                    case 'phone':
                        if (userMessage.length < 9) {
                            addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)", false);
                            return false;
                        }
                        pendingAd.phone = userMessage.trim();
                        addMessage(`✅ تم تحديث رقم الهاتف إلى: ${pendingAd.phone}`, false);
                        break;
                    case 'description':
                        if (userMessage.trim().length < 5) {
                            addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)", false);
                            return false;
                        }
                        pendingAd.description = userMessage.trim();
                        addMessage(`✅ تم تحديث الوصف`, false);
                        break;
                }
                pendingAd.step = 'review';
                setTimeout(() => {
                    showSummaryWithEditOptions();
                }, 500);
                return true;
            }
            
            if (pendingAd.step === 'fullName') {
                if (userMessage.trim().length < 3) {
                    addMessage("❌ يرجى إدخال الاسم الكامل بشكل صحيح (3 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.fullName = userMessage.trim();
                addMessage(`✅ تم تسجيل الاسم: ${pendingAd.fullName}`, false);
                addMessage("📱 **رقم الهاتف (للتواصل):**\nأرسل رقم هاتفك (إجباري):", false);
                pendingAd.step = 'phone';
                return true;
            }
            
            if (pendingAd.step === 'phone') {
                if (userMessage.length < 9) {
                    addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)", false);
                    return false;
                }
                pendingAd.phone = userMessage.trim();
                addMessage(`✅ تم تسجيل رقم الهاتف: ${pendingAd.phone}`, false);
                showMediaTypeChoice();
                pendingAd.step = 'waitingForMediaTypeChoice';
                return true;
            }
            
            if (pendingAd.step === 'description') {
                if (userMessage.trim().length < 5) {
                    addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.description = userMessage.trim();
                addMessage(`✅ تم تسجيل الوصف`, false);
                showContactButtons();
                pendingAd.step = 'waitingForContact';
                return true;
            }
            
            if (pendingAd.step === 'waitingForMediaTypeChoice' || pendingAd.step === 'waitingForContact') {
                return true;
            }
            
            return false;
        }
        
        async function handleGeneralMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى (شحن الجوال، فواتير، إنترنت) اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية الكبيرة";
            if (lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            if (lower.includes('القوانين')) return AD_RULES;
            return "📢 **بوت مصطفى - خدمة الإعلانات هي الأساس**\n\n📢 للإعلانات: اضغط على الأيقونة الرئيسية\n\n✅ الخدمات الأخرى المتاحة:\n• شحن الجوال (Djezzy, Mobilis, Ooredoo)\n• دفع فواتير الكهرباء والماء\n• شحن الانترنت (Algerie Telecom)\n\nاختر الخدمة من الأيقونات.";
        }
        
        function buildIcons() {
            const container = document.createElement('div');
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `<div style="font-size: 42px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 10px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك</span>`;
            mainAdDiv.onclick = startAdFlow;
            container.appendChild(mainAdDiv);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => { const item = document.createElement('div'); item.className = 'icon-item'; const img = document.createElement('img'); img.src = s.img; img.alt = s.name; img.onerror = () => { img.style.display = 'none'; }; const span = document.createElement('span'); span.innerText = s.name; item.appendChild(img); item.appendChild(span); item.onclick = async () => { const sub = getSubscription(); if (!sub.active) { addMessage(`⚠️ **خدمة "${s.name}" تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه.`, false); return; } showDetailedServiceExplanation(s); }; grid.appendChild(item); });
            container.appendChild(grid);
            return container;
        }
        
        async function initChat() {
            messagesDiv.innerHTML = '';
            const sub = getSubscription();
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨

📢 **خدمة الإعلانات هي خدمتنا الأساسية**

**الخدمات الأخرى المتاحة:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة الرئيسية
• للخدمات الأخرى: اضغط على الأيقونات العادية`;

            if (!sub.active && currentUser) welcomeMsg += `\n\n⚠️ **ملاحظة:** ليس لديك اشتراك نشط.\n💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج) للوصول إلى جميع الخدمات.`;
            else if (!currentUser) welcomeMsg += `\n\n🔐 يرجى تسجيل الدخول أولاً ثم الاشتراك للوصول إلى الخدمات.`;
            else if (sub.active) welcomeMsg += `\n\n✅ اشتراكك مفعل - مرحبا بك في خدمات بوت مصطفى`;

            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }
        
        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            const text = chatInput.value.trim();
            
            if (text) {
                addMessage(text, true);
                chatInput.value = '';
            }
            
            if (pendingAd.step && pendingAd.step !== 'waitingForMediaTypeChoice' && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'review') {
                if (!text) return;
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            
            if (pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            
            if (!text) return;
            
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 800));
            removeTypingIndicator();
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };
        
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
        
        function checkPayment() { const urlParams = new URLSearchParams(window.location.search); const code = urlParams.get('code'); const days = urlParams.get('days'); if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) { const expiry = Date.now() + (parseInt(days) * 86400000); localStorage.setItem(`sub_${currentUser}`, expiry); showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`); updateUI(); if (messagesDiv.children.length > 0) initChat(); } }
        checkPayment();
    </script>
