        .btn { background: #007bff; color: white; border: none; border-radius: 50px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-logout { background: #dc3545; margin-top: 15px; }
        .marketplace-link-btn { background: linear-gradient(135deg, #6f42c1, #8b5cf6); color: white; border: none; border-radius: 50px; padding: 12px 20px; margin-top: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        .user-info { background: #e8f0fe; border-radius: 25px; padding: 15px; margin: 15px 0; }

        .close-btn { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .bot-msg, .user-msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.5; animation: fadeIn 0.3s; white-space: pre-wrap; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bot-msg { background: #e3f2fd; align-self: flex-start; border-bottom-right-radius: 5px; }
        .user-msg { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; }
        .user-msg-img, .user-msg-video { background: #d4edda; align-self: flex-end; border-bottom-left-radius: 5px; padding: 8px 12px; max-width: 85%; }
        .input-area { background: white; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-wrap: wrap; }

        #mediaInput { display: none; }
        .contact-buttons { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
        .contact-btn { background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.2s; display: inline-flex; align-items: center; gap: 8px; }

        .contact-btn.phone { background: linear-gradient(135deg, #34b7f1, #1c8ad9); }

        .icon-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); border-color: #007bff; }
        .icon-item img { width: 55px; height: 55px; object-fit: contain; border-radius: 12px; margin-bottom: 6px; }
        .icon-item span { font-size: 12px; display: block; font-weight: bold; color: #333; }
        .main-ad-icon { background: linear-gradient(135deg, #ff6b35, #f7931e); border-radius: 20px; padding: 25px 15px; cursor: pointer; text-align: center; margin: 15px 0; border: 3px solid #ffd700; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        .main-ad-icon:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(255, 107, 53, 0.4); border-color: #fff; }
        .main-ad-icon .main-icon-title { font-size: 24px; font-weight: bold; color: white; display: block; margin-bottom: 6px; }
        .main-ad-icon .main-icon-sub { font-size: 14px; color: rgba(255, 255, 255, 0.9); display: block; }

        .footer-links { text-align: center; margin-top: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; max-width: 550px; width: 100%; }
        .footer-links a { color: white; text-decoration: none; margin: 0 8px; font-size: 13px; }
        .footer-links a:hover { text-decoration: underline; }

        .media-preview-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }

        .remove-media-btn { position: absolute; top: 2px; right: 2px; background: rgba(220,53,69,0.9); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .selected-media-info { background: #e8f0fe; border-radius: 12px; padding: 10px; margin: 10px 0; font-size: 14px; }
        .clear-storage-btn { background: #dc3545; color: white; border: none; border-radius: 50px; padding: 8px 15px; font-size: 12px; cursor: pointer; margin-top: 10px; }

</head>
<body>

    <script>

        const services = [
            { name: "📱 DJEZZY", img: "DJEZZY.png", url: "https://moncompte.djezzy.dz/fr/guest/recharge", description: "شحن رصيد هاتف دجازي", benefit: "🔹 **فائدة الرابط:** يتيح لك شحن رصيد هاتفك أو هاتف أي شخص آخر بسهولة وأمان.\n🔹 يمكنك الشحن بأي مبلغ (500, 1000, 2000, 5000 دج).", requirements: "📋 **متطلبات الدفع:**\n• رقم هاتف دجازي المراد شحنه 📱\n• بطاقة ذهبية أو CIB بنكية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اضغط على الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد العملية", needsCard: true },
            { name: "📱 mobilis", img: "MOBILIS.png", url: "https://e-paiement.mobilis.dz/", description: "شحن رصيد هاتف موبيليس", benefit: "🔹 **فائدة الرابط:** خدمة رسمية من موبيليس لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم موبيليس المراد شحنه 📱\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ افتح الرابط\n2️⃣ أدخل رقم الهاتف\n3️⃣ حدد المبلغ\n4️⃣ أدخل بيانات البطاقة\n5️⃣ تأكيد", needsCard: true },
            { name: "📱 Ooredoo", img: "OOREDOO.png", url: "https://estorm.ooredoo.dz/e-payment/payment/public/?lang=ar", description: "شحن رصيد هاتف أوريدو", benefit: "🔹 **فائدة الرابط:** خدمة E-Storm من أوريدو لشحن الرصيد.", requirements: "📋 **متطلبات الدفع:**\n• رقم أوريدو المراد شحنه 📱\n• بطاقة CIB أو ذهبية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اختر 'شحن الرصيد'\n2️⃣ أدخل رقم الهاتف\n3️⃣ اختر المبلغ\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد", needsCard: true },
            { name: "⚡ فاتورة الكهرباء", img: "SONELGAZ.png", url: "https://epayement.elit.dz/payementFacture.xhtml", description: "دفع فاتورة الكهرباء والغاز", benefit: "🔹 **فائدة الرابط:** دفع فواتير الكهرباء والغاز إلكترونياً بدون الحاجة للذهاب إلى الوكالات.\n🔹 تحصل على إشعار فوري بالدفع وإيصال إلكتروني.", requirements: "📋 **متطلبات الدفع:**\n• رقم العقد الموجود أعلى الفاتورة (14 رقم) 📄\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ أدخل رقم العقد المكون من 14 رقماً\n2️⃣ سيظهر المبلغ المطلوب دفعه\n3️⃣ اضغط على 'دفع الآن'\n4️⃣ اختر طريقة الدفع\n5️⃣ أدخل بيانات البطاقة\n6️⃣ تأكيد الدفع\n7️⃣ احفظ الإيصال الإلكتروني", needsCard: false },
            { name: "💧 فاتورة الماء", img: "SEAAL.png", url: "https://fatourati.seaal.dz/", description: "دفع فاتورة الماء", benefit: "🔹 **فائدة الرابط:** منصة SEAAL الرسمية لدفع فواتير الماء.\n🔹 يمكنك دفع الفاتورة الشهرية أو السنوية.", requirements: "📋 **متطلبات الدفع:**\n• رقم المشترك الموجود على الفاتورة 📄\n• بطاقة دفع إلكترونية 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ أدخل رقم المشترك\n2️⃣ اختر الفاتورة المراد دفعها\n3️⃣ اضغط على 'دفع'\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد وطباعة الإيصال", needsCard: false },
            { name: "🌐 شحن الانترنت", img: "ALGERIE TELECOM.png", url: "https://paiement.at.dz/index.php?p=internet_recharge&pr=in", description: "شحن رصيد الانترنت (Algerie Telecom)", benefit: "🔹 **فائدة الرابط:** شحن رصيد الانترنت الخاص بك من منزلك.\n🔹 خدمة سريعة وآمنة من اتصالات الجزائر.", requirements: "📋 **متطلبات الدفع:**\n• رقم الهاتف الثابت أو حساب الانترنت 📡\n• بطاقة ذهبية أو CIB 💳", steps: "📝 **خطوات التسجيل:**\n1️⃣ اضغط على الرابط\n2️⃣ أدخل بيانات حسابك\n3️⃣ اختر المبلغ المناسب\n4️⃣ أدخل بيانات الدفع\n5️⃣ تأكيد العملية\n6️⃣ سيصلك الرصيد فوراً", needsCard: true }
        ];

        const AD_RULES = `📜 **قوانين نشر الإعلانات:**

❌ لا إعلانات مخلة بالآداب
❌ لا عنف أو كراهية
❌ لا منتجات ممنوعة أو احتيال
❌ لا إعلانات سياسية أو دينية
✅ الإعلان يكون حلالاً ومفيداً
✅ يحترم قوانين النشر في الجزائر

⚠️ المخالفة تؤدي إلى حظر الحساب فوراً.

━━━━━━━━━━━━━━━━━━━
🎯 **فوائد بوت مصطفى:**

💰 وصول لأكثر من 5000 عميل يومياً
📢 نشر إعلانك على صفحتنا بقوة
⚡ زيادة مبيعاتك بنسبة تصل إلى 70%
🖼️ دعم الصور والفيديوهات
📱 وسائل تواصل متعددة (واتساب - مسنجر - هاتف)
🛡️ أمان تام وحماية خصوصيتك
⏰ دعم فني على مدار الساعة
🎁 عروض وخصومات حصرية للمشتركين`;

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2500); }
        
        function getSubscription() { 
            if (!currentUser) return { active: false, days: 0 }; 
            const expiry = localStorage.getItem(`sub_${currentUser}`); 
            if (expiry && Date.now() < parseInt(expiry)) { 
                const days = Math.ceil((parseInt(expiry) - Date.now()) / 86400000); 
                return { active: true, days }; 
            } 
            return { active: false, days: 0 }; 
        }
        
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').innerHTML = `👤 ${currentUser.split('@')[0]}`;
            const sub = getSubscription();
            if (sub.active) {
                document.getElementById('daysLeft').innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
                document.getElementById('planText').innerHTML = '✨ مرحبا بك في خدمات بوت مصطفى ✨';
                document.getElementById('paymentSection').innerHTML = '';
            } else {

        // ضغط أقوى للصور (400px، جودة 35%)
        function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.35) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = (width * maxHeight) / height;
                            height = maxHeight;
                        }
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        mediaUploadBtn.onclick = () => { 
            if (pendingAd.step === 'waitingForMedia') {
                mediaInput.click();
            } else {
                showToast("⚠️ يرجى الوصول إلى مرحلة رفع الملفات أولاً");
            }
        };
        
        mediaInput.onchange = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            if (pendingAd.step !== 'waitingForMedia') {
                showToast("⚠️ يرجى الوصول إلى مرحلة رفع الملفات أولاً");
                mediaInput.value = '';
                return;
            }
            
            if (pendingAd.mediaItems.length + files.length > 5) {
                showToast("⚠️ يمكنك رفع 5 ملفات كحد أقصى للحفاظ على المساحة");
                mediaInput.value = '';
                return;
            }
            
            showToast(`🔄 جاري معالجة ${files.length} ملف...`);
            
            for (const file of files) {
                const fileType = file.type;
                let mediaType = null;
                let processedData = null;
                
                if (fileType.startsWith('image/')) {
                    mediaType = 'image';
                    try {
                        const compressedBlob = await compressImage(file, 400, 400, 0.35);
                        processedData = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(compressedBlob);
                        });
                    } catch(e) {
                        const reader = new FileReader();
                        processedData = await new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                    }
                } else if (fileType.startsWith('video/')) {
                    mediaType = 'video';
                    const reader = new FileReader();
                    processedData = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                } else {
                    continue;
                }
                
                pendingAd.mediaItems.push({
                    type: mediaType,
                    data: processedData
                });
                
                addMediaMessage(processedData, mediaType, true);
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            window.updateMediaPreview();
            showToast(`✅ تم رفع ${pendingAd.mediaItems.length} ملف بنجاح`);
            
            if (pendingAd.mediaItems.length > 0 && pendingAd.step === 'waitingForMedia') {
                addMessage(`✅ تم استلام ${pendingAd.mediaItems.length} ملف بنجاح!`, false);
                setTimeout(() => {

                    pendingAd.step = 'description';
                }, 500);
            }
            
            mediaInput.value = '';
        };

                <div class="alice-info">
                    <div class="alice-description">
                        <strong>📝 وصف المنتج:</strong><br>
                        ${pendingAd.description}
                    </div>
                    <div style="margin-bottom: 12px; padding: 8px; background: #f0f2f5; border-radius: 12px; text-align: center;">
                        ${contactIcon} <strong>${contactText}</strong>
                    </div>
                    <button class="alice-contact-btn" onclick="window.open('${contactLink}', '_blank')">
                        📞 اتصل الآن
                    </button>
                </div>
            `;
            
            const mainContainer = previewDiv.querySelector('#aliceMainContainer');
            const thumbsContainer = previewDiv.querySelector('#aliceThumbnailsContainer');
            mainContainer.appendChild(mainMediaDiv);
            thumbsContainer.appendChild(thumbnailsDiv);
            
            previewContainer.appendChild(previewDiv);
            
            const finalButtons = document.createElement('div');
            finalButtons.className = 'confirm-buttons';
            finalButtons.innerHTML = `
                <button class="confirm-yes" onclick="window.finalPublish()">✅ تأكيد النشر</button>
                <button class="edit-btn" onclick="window.backToEdit()">✏️ العودة للتعديل</button>
                <button class="confirm-no" onclick="window.cancelAd()">❌ إلغاء</button>
            `;
            previewContainer.appendChild(finalButtons);
            
            messagesDiv.appendChild(previewContainer);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.backToEdit = () => {
            const lastMsg = messagesDiv.lastChild;
            if (lastMsg) messagesDiv.removeChild(lastMsg);
            showSummaryWithEditOptions();
        };
        
        window.finalPublish = async () => {
            if (window.isPublishing) return;
            window.isPublishing = true;
            
            try {
                addMessage("🚀 جاري نشر إعلانك...", false);
                showTypingIndicator();
                
                // التحقق من صحة البيانات
                if (!pendingAd.fullName || !pendingAd.phone || !pendingAd.description || !pendingAd.contactMethod || pendingAd.mediaItems.length === 0) {
                    addMessage("⚠️ خطأ: البيانات غير مكتملة.", false);
                    removeTypingIndicator();
                    window.isPublishing = false;
                    return;
                }
                
                // تجربة حفظ الإعلان مع التحقق من المساحة
                let existingAds = [];
                const stored = localStorage.getItem('marketplace_ads');
                if (stored) {
                    try {
                        existingAds = JSON.parse(stored);
                        if (!Array.isArray(existingAds)) existingAds = [];
                    } catch(e) {
                        existingAds = [];
                    }
                }
                
                // الاحتفاظ بآخر 10 إعلانات فقط لتوفير المساحة
                if (existingAds.length >= 10) {
                    existingAds = existingAds.slice(0, 9);
                }
                
                const newAd = {
                    id: Date.now(),
                    name: pendingAd.fullName.trim(),
                    phone: pendingAd.phone.trim(),
                    description: pendingAd.description.trim(),
                    contactMethod: pendingAd.contactMethod,
                    mediaItems: pendingAd.mediaItems,
                    userId: currentUser || localStorage.getItem('currentUser') || 'guest',
                    date: Date.now(),
                    views: 0,
                    likes: 0
                };
                
                existingAds.unshift(newAd);
                
                // محاولة الحفظ
                localStorage.setItem('marketplace_ads', JSON.stringify(existingAds));
                
                await new Promise(resolve => setTimeout(resolve, 1500));
                removeTypingIndicator();
                
                addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.", false);
                addMessage("🛒 **رابط سوق مصطفى:**\nmarketplace.html", false);
                
                document.getElementById('mediaUploadBtn').style.display = 'none';
                pendingAd = { step: null, fullName: null, phone: null, description: null, contactMethod: null, mediaItems: [] };
                
            } catch (error) {
                console.error("خطأ في النشر:", error);
                removeTypingIndicator();
                if (error.message && error.message.includes('quota')) {
                    addMessage("⚠️ **مساحة التخزين ممتلئة!** الرجاء الضغط على زر 'مسح الإعلانات القديمة' في الواجهة الرئيسية ثم المحاولة مرة أخرى.", false);
                } else {
                    addMessage("⚠️ حدث خطأ أثناء نشر الإعلان: " + error.message, false);
                }
            } finally {
                window.isPublishing = false;
            }
        };

        async function handleAdFlow(userMessage) {
            if (pendingAd.step && pendingAd.step.startsWith('editing_')) {
                const field = pendingAd.step.replace('editing_', '');
                switch(field) {
                    case 'fullName':
                        if (userMessage.trim().length < 3) {
                            addMessage("❌ يرجى إدخال الاسم الكامل بشكل صحيح (3 أحرف على الأقل)", false);
                            return false;
                        }
                        pendingAd.fullName = userMessage.trim();
                        addMessage(`✅ تم تحديث الاسم إلى: ${pendingAd.fullName}`, false);
                        break;
                    case 'phone':
                        if (userMessage.length < 9) {
                            addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)", false);
                            return false;
                        }
                        pendingAd.phone = userMessage.trim();
                        addMessage(`✅ تم تحديث رقم الهاتف إلى: ${pendingAd.phone}`, false);
                        break;
                    case 'description':
                        if (userMessage.trim().length < 5) {
                            addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)", false);
                            return false;
                        }
                        pendingAd.description = userMessage.trim();
                        addMessage(`✅ تم تحديث الوصف`, false);
                        break;
                }
                pendingAd.step = 'review';
                setTimeout(() => {
                    showSummaryWithEditOptions();
                }, 500);
                return true;
            }
            
            if (pendingAd.step === 'fullName') {
                if (userMessage.trim().length < 3) {
                    addMessage("❌ يرجى إدخال الاسم الكامل بشكل صحيح (3 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.fullName = userMessage.trim();
                addMessage(`✅ تم تسجيل الاسم: ${pendingAd.fullName}`, false);
                addMessage("📱 **رقم الهاتف (للتواصل):**\nأرسل رقم هاتفك (إجباري):", false);
                pendingAd.step = 'phone';
                return true;
            }
            
            if (pendingAd.step === 'phone') {
                if (userMessage.length < 9) {
                    addMessage("❌ يرجى إدخال رقم هاتف صحيح (مثال: 0555123456)", false);
                    return false;
                }
                pendingAd.phone = userMessage.trim();
                addMessage(`✅ تم تسجيل رقم الهاتف: ${pendingAd.phone}`, false);
                showMediaUploadInterface();
                return true;
            }
            
            if (pendingAd.step === 'description') {
                if (userMessage.trim().length < 5) {
                    addMessage("❌ يرجى كتابة وصف أطول (5 أحرف على الأقل)", false);
                    return false;
                }
                pendingAd.description = userMessage.trim();
                addMessage(`✅ تم تسجيل الوصف`, false);
                showContactButtons();
                pendingAd.step = 'waitingForContact';
                return true;
            }
            
            if (pendingAd.step === 'waitingForMedia' || pendingAd.step === 'waitingForContact' || pendingAd.step === 'review') {
                return true;
            }
            
            return false;
        }

        async function handleGeneralMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** هي خدمتنا الأساسية\n\n📱 للخدمات الأخرى (شحن الجوال، فواتير، إنترنت) اضغط على الأيقونات أدناه.\n\n📢 لنشر إعلان: اضغط على الأيقونة البرتقالية الكبيرة";
            if (lower.includes('شكر')) return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            if (lower.includes('القوانين')) return AD_RULES;
            return "📢 **بوت مصطفى - خدمة الإعلانات هي الأساس**\n\n📢 للإعلانات: اضغط على الأيقونة الرئيسية\n\n✅ الخدمات الأخرى المتاحة:\n• شحن الجوال (Djezzy, Mobilis, Ooredoo)\n• دفع فواتير الكهرباء والماء\n• شحن الانترنت (Algerie Telecom)\n\nاختر الخدمة من الأيقونات.";
        }

        function buildIcons() {
            const container = document.createElement('div');
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `<div style="font-size: 42px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 10px;">🛒 mustapha market</div><span class="main-icon-title">📢 خدمة الإعلانات</span><span class="main-icon-sub">انشر إعلانك</span>`;
            mainAdDiv.onclick = async () => { const sub = getSubscription(); if (!sub.active) { addMessage(`⚠️ **خدمة الإعلانات تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).\n💰 أقل من 4 دج إشتراك يومياً`, false); return; } await startAdFlow(); };
            container.appendChild(mainAdDiv);
            const grid = document.createElement('div'); grid.className = 'icon-grid';
            services.forEach(s => { const item = document.createElement('div'); item.className = 'icon-item'; const img = document.createElement('img'); img.src = s.img; img.alt = s.name; img.onerror = () => { img.style.display = 'none'; }; const span = document.createElement('span'); span.innerText = s.name; item.appendChild(img); item.appendChild(span); item.onclick = async () => { const sub = getSubscription(); if (!sub.active) { addMessage(`⚠️ **خدمة "${s.name}" تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه.`, false); return; } showDetailedServiceExplanation(s); }; grid.appendChild(item); });
            container.appendChild(grid);
            return container;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            const sub = getSubscription();
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨

📢 **خدمة الإعلانات هي خدمتنا الأساسية**

**الخدمات الأخرى المتاحة:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة الرئيسية
• للخدمات الأخرى: اضغط على الأيقونات العادية`;

            if (!sub.active && currentUser) welcomeMsg += `\n\n⚠️ **ملاحظة:** ليس لديك اشتراك نشط.\n💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج) للوصول إلى جميع الخدمات.`;
            else if (!currentUser) welcomeMsg += `\n\n🔐 يرجى تسجيل الدخول أولاً ثم الاشتراك للوصول إلى الخدمات.`;
            else if (sub.active) welcomeMsg += `\n\n✅ اشتراكك مفعل - مرحبا بك في خدمات بوت مصطفى`;

            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }

        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            const text = chatInput.value.trim();
            
            if (text) {
                addMessage(text, true);
                chatInput.value = '';
            }
            
            if (pendingAd.step && pendingAd.step !== 'waitingForMedia' && pendingAd.step !== 'waitingForContact' && pendingAd.step !== 'review') {
                if (!text) return;
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            
            if (pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            
            if (!text) return;
            
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 800));
            removeTypingIndicator();
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };

        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        function checkPayment() { const urlParams = new URLSearchParams(window.location.search); const code = urlParams.get('code'); const days = urlParams.get('days'); if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) { const expiry = Date.now() + (parseInt(days) * 86400000); localStorage.setItem(`sub_${currentUser}`, expiry); showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`); updateUI(); if (messagesDiv.children.length > 0) initChat(); } }
        checkPayment();
    </script>
</body>
