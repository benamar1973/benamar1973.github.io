<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بوت مصطفى - خدمة الإعلانات</title>
    <!-- سياسة أمان المحتوى (CSP) خفيفة - لا تمنع الروابط الخارجية -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-src https:;">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .top-bot-bar {
            width: 100%;
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 80px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: glow 2s infinite;
        }

        .top-bot-bar:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.4);
        }

        @keyframes glow {
            0% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(0, 123, 255, 0.6); }
            100% { box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3); }
        }

        .top-bot-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-bot-text span:first-child {
            font-size: 3rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .top-bot-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            display: block;
        }

        .container {
            max-width: 550px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 35px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }

        .version {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 50px;
            border: 1px solid #ddd;
            font-size: 16px;
            text-align: center;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
        }

        .btn-logout {
            background: #dc3545;
            margin-top: 15px;
        }

        .user-info {
            background: #e8f0fe;
            border-radius: 25px;
            padding: 15px;
            margin: 15px 0;
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #0f3460;
            word-break: break-all;
        }

        .sub-days {
            background: #fff3cd;
            border-radius: 40px;
            padding: 8px;
            margin: 10px 0;
            font-size: 14px;
        }

        .payment-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .payment-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .payment-btn:hover {
            transform: scale(1.05);
        }

        .chat-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: 0.3s;
            direction: rtl;
        }

        .chat-fullscreen.open {
            transform: translateY(0);
        }

        .chat-header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bot-msg, .user-msg {
            padding: 12px 16px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-msg {
            background: #e3f2fd;
            align-self: flex-start;
            border-bottom-right-radius: 5px;
        }

        .user-msg {
            background: #d4edda;
            align-self: flex-end;
            border-bottom-left-radius: 5px;
        }

        .input-area {
            background: white;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        #chatInput {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 30px;
            padding: 12px;
            font-family: inherit;
            font-size: 15px;
        }

        #sendBtn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin: 10px 0;
        }

        @media (min-width: 550px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .icon-item {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 20px;
            padding: 12px 8px;
            cursor: pointer;
            text-align: center;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }

        .icon-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #007bff;
        }

        .icon-item img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .icon-item span {
            font-size: 12px;
            display: block;
            font-weight: bold;
            color: #333;
        }

        .main-ad-icon {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            text-align: center;
            margin: 15px 0;
            border: 3px solid #ffd700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .main-ad-icon:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 107, 53, 0.4);
            border-color: #fff;
        }

        .main-ad-icon img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .main-ad-icon .main-icon-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            display: block;
            margin-bottom: 6px;
        }

        .main-ad-icon .main-icon-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            transition: 0.3s;
            z-index: 9999;
            font-weight: bold;
            pointer-events: none;
        }

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            display: inline-block;
            animation: typingAnim 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @media (max-width: 480px) {
            .top-bot-text { font-size: 1.6rem; }
            .top-bot-text span:first-child { font-size: 2.2rem; }
            .top-bot-bar { padding: 15px 20px; }
            .main-ad-icon img { width: 100px; height: 100px; }
            .main-ad-icon .main-icon-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="top-bot-bar" id="topBotBar">

    <div id="toast" class="toast"></div>

    <script>
        // ========== التحسينات الأمنية المضافة فقط ==========
        
        // 1. تنقية النصوص (Sanitize) - حماية من XSS
        function sanitizeInput(text) {
            if (!text) return '';
            // إزالة HTML tags وترميز الأحرف الخطرة
            return text.replace(/[<>]/g, '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').substring(0, 2000);
        }
        
        // 2. التحقق من صحة الروابط
        function validateUrl(url) {
            try {
                const parsed = new URL(url);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch {
                return false;
            }
        }
        
        // 3. Rate Limiting - منع إغراق البوت
        let lastMessageTime = 0;

                needsCard: true

        ];

        const AD_RULES = `📜 **قوانين نشر الإعلانات:**

❌ لا إعلانات مخلة بالآداب
❌ لا عنف أو كراهية
❌ لا منتجات ممنوعة أو احتيال
❌ لا إعلانات سياسية أو دينية
✅ الإعلان يكون حلالاً ومفيداً
✅ يحترم قوانين النشر في الجزائر

⚠️ المخالفة تؤدي إلى حظر الحساب فوراً.`;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = sanitizeInput(msg);
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        function getSubscription() {
            if (!currentUser) return { active: false, days: 0 };
            const expiry = localStorage.getItem(`sub_${currentUser}`);
            if (expiry && Date.now() < parseInt(expiry)) {
                const days = Math.ceil((parseInt(expiry) - Date.now()) / (86400000));
                return { active: true, days };
            }
            return { active: false, days: 0 };
        }

        function updateUI() {
            if (!currentUser) return;
            const userNameSpan = document.getElementById('userName');
            const daysLeftSpan = document.getElementById('daysLeft');
            const planTextSpan = document.getElementById('planText');
            const paymentSection = document.getElementById('paymentSection');
            
            userNameSpan.innerHTML = `👤 ${sanitizeInput(currentUser.split('@')[0])}`;
            const sub = getSubscription();
            
            if (sub.active) {
                daysLeftSpan.innerHTML = `✅ اشتراكك مفعل - يتبقى ${sub.days} يوم`;
                planTextSpan.innerHTML = '✨ صفحة خدماتي SPONSSORE على طول السنة ✨';
                paymentSection.innerHTML = '';
            } else {
                daysLeftSpan.innerHTML = '⚠️ لا يوجد اشتراك نشط';
                planTextSpan.innerHTML = '⚠️ يرجى الاشتراك للوصول إلى جميع الخدمات';
                paymentSection.innerHTML = `
                    <div class="payment-buttons">
                        <button class="payment-btn" onclick="window.open('https://pay.chargily.com/payment-links/01ksbjdn2ta8exe7knnayrmhn8', '_blank')">📅 اشتراك سنوي 1000 دج</button>
                    </div>
                    <div style="font-size:12px; color:#666; margin-top:8px;">
                        💡 أقل من 4 دج إشتراك يومياً | يمكنك تحقيق هدف كنت تصرف عليه أكثر من 2000 دج
                    </div>
                `;
            }
        }

        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('emailInput').value.trim();
            if (!email || !email.includes('@')) {
                document.getElementById('loginMsg').innerText = '❌ أدخل بريداً إلكترونياً صحيحاً';
                return;
            }
            currentUser = sanitizeInput(email);
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            updateUI();
            showToast(`مرحباً ${sanitizeInput(email.split('@')[0])} في بوت مصطفى 🚀`);
        };

        document.getElementById('logoutBtn').onclick = () => {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('emailInput').value = '';
            pendingAd = { step: null, link: null, description: null };
            pendingService = null;
            showToast('تم تسجيل الخروج');
        };

        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = sanitizeInput(savedUser);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            updateUI();
        }

        const messagesDiv = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatFull = document.getElementById('chatFullscreen');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const topBotBar = document.getElementById('topBotBar');

        topBotBar.onclick = () => {
            chatFull.classList.add('open');
            if (messagesDiv.children.length === 0) initChat();
        };
        closeChatBtn.onclick = () => chatFull.classList.remove('open');

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'bot-msg';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'user-msg' : 'bot-msg';
            div.innerText = text; // innerText آمن من XSS
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showDetailedServiceExplanation(service) {
            let msg = `📌 **${service.name}** - ${service.description}\n\n`;
            msg += `${service.benefit}\n\n`;
            msg += `${service.requirements}\n\n`;
            msg += `${service.steps}\n\n`;
            if (service.needsCard) {
                msg += `💳 **ملاحظة مهمة:** تحتاج إلى بطاقة بنكية (ذهبية أو CIB) لإتمام عملية الدفع.\n\n`;
            }
            msg += `❓ **هل أنت جاهز لفتح الرابط الآن؟**\nأجب بـ 'نعم' لفتح الرابط مباشرة، أو 'لا' للعودة للقائمة.`;
            addMessage(msg, false);
            pendingService = service;
        }

        async function handleServiceReply(text) {
            const lower = text.trim().toLowerCase();
            if (lower === 'نعم' || lower === 'yes' || lower === 'جاهز') {
                if (pendingService) {
                    window.open(pendingService.url, '_blank');
                    await addMessage(`✅ **تم فتح رابط "${pendingService.name}" بنجاح!**\n\nيمكنك الآن اتباع الخطوات لإتمام العملية.`, false);
                    pendingService = null;
                }
                return true;
            } else if (lower === 'لا' || lower === 'لأ' || lower === 'ليس الآن') {
                await addMessage("🙂 **لا مشكلة!** يمكنك اختيار خدمة أخرى من الأيقونات.", false);
                pendingService = null;
                return true;
            }
            return false;
        }

        async function startAdFlow() {
            addMessage(AD_RULES, false);
            await new Promise(resolve => setTimeout(resolve, 1000));
            addMessage("📢 **لنبدأ عملية نشر إعلانك!**\n\n🔗 من فضلك أرسل رابط الإعلان (مثال: https://example.com/product)", false);
            pendingAd.step = 'link';
        }

        async function handleAdFlow(userMessage) {
            const sanitizedMsg = sanitizeInput(userMessage);
            
            if (pendingAd.step === 'link') {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const match = sanitizedMsg.match(urlRegex);
                if (!match || !validateUrl(match[0])) {
                    addMessage("❌ الرابط غير صحيح. يرجى إرسال رابط صحيح يبدأ بـ http:// أو https://", false);
                    return false;
                }
                pendingAd.link = match[0];
                addMessage("✅ تم استلام الرابط بنجاح!\n\n📝 هل تريد إضافة وصف للإعلان؟\n(أرسل الوصف أو اكتب 'لا' لتخطي)", false);
                pendingAd.step = 'description';
                return true;
            }
            
            if (pendingAd.step === 'description') {
                if (sanitizedMsg.toLowerCase() !== 'لا') {
                    pendingAd.description = sanitizedMsg.substring(0, 500);
                    addMessage("✅ تم استلام الوصف.", false);
                } else {
                    pendingAd.description = "📢 إعلان جديد من أحد عملائنا";
                    addMessage("✅ تم تخطي الوصف.", false);
                }
                
                let summary = `📋 **ملخص إعلانك:**\n\n🔗 الرابط: ${pendingAd.link}\n`;
                summary += `📝 الوصف: ${pendingAd.description}\n\n`;
                summary += `❓ هل تريد تأكيد النشر على صفحة "خدماتي"؟\n(أجب بـ 'نعم' للنشر، أو 'لا' للإلغاء)`;
                addMessage(summary, false);
                pendingAd.step = 'confirm';
                return true;
            }
            
            if (pendingAd.step === 'confirm') {
                if (sanitizedMsg.toLowerCase() === 'نعم') {
                    addMessage("🚀 جاري نشر إعلانك على صفحة خدماتي...", false);
                    showTypingIndicator();
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    removeTypingIndicator();
                    addMessage("✅ **تم نشر إعلانك بنجاح!** 🎉\n\nشكراً لاستخدامك بوت مصطفى.\nيمكنك نشر إعلان آخر بالضغط على الأيقونة الرئيسية مرة أخرى.", false);
                    pendingAd = { step: null, link: null, description: null };
                } else if (sanitizedMsg.toLowerCase() === 'لا') {
                    addMessage("🙂 تم إلغاء نشر الإعلان. يمكنك البدء من جديد.", false);
                    pendingAd = { step: null, link: null, description: null };
                } else {
                    addMessage("❓ أجب بـ 'نعم' للتأكيد أو 'لا' للإلغاء.", false);
                }
                return true;
            }
            return false;
        }

        async function handleGeneralMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('مرحب') || lower.includes('السلام')) {
                return "وعليكم السلام ورحمة الله! 😊\nأهلاً بك في **بوت مصطفى**.\n\n📢 **خدمة الإعلانات** (الأساسية)\n📱 شحن الجوال\n⚡ دفع الفواتير\n🌐 شحن الانترنت\n\nاختر الخدمة من الأيقونات أعلاه.";
            }
            if (lower.includes('شكر')) {
                return "العفو! 🤍 أنا هنا لخدمتك دائماً.";
            }
            if (lower.includes('القوانين')) {
                return AD_RULES;
            }
            return "📢 **بوت مصطفى - خدمة الإعلانات هي الأساس**\n\n📢 للإعلانات: اضغط على الأيقونة الرئيسية (مستطيلة برتقالية)\n\n✅ الخدمات الأخرى المتاحة:\n• شحن الجوال (Djezzy, Mobilis, Ooredoo)\n• دفع فواتير الكهرباء والماء\n• شحن الانترنت (Algerie Telecom)\n\nاختر الخدمة من الأيقونات.";
        }

        function buildIcons() {
            const container = document.createElement('div');
            
            const mainAdDiv = document.createElement('div');
            mainAdDiv.className = 'main-ad-icon';
            mainAdDiv.innerHTML = `
                <img src="facebook-ads-logo.png" alt="خدمة الإعلانات" onerror="this.src='https://via.placeholder.com/140/ffffff/ff6b35?text=ADS'">
                <span class="main-icon-title">📢 خدمة الإعلانات</span>
                <span class="main-icon-sub">انشر إعلانك على صفحة خدماتي SPONSSORE</span>
            `;
            mainAdDiv.onclick = async () => {
                const sub = getSubscription();
                if (!sub.active) {
                    addMessage(`⚠️ **خدمة الإعلانات تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه (1000 دج سنوياً).\n💰 أقل من 4 دج إشتراك يومياً - يمكنك تحقيق هدف كنت تصرف عليه أكثر من 2000 دج`, false);
                    return;
                }
                await startAdFlow();
            };
            container.appendChild(mainAdDiv);
            
            const grid = document.createElement('div');
            grid.className = 'icon-grid';
            
            services.forEach(s => {
                const item = document.createElement('div');
                item.className = 'icon-item';
                const img = document.createElement('img');
                img.src = s.img;
                img.alt = s.name;
                img.onerror = () => { img.style.display = 'none'; };
                const span = document.createElement('span');
                span.innerText = s.name;
                item.appendChild(img);
                item.appendChild(span);
                item.onclick = async () => {
                    const sub = getSubscription();
                    if (!sub.active) {
                        addMessage(`⚠️ **خدمة "${s.name}" تتطلب اشتراكاً نشطاً.**\n\nللاشتراك: استخدم زر الدفع أعلاه.`, false);
                        return;
                    }
                    showDetailedServiceExplanation(s);
                };
                grid.appendChild(item);
            });
            
            container.appendChild(grid);
            return container;
        }

        async function initChat() {
            messagesDiv.innerHTML = '';
            const sub = getSubscription();
            let welcomeMsg = `✨ **أهلاً بك في بوت مصطفى** ✨

📢 **خدمة الإعلانات هي خدمتنا الأساسية** (الأيقونة البرتقالية المستطيلة)

**الخدمات الأخرى المتاحة:**
📱 شحن الجوال (Djezzy, Mobilis, Ooredoo)
⚡ دفع فواتير الكهرباء والغاز والماء
🌐 شحن الانترنت (Algerie Telecom)

**كيف تبدأ؟**
• للإعلانات: اضغط على الأيقونة الرئيسية الكبيرة
• للخدمات الأخرى: اضغط على الأيقونات العادية`;

            if (!sub.active && currentUser) {
                welcomeMsg += `

⚠️ **ملاحظة:** ليس لديك اشتراك نشط.
💰 استخدم زر الدفع أعلاه (اشتراك سنوي 1000 دج) للوصول إلى جميع الخدمات.
💡 أقل من 4 دج إشتراك يومياً - يمكنك تحقيق هدف كنت تصرف عليه أكثر من 2000 دج`;
            } else if (!currentUser) {
                welcomeMsg += `

🔐 يرجى تسجيل الدخول أولاً ثم الاشتراك للوصول إلى الخدمات.`;
            } else if (sub.active) {
                welcomeMsg += `

✅ اشتراكك مفعل - صفحة خدماتي SPONSSORE على طول السنة`;
            }

            addMessage(welcomeMsg, false);
            messagesDiv.appendChild(buildIcons());
        }

        // معالج الإرسال مع Rate Limiting
        sendBtn.onclick = async () => {
            if (isBotTyping) return;
            
            // Rate limiting - منع الإغراق
            const now = Date.now();
            if (now - lastMessageTime < MESSAGE_COOLDOWN) {
                showToast("⚠️ الرجاء الانتظار قليلاً قبل إرسال رسالة جديدة");
                return;
            }
            lastMessageTime = now;
            
            const text = chatInput.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            chatInput.value = '';
            
            if (pendingAd.step) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleAdFlow(text);
                isBotTyping = false;
                return;
            }
            
            if (pendingService) {
                isBotTyping = true;
                showTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeTypingIndicator();
                await handleServiceReply(text);
                isBotTyping = false;
                return;
            }
            
            isBotTyping = true;
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 800));
            removeTypingIndicator();
            
            const response = await handleGeneralMessage(text);
            addMessage(response, false);
            isBotTyping = false;
        };

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });

        // نظام تفعيل الاشتراك من رابط Chargily (نفس الكود الأصلي)
        function checkPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const days = urlParams.get('days');
            if (code && days && currentUser && (code === 'MONTHLY2024' || code === 'YEARLY2024')) {
                const expiry = Date.now() + (parseInt(days) * 86400000);
                localStorage.setItem(`sub_${currentUser}`, expiry);
                showToast(`✅ تم تفعيل اشتراكك لمدة ${days} يوماً!`);
                updateUI();
                if (messagesDiv.children.length > 0) {
                    initChat();
                }
            }
        }
        checkPayment();
    </script>
</body>
</html>
