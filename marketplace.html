<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>سوق مصطفى - بوت مصطفى</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: white;
            font-size: 2.5rem;
        }
        .header p {
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }
        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .ad-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .ad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .ad-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f2f5;
        }
        .ad-card-video {
            width: 100%;
            max-height: 220px;
        }
        .ad-card-content {
            padding: 18px;
        }
        .ad-card-name {
            font-size: 18px;
            font-weight: bold;
            color: #0f3460;
            margin-bottom: 5px;
        }
        .ad-card-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }
        .ad-card-desc {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ad-card-contact {
            background: #e8f0fe;
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
        }
        .contact-whatsapp { color: #25D366; font-weight: bold; }
        .contact-messenger { color: #0084ff; font-weight: bold; }
        .contact-phone { color: #34b7f1; font-weight: bold; }
        .contact-link {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 15px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 12px;
        }
        .contact-link.messenger { background: #0084ff; }
        .contact-link.phone { background: #34b7f1; }
        .no-ads {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #666;
            max-width: 500px;
            margin: 50px auto;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 50px;
        }
        .refresh-btn {
            display: inline-block;
            margin-right: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        .modal-content {
            background: white;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 85%;
            overflow-y: auto;
            position: relative;
            animation: modalFadeIn 0.3s;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }
        .modal-video {
            width: 100%;
            max-height: 300px;
        }
        .modal-content-inner {
            padding: 20px;
        }
        .modal-name {
            font-size: 24px;
            font-weight: bold;
            color: #0f3460;
            margin-bottom: 5px;
        }
        .modal-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }
        .modal-desc {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-contact {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-top: 10px;
        }
        .modal-contact-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .modal-whatsapp {
            background: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .modal-phone {
            background: #34b7f1;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        @media (max-width: 700px) {
            .marketplace-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div style="max-width: 1400px; margin: 0 auto;">
        <div class="header">
            <a href="index.html" class="back-link">← العودة إلى بوت مصطفى</a>
            <button class="refresh-btn" onclick="loadAds()">🔄 تحديث الإعلانات</button>
            <h1>🛒 سوق مصطفى</h1>
            <p>أول سوق إعلانات جزائري 100% | اضغط على أي إعلان لمشاهدة التفاصيل</p>
        </div>
        
        <div class="marketplace-grid" id="marketplaceGrid">
            <div class="no-ads">📭 جاري تحميل الإعلانات...</div>
        </div>
        
        <div class="footer">
            <p>© 2025 بوت مصطفى - سوق مصطفى | لنشر إعلانك: <a href="index.html" style="color:#28a745;">اضغط هنا</a></p>
        </div>
    </div>

    <div id="adModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let currentAds = [];
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar') + ' ' + date.toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'});
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // دالة فتح المعاينة
        function openModal(ad) {
            console.log("فتح المعاينة للإعلان:", ad);
            const modal = document.getElementById('adModal');
            const modalContent = document.getElementById('modalContent');
            
            let mediaHtml = '';
            if (ad.image && ad.imageType === 'image') {
                mediaHtml = `<img class="modal-img" src="${ad.image}" alt="${ad.name}">`;
            } else if (ad.image && ad.imageType === 'video') {
                mediaHtml = `<video class="modal-video" src="${ad.image}" controls autoplay></video>`;
            } else {
                mediaHtml = `<div style="background:#f0f2f5; height:200px; display:flex; align-items:center; justify-content:center; color:#65676B;">🖼️ لا توجد صورة</div>`;
            }
            
            let contactMethodText = '';
            let contactIcon = '';
            let contactButtons = '';
            
            if (ad.contactMethod === 'whatsapp') {
                contactMethodText = `واتساب: ${ad.phone}`;
                contactIcon = '💚';
                contactButtons = `<a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" class="modal-whatsapp">💚 تواصل عبر واتساب</a>`;
            } else if (ad.contactMethod === 'messenger') {
                contactMethodText = `مسنجر: ${ad.phone}`;
                contactIcon = '💬';
                contactButtons = `<span style="font-size:14px; color:#0084ff;">🔍 ابحث عن هذا الرقم في مسنجر: ${ad.phone}</span>`;
            } else {
                contactMethodText = `هاتف: ${ad.phone}`;
                contactIcon = '📱';
                contactButtons = `<a href="tel:${ad.phone}" class="modal-phone">📞 اتصل الآن</a>`;
            }
            
            modalContent.innerHTML = `
                ${mediaHtml}
                <div class="modal-content-inner">
                    <div class="modal-name">${escapeHtml(ad.name)}</div>
                    <div class="modal-date">📅 ${formatDate(ad.date)}</div>
                    <div class="modal-desc">${escapeHtml(ad.description)}</div>
                    <div class="modal-contact">
                        <div style="font-size:16px; margin-bottom:10px;">${contactIcon} ${contactMethodText}</div>
                        <div class="modal-contact-buttons">
                            ${contactButtons}
                        </div>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            const modal = document.getElementById('adModal');
            modal.style.display = 'none';
            const modalContent = document.getElementById('modalContent');
            const video = modalContent.querySelector('video');
            if (video) {
                video.pause();
            }
        }
        
        window.onclick = (event) => {
            const modal = document.getElementById('adModal');
            if (event.target === modal) {
                closeModal();
            }
        }
        
        function renderAds(ads) {
            const grid = document.getElementById('marketplaceGrid');
            currentAds = ads;
            
            if (!ads || ads.length === 0) {
                grid.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات حالياً. كن أول من ينشر إعلاناً! 🚀</div>';
                return;
            }
            
            grid.innerHTML = '';
            for (let i = 0; i < ads.length; i++) {
                const ad = ads[i];
                const adCard = document.createElement('div');
                adCard.className = 'ad-card';
                adCard.onclick = (function(index) {
                    return function() { openModal(currentAds[index]); };
                })(i);
                
                let mediaHtml = '';
                if (ad.image && ad.imageType === 'image') {
                    mediaHtml = `<img class="ad-card-img" src="${ad.image}" alt="${ad.name}">`;
                } else if (ad.image && ad.imageType === 'video') {
                    mediaHtml = `<video class="ad-card-video" src="${ad.image}" controls onclick="event.stopPropagation()"></video>`;
                } else {
                    mediaHtml = '<div class="ad-card-img" style="display:flex;align-items:center;justify-content:center;">🖼️ لا توجد صورة</div>';
                }
                
                let contactHtml = '';
                if (ad.contactMethod === 'whatsapp') {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-whatsapp">💚 واتساب: ${escapeHtml(ad.phone)}</span><br>
                            <a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" class="contact-link" onclick="event.stopPropagation()">📱 تواصل عبر واتساب</a>
                        </div>
                    `;
                } else if (ad.contactMethod === 'messenger') {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-messenger">💬 مسنجر: ${escapeHtml(ad.phone)}</span><br>
                            <span style="font-size:12px;" onclick="event.stopPropagation()">🔍 ابحث عن هذا الرقم في مسنجر</span>
                        </div>
                    `;
                } else {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-phone">📱 هاتف: ${escapeHtml(ad.phone)}</span><br>
                            <a href="tel:${ad.phone}" class="contact-link phone" onclick="event.stopPropagation()">📞 اتصل الآن</a>
                        </div>
                    `;
                }
                
                adCard.innerHTML = `
                    ${mediaHtml}
                    <div class="ad-card-content">
                        <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                        <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                        <div class="ad-card-desc">${escapeHtml(ad.description)}</div>
                        ${contactHtml}
                    </div>
                `;
                
                grid.appendChild(adCard);
            }
        }
        
        async function loadAds() {
            const grid = document.getElementById('marketplaceGrid');
            grid.innerHTML = '<div class="no-ads">📭 جاري تحميل الإعلانات...</div>';
            
            const ads = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
            console.log("تم تحميل الإعلانات:", ads.length);
            renderAds(ads);
        }
        
        loadAds();
        
        window.addEventListener('storage', (e) => {
            if (e.key === 'marketplace_ads') {
                loadAds();
            }
        });
    </script>
</body>
</html>
