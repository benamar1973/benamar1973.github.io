<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السوق الخاص - بوت مصطفى</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: white;
            font-size: 2.5rem;
        }
        .header p {
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }
        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .ad-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .ad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .ad-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f2f5;
        }
        .ad-card-video {
            width: 100%;
            max-height: 220px;
        }
        .ad-card-content {
            padding: 18px;
        }
        .ad-card-name {
            font-size: 18px;
            font-weight: bold;
            color: #0f3460;
            margin-bottom: 5px;
        }
        .ad-card-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }
        .ad-card-desc {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .ad-card-contact {
            background: #e8f0fe;
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
        }
        .contact-whatsapp { color: #25D366; font-weight: bold; }
        .contact-messenger { color: #0084ff; font-weight: bold; }
        .contact-phone { color: #34b7f1; font-weight: bold; }
        .contact-link {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 15px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 12px;
        }
        .contact-link.messenger { background: #0084ff; }
        .contact-link.phone { background: #34b7f1; }
        .no-ads {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #666;
            max-width: 500px;
            margin: 50px auto;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 50px;
        }
        @media (max-width: 700px) {
            .marketplace-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div style="max-width: 1400px; margin: 0 auto;">
        <div class="header">
            <a href="index.html" class="back-link">← العودة إلى بوت مصطفى</a>
            <h1>🛒 السوق الخاص - بوت مصطفى</h1>
            <p>أول سوق إعلانات جزائري 100% | جميع الإعلانات المعروضة</p>
        </div>
        
        <div class="marketplace-grid" id="marketplaceGrid">
            <div class="no-ads">📭 جاري تحميل الإعلانات...</div>
        </div>
        
        <div class="footer">
            <p>© 2025 بوت مصطفى - خدمة الإعلانات</p>
        </div>
    </div>

    <script>
        function getContactHtml(method, phone) {
            if (method === 'whatsapp') {
                return `
                    <div class="ad-card-contact">
                        <span class="contact-whatsapp">💚 واتساب: ${phone}</span><br>
                        <a href="https://wa.me/${phone.replace(/^0/, '213')}" target="_blank" class="contact-link">📱 تواصل عبر واتساب</a>
                    </div>
                `;
            } else if (method === 'messenger') {
                return `
                    <div class="ad-card-contact">
                        <span class="contact-messenger">💬 مسنجر: ${phone}</span><br>
                        <span style="font-size:12px;">🔍 ابحث عن هذا الرقم في مسنجر</span>
                    </div>
                `;
            } else {
                return `
                    <div class="ad-card-contact">
                        <span class="contact-phone">📱 هاتف: ${phone}</span><br>
                        <a href="tel:${phone}" class="contact-link phone">📞 اتصل الآن</a>
                    </div>
                `;
            }
        }
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar') + ' ' + date.toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'});
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function renderAds(ads) {
            const grid = document.getElementById('marketplaceGrid');
            if (!ads || ads.length === 0) {
                grid.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات حالياً. كن أول من ينشر إعلاناً! 🚀</div>';
                return;
            }
            
            grid.innerHTML = ads.map(ad => `
                <div class="ad-card">
                    ${ad.image && ad.imageType === 'image' ? 
                        `<img class="ad-card-img" src="${ad.image}" alt="${ad.name}">` : 
                        (ad.image && ad.imageType === 'video' ? 
                            `<video class="ad-card-video" src="${ad.image}" controls></video>` :
                            '<div class="ad-card-img" style="display:flex;align-items:center;justify-content:center;">🖼️ لا توجد صورة</div>')
                    }
                    <div class="ad-card-content">
                        <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                        <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                        <div class="ad-card-desc">${escapeHtml(ad.description)}</div>
                        ${getContactHtml(ad.contactMethod, ad.phone)}
                    </div>
                </div>
            `).join('');
        }
        
        function loadAds() {
            const ads = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
            renderAds(ads);
        }
        
        loadAds();
        
        window.addEventListener('storage', (e) => {
            if (e.key === 'marketplace_ads') {
                loadAds();
            }
        });
    </script>
</body>
</html>
