<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق مصطفى</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e,#16213e);font-family:'Cairo',sans-serif;padding:20px}
        .header{text-align:center;margin-bottom:30px}
        .header h1{color:white}
        .filter-buttons{display:flex;gap:15px;justify-content:center;margin-bottom:25px;flex-wrap:wrap}
        .filter-btn{background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 25px;border-radius:50px;cursor:pointer}
        .filter-btn.active{background:#007bff}
        .marketplace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:25px;max-width:1400px;margin:0 auto}
        .ad-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2);cursor:pointer;position:relative}
        .delete-my-ad{position:absolute;top:10px;right:10px;background:#dc3545;color:white;border:none;border-radius:50%;width:35px;height:35px;cursor:pointer;z-index:10;font-weight:bold}
        .ad-card-img{width:100%;height:220px;object-fit:cover;background:#f0f2f5}
        .ad-card-video{width:100%;height:220px;object-fit:cover}
        .ad-card-content{padding:18px}
        .ad-card-name{font-size:18px;font-weight:bold;color:#0f3460}
        .ad-card-date{font-size:11px;color:#999;margin:5px 0}
        .ad-card-desc{font-size:14px;color:#444;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .ad-card-stats{display:flex;gap:20px;margin-bottom:12px}
        .like-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;color:#666;font-size:14px}
        .like-btn.liked{color:#dc3545}
        .ad-card-contact{background:#e8f0fe;padding:10px;border-radius:12px;text-align:center}
        .contact-link{display:inline-block;margin-top:8px;padding:6px 15px;background:#25D366;color:white;text-decoration:none;border-radius:25px;font-size:12px}
        .no-ads{text-align:center;padding:60px;background:white;border-radius:20px;color:#666}
        .footer{text-align:center;margin-top:40px;color:rgba(255,255,255,0.6)}
        .back-link{display:inline-block;margin-bottom:20px;color:white;background:rgba(0,0,0,0.3);padding:8px 20px;border-radius:50px;text-decoration:none}
        .refresh-btn{background:#28a745;color:white;border:none;border-radius:50px;padding:8px 20px;cursor:pointer;margin-right:10px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10000;direction:rtl;overflow-y:auto}
        .modal-content{max-width:800px;margin:0 auto;background:white}
        .modal-close{position:fixed;top:15px;left:15px;background:#dc3545;color:white;border:none;border-radius:50%;width:45px;height:45px;font-size:28px;cursor:pointer;z-index:10001}
        .main-media,.main-video{width:100%;max-height:400px;object-fit:contain;background:#f0f2f5}
        .modal-content-inner{padding:20px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:30000}
    </style>
</head>
<body>
<div style="max-width:1400px;margin:0 auto">
    <div class="header">
        <a href="index.html" class="back-link">← العودة إلى بوت مصطفى</a>
        <button class="refresh-btn" id="refreshBtn">🔄 تحديث</button>
        <h1>🛒 سوق مصطفى</h1>
    </div>
    <div class="filter-buttons">
        <button id="filterAllBtn" class="filter-btn active">🌍 جميع الإعلانات</button>
        <button id="filterMyBtn" class="filter-btn">📋 إعلاناتي</button>
    </div>
    <div class="marketplace-grid" id="marketplaceGrid">📭 جاري التحميل...</div>
    <div class="footer"><p>© بوت مصطفى | لنشر إعلان: <a href="index.html" style="color:#28a745">اضغط هنا</a></p></div>
</div>
<div id="adModal" class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
<div id="toast" class="toast"></div>

<script>
    // المتغيرات العامة
    let currentUser = null;      // البريد الإلكتروني للمستخدم الحالي
    let allAds = [];            // جميع الإعلانات من localStorage
    let currentFilter = 'all';  // 'all' أو 'my'

    // قراءة المستخدم الحالي من localStorage (نفس نظام index.html)
    function loadCurrentUser() {
        const saved = localStorage.getItem('currentUser');
        if (saved && saved.includes('@')) currentUser = saved;
        else currentUser = null;
    }

    // دالة مساعدة: عرض رسالة مؤقتة
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2500);
    }

    // تحميل الإعلانات من localStorage
    function loadAdsFromStorage() {
        const stored = localStorage.getItem('marketplace_ads');
        if (!stored) return [];
        try {
            const ads = JSON.parse(stored);
            if (Array.isArray(ads)) return ads;
            else return [];
        } catch(e) {
            console.error("خطأ في قراءة الإعلانات", e);
            return [];
        }
    }

    // حفظ الإعلانات (بعد التعديل مثل الحذف أو الإعجاب)
    function saveAdsToStorage(ads) {
        localStorage.setItem('marketplace_ads', JSON.stringify(ads));
    }

    // تنسيق التاريخ من timestamp (مللي ثانية)
    function formatDate(timestamp) {
        if (!timestamp) return 'تاريخ غير معروف';
        let date = new Date(timestamp);
        return date.toLocaleDateString('ar');
    }

    // منع الـ XSS
    function escapeHtml(str) {
        if (!str) return '';
        let div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // حذف إعلان (لصاحبه فقط)
    function deleteAd(adId, event) {
        event.stopPropagation();
        if (!currentUser) {
            showToast('⚠️ سجل دخول أولاً بحسابك لحذف إعلاناتك');
            return;
        }
        const ad = allAds.find(a => a.id == adId);
        if (!ad) return;
        if (ad.userId !== currentUser) {
            showToast('❌ هذا الإعلان ليس لك، لا يمكنك حذفه');
            return;
        }
        if (confirm('هل أنت متأكد من حذف هذا الإعلان نهائياً؟')) {
            const newAds = allAds.filter(a => a.id != adId);
            saveAdsToStorage(newAds);
            loadAds(); // إعادة تحميل العرض
            showToast('✅ تم حذف الإعلان');
        }
    }

    // معالجة الإعجاب (تخزين قائمة المستخدمين المعجبين)
    function handleLike(adId, event) {
        event.stopPropagation();
        if (!currentUser) {
            showToast('⚠️ سجل دخول أولاً للإعجاب');
            return;
        }
        const adIndex = allAds.findIndex(a => a.id == adId);
        if (adIndex === -1) return;
        let likes = allAds[adIndex].likes || [];
        if (likes.includes(currentUser)) {
            // إزالة الإعجاب
            likes = likes.filter(u => u !== currentUser);
            showToast('👍 تم إلغاء الإعجاب');
        } else {
            // إضافة إعجاب
            likes.push(currentUser);
            showToast('❤️ تم الإعجاب');
        }
        allAds[adIndex].likes = likes;
        saveAdsToStorage(allAds);
        // تحديث الواجهة دون إعادة تحميل كامل
        filterAds(currentFilter);
    }

    // فتح نافذة عرض التفاصيل
    function openModal(ad) {
        let mediaHtml = '';
        if (ad.image) {
            if (ad.imageType === 'image') mediaHtml = `<img class="main-media" src="${ad.image}" alt="صورة الإعلان">`;
            else if (ad.imageType === 'video') mediaHtml = `<video class="main-video" src="${ad.image}" controls></video>`;
        } else {
            mediaHtml = '<div style="padding:50px;text-align:center">📷 لا توجد وسائط</div>';
        }

        let contactBtn = '';
        if (ad.contactMethod === 'whatsapp')
            contactBtn = `<a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" class="contact-link" style="background:#25D366;display:inline-block">واتساب</a>`;
        else if (ad.contactMethod === 'messenger')
            contactBtn = `<span style="color:#0084ff">مسنجر: ${ad.phone}</span>`;
        else
            contactBtn = `<a href="tel:${ad.phone}" class="contact-link" style="background:#34b7f1">اتصل</a>`;

        const likesCount = ad.likes ? ad.likes.length : 0;
        document.getElementById('modalContent').innerHTML = `
            <div style="min-height:300px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">${mediaHtml}</div>
            <div class="modal-content-inner">
                <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                <div class="ad-card-desc" style="-webkit-line-clamp:unset">${escapeHtml(ad.description)}</div>
                <div style="display:flex;gap:20px;margin:15px 0"><span>👁️ ${ad.views || 0}</span><span>❤️ ${likesCount}</span></div>
                <div class="ad-card-contact">📞 ${escapeHtml(ad.phone)}<br>${contactBtn}</div>
            </div>
        `;
        document.getElementById('adModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    window.closeModal = function() {
        document.getElementById('adModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        // إيقاف أي فيديو داخل المودال
        const vid = document.querySelector('#modalContent video');
        if (vid) vid.pause();
    };

    // عرض الإعلانات في الشبكة
    function renderAds(ads) {
        const grid = document.getElementById('marketplaceGrid');
        if (!ads.length) {
            grid.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات حالياً\n\nأنشئ إعلانك الآن من البوت الرئيسي</div>';
            return;
        }
        grid.innerHTML = '';
        for (let ad of ads) {
            const isMy = (currentUser && ad.userId === currentUser);
            const isLiked = (currentUser && ad.likes && ad.likes.includes(currentUser));
            let mediaHtml = '';
            if (ad.image) {
                if (ad.imageType === 'image')
                    mediaHtml = `<img class="ad-card-img" src="${ad.image}" alt="صورة الإعلان" loading="lazy">`;
                else if (ad.imageType === 'video')
                    mediaHtml = `<video class="ad-card-video" src="${ad.image}" muted></video>`;
            } else {
                mediaHtml = '<div class="ad-card-img" style="display:flex;align-items:center;justify-content:center;background:#e9ecef">📷</div>';
            }

            let contactHtml = '';
            if (ad.contactMethod === 'whatsapp')
                contactHtml = `<div class="ad-card-contact">💚 ${escapeHtml(ad.phone)}<br><a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" class="contact-link" onclick="event.stopPropagation()">واتساب</a></div>`;
            else if (ad.contactMethod === 'messenger')
                contactHtml = `<div class="ad-card-contact">💬 ${escapeHtml(ad.phone)}<br><span style="font-size:12px">🔍 ابحث في مسنجر</span></div>`;
            else
                contactHtml = `<div class="ad-card-contact">📱 ${escapeHtml(ad.phone)}<br><a href="tel:${ad.phone}" class="contact-link" onclick="event.stopPropagation()">اتصل</a></div>`;

            const likesCount = ad.likes ? ad.likes.length : 0;
            const card = document.createElement('div');
            card.className = 'ad-card';
            card.onclick = () => openModal(ad);
            card.innerHTML = `
                ${isMy ? `<button class="delete-my-ad" onclick="deleteAd(${ad.id}, event)">🗑️</button>` : ''}
                ${mediaHtml}
                <div class="ad-card-content">
                    <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                    <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                    <div class="ad-card-desc">${escapeHtml(ad.description)}</div>
                    <div class="ad-card-stats">
                        <span>👁️ ${ad.views || 0}</span>
                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); handleLike(${ad.id}, event)">❤️ ${likesCount}</button>
                    </div>
                    ${contactHtml}
                </div>
            `;
            grid.appendChild(card);
        }
    }

    // فلترة الإعلانات حسب الاختيار
    function filterAds(filter) {
        currentFilter = filter;
        document.getElementById('filterAllBtn').classList.toggle('active', filter === 'all');
        document.getElementById('filterMyBtn').classList.toggle('active', filter === 'my');
        let filtered = [];
        if (filter === 'my' && currentUser) {
            filtered = allAds.filter(ad => ad.userId === currentUser);
        } else {
            filtered = allAds;
        }
        renderAds(filtered);
    }

    // تحميل البيانات بالكامل وتحديث الواجهة
    function loadAds() {
        loadCurrentUser();
        allAds = loadAdsFromStorage();
        // ترتيب تنازلي حسب التاريخ (الأحدث أولاً)
        allAds.sort((a, b) => (b.date || 0) - (a.date || 0));
        filterAds(currentFilter);
    }

    // تحديث يدوي
    document.getElementById('refreshBtn').onclick = () => loadAds();
    document.getElementById('filterAllBtn').onclick = () => filterAds('all');
    document.getElementById('filterMyBtn').onclick = () => filterAds('my');

    // ربط دوال عامة
    window.deleteAd = deleteAd;
    window.handleLike = handleLike;

    // التحميل الأولي
    loadAds();
</script>
</body>
</html>
