<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>سوق مصطفى - بوت مصطفى</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: white;
            font-size: 2.5rem;
        }
        .header p {
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }
        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .ad-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .ad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .ad-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f2f5;
        }
        .ad-card-video {
            width: 100%;
            max-height: 220px;
            background: #000;
        }
        .ad-card-content {
            padding: 18px;
        }
        .ad-card-name {
            font-size: 18px;
            font-weight: bold;
            color: #0f3460;
            margin-bottom: 5px;
        }
        .ad-card-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }
        .ad-card-desc {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ad-card-contact {
            background: #e8f0fe;
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
        }
        .contact-whatsapp { color: #25D366; font-weight: bold; }
        .contact-messenger { color: #0084ff; font-weight: bold; }
        .contact-phone { color: #34b7f1; font-weight: bold; }
        .contact-link {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 15px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 12px;
        }
        .contact-link.messenger { background: #0084ff; }
        .contact-link.phone { background: #34b7f1; }
        .no-ads {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #666;
            max-width: 500px;
            margin: 50px auto;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 50px;
        }
        .refresh-btn {
            display: inline-block;
            margin-right: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* نافذة ملء الشاشة للفيديو */
        .fullscreen-video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 20000;
            justify-content: center;
            align-items: center;
            direction: ltr;
        }
        .fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .fullscreen-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 28px;
            cursor: pointer;
            z-index: 20001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .fullscreen-close:hover {
            background: #dc3545;
            transform: scale(1.1);
        }
        
        @media (max-width: 700px) {
            .marketplace-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div style="max-width: 1400px; margin: 0 auto;">
        <div class="header">
            <a href="index.html" class="back-link">← العودة إلى بوت مصطفى</a>
            <button class="refresh-btn" onclick="loadAds()">🔄 تحديث الإعلانات</button>
            <h1>🛒 سوق مصطفى</h1>
            <p>أول سوق إعلانات جزائري 100% | اضغط على أي إعلان لمشاهدة التفاصيل</p>
        </div>
        
        <div class="marketplace-grid" id="marketplaceGrid">
            <div class="no-ads">📭 جاري تحميل الإعلانات...</div>
        </div>
        
        <div class="footer">
            <p>© 2025 بوت مصطفى - سوق مصطفى | لنشر إعلانك: <a href="index.html" style="color:#28a745;">اضغط هنا</a></p>
        </div>
    </div>

    <!-- نافذة ملء الشاشة للفيديو -->
    <div id="fullscreenVideoContainer" class="fullscreen-video-container">
        <button class="fullscreen-close" onclick="closeFullscreenVideo()">✕</button>
        <video id="fullscreenVideo" class="fullscreen-video" controls autoplay></video>
    </div>

    <script>
        let currentAds = [];
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar') + ' ' + date.toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'});
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // دالة فتح الفيديو بملء الشاشة
        function openFullscreenVideo(videoUrl) {
            const container = document.getElementById('fullscreenVideoContainer');
            const video = document.getElementById('fullscreenVideo');
            video.src = videoUrl;
            video.play();
            container.style.display = 'flex';
        }
        
        function closeFullscreenVideo() {
            const container = document.getElementById('fullscreenVideoContainer');
            const video = document.getElementById('fullscreenVideo');
            video.pause();
            video.src = '';
            container.style.display = 'none';
        }
        
        // دالة فتح نافذة التفاصيل (للإعلانات التي تحتوي على صور)
        function openModal(ad) {
            // إذا كان الإعلان يحتوي على فيديو، نفتحه في وضع ملء الشاشة مباشرة
            if (ad.image && ad.imageType === 'video') {
                openFullscreenVideo(ad.image);
                return;
            }
            
            // للصور، نعرض نافذة منبثقة عادية
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.background = 'rgba(0,0,0,0.9)';
            modal.style.zIndex = '30000';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            modal.style.direction = 'rtl';
            
            const modalContent = document.createElement('div');
            modalContent.style.background = 'white';
            modalContent.style.borderRadius = '20px';
            modalContent.style.maxWidth = '90%';
            modalContent.style.maxHeight = '90%';
            modalContent.style.overflow = 'auto';
            modalContent.style.position = 'relative';
            
            let contactMethodText = '';
            let contactIcon = '';
            let contactButtons = '';
            
            if (ad.contactMethod === 'whatsapp') {
                contactMethodText = `واتساب: ${ad.phone}`;
                contactIcon = '💚';
                contactButtons = `<a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" style="background:#25D366; color:white; padding:12px 25px; border-radius:50px; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:8px;">💚 تواصل عبر واتساب</a>`;
            } else if (ad.contactMethod === 'messenger') {
                contactMethodText = `مسنجر: ${ad.phone}`;
                contactIcon = '💬';
                contactButtons = `<span style="font-size:14px; color:#0084ff;">🔍 ابحث عن هذا الرقم في مسنجر: ${ad.phone}</span>`;
            } else {
                contactMethodText = `هاتف: ${ad.phone}`;
                contactIcon = '📱';
                contactButtons = `<a href="tel:${ad.phone}" style="background:#34b7f1; color:white; padding:12px 25px; border-radius:50px; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:8px;">📞 اتصل الآن</a>`;
            }
            
            modalContent.innerHTML = `
                <button onclick="this.closest('div').remove()" style="position:absolute; top:15px; left:15px; background:#dc3545; color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:24px; cursor:pointer; z-index:10;">✕</button>
                <img class="modal-img" src="${ad.image}" alt="${ad.name}" style="width:100%; max-height:400px; object-fit:contain; background:#0f3460;">
                <div style="padding:20px;">
                    <div style="font-size:24px; font-weight:bold; color:#0f3460; margin-bottom:5px;">${escapeHtml(ad.name)}</div>
                    <div style="font-size:12px; color:#999; margin-bottom:15px;">📅 ${formatDate(ad.date)}</div>
                    <div style="font-size:16px; color:#333; line-height:1.6; margin-bottom:20px;">${escapeHtml(ad.description)}</div>
                    <div style="background:#e8f0fe; padding:15px; border-radius:15px; text-align:center;">
                        <div style="font-size:16px; margin-bottom:10px;">${contactIcon} ${contactMethodText}</div>
                        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px; flex-wrap:wrap;">
                            ${contactButtons}
                        </div>
                    </div>
                </div>
            `;
            
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.remove();
                }
            };
        }
        
        function renderAds(ads) {
            const grid = document.getElementById('marketplaceGrid');
            currentAds = ads;
            
            if (!ads || ads.length === 0) {
                grid.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات حالياً. كن أول من ينشر إعلاناً! 🚀</div>';
                return;
            }
            
            grid.innerHTML = '';
            for (let i = 0; i < ads.length; i++) {
                const ad = ads[i];
                const adCard = document.createElement('div');
                adCard.className = 'ad-card';
                adCard.onclick = (function(index) {
                    return function() { 
                        const currentAd = currentAds[index];
                        if (currentAd.image && currentAd.imageType === 'video') {
                            openFullscreenVideo(currentAd.image);
                        } else {
                            openModal(currentAd);
                        }
                    };
                })(i);
                
                let mediaHtml = '';
                if (ad.image && ad.imageType === 'image') {
                    mediaHtml = `<img class="ad-card-img" src="${ad.image}" alt="${ad.name}">`;
                } else if (ad.image && ad.imageType === 'video') {
                    mediaHtml = `<video class="ad-card-video" src="${ad.image}" muted onclick="event.stopPropagation(); openFullscreenVideo('${ad.image}')"></video>`;
                } else {
                    mediaHtml = '<div class="ad-card-img" style="display:flex;align-items:center;justify-content:center;">🖼️ لا توجد صورة</div>';
                }
                
                let contactHtml = '';
                if (ad.contactMethod === 'whatsapp') {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-whatsapp">💚 واتساب: ${escapeHtml(ad.phone)}</span><br>
                            <a href="https://wa.me/${ad.phone.replace(/^0/, '213')}" target="_blank" class="contact-link" onclick="event.stopPropagation()">📱 تواصل عبر واتساب</a>
                        </div>
                    `;
                } else if (ad.contactMethod === 'messenger') {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-messenger">💬 مسنجر: ${escapeHtml(ad.phone)}</span><br>
                            <span style="font-size:12px;" onclick="event.stopPropagation()">🔍 ابحث عن هذا الرقم في مسنجر</span>
                        </div>
                    `;
                } else {
                    contactHtml = `
                        <div class="ad-card-contact">
                            <span class="contact-phone">📱 هاتف: ${escapeHtml(ad.phone)}</span><br>
                            <a href="tel:${ad.phone}" class="contact-link phone" onclick="event.stopPropagation()">📞 اتصل الآن</a>
                        </div>
                    `;
                }
                
                adCard.innerHTML = `
                    ${mediaHtml}
                    <div class="ad-card-content">
                        <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                        <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                        <div class="ad-card-desc">${escapeHtml(ad.description)}</div>
                        ${contactHtml}
                    </div>
                `;
                
                grid.appendChild(adCard);
            }
        }
        
        async function loadAds() {
            const grid = document.getElementById('marketplaceGrid');
            grid.innerHTML = '<div class="no-ads">📭 جاري تحميل الإعلانات...</div>';
            
            const ads = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
            renderAds(ads);
        }
        
        loadAds();
        
        window.addEventListener('storage', (e) => {
            if (e.key === 'marketplace_ads') {
                loadAds();
            }
        });
    </script>
</body>
</html>
