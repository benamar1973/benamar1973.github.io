<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق مصطفى - الإعلانات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            padding: 20px;
            direction: rtl;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        .user-info {
            background: rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 10px 15px;
            display: inline-block;
            margin-top: 10px;
        }
        .ad-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .ad-header {
            padding: 12px 16px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
        }
        .ad-name { font-weight: bold; font-size: 1.2rem; color: #0f3460; }
        .ad-date { font-size: 0.8rem; color: #6c757d; }
        .main-media {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .main-video {
            width: 100%;
            max-height: 400px;
            background: #000;
        }
        .thumbnails {
            display: flex;
            gap: 8px;
            padding: 12px;
            overflow-x: auto;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        .thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .thumbnail.active {
            border-color: #007bff;
        }
        .thumbnail-video {
            width: 70px;
            height: 70px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }
        .thumbnail-video.active {
            border-color: #007bff;
        }
        .ad-description {
            padding: 16px;
            font-size: 1rem;
            line-height: 1.5;
            color: #212529;
        }
        .ad-contact {
            padding: 10px 16px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .ad-stats {
            padding: 8px 16px;
            color: #6c757d;
            font-size: 0.8rem;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 20px;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 6px 15px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-btn:hover { background: #c82333; }
        .section-title {
            color: white;
            margin: 20px 0 10px 0;
            font-size: 1.5rem;
            border-right: 5px solid #ffc107;
            padding-right: 15px;
        }
        .no-ads {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: white;
            margin: 15px 0;
        }
        .back-link {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }
        .back-link:hover { background: #218838; }
        footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.6);
        }
        @media (max-width: 600px) {
            .ad-name { font-size: 1rem; }
            .ad-description { font-size: 0.9rem; }
            .thumbnail, .thumbnail-video { width: 55px; height: 55px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛒 سوق مصطفى</h1>
        <p>منصة الإعلانات المبوبة</p>
        <div class="user-info" id="userInfo"></div>
    </div>

    <div id="myAdsSection" style="display: none;">
        <div class="section-title">📌 إعلاناتي</div>
        <div id="myAdsList"></div>
    </div>

    <div class="section-title">🌍 جميع الإعلانات</div>
    <div id="allAdsList"></div>

    <div style="text-align: center;">
        <a href="index.html" class="back-link" onclick="window.location.href='index.html'; return false;">← العودة إلى بوت مصطفى</a>
    </div>
    <footer>بوت مصطفى - خدمة الإعلانات | تواصل عبر واتساب: 0556765445</footer>
</div>

<script>
    let currentUser = localStorage.getItem('currentUser');
    const userInfoDiv = document.getElementById('userInfo');
    const myAdsSection = document.getElementById('myAdsSection');
    const myAdsList = document.getElementById('myAdsList');
    const allAdsList = document.getElementById('allAdsList');

    if (currentUser) {
        userInfoDiv.innerHTML = `👋 مرحباً ${currentUser.split('@')[0]} | يمكنك حذف إعلاناتك فقط`;
        myAdsSection.style.display = 'block';
    } else {
        userInfoDiv.innerHTML = `👤 زائر | <a href="index.html" style="color:#ffc107;">تسجيل الدخول</a> لحذف إعلاناتك`;
    }

    function loadAds() {
        let allAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
        allAds.sort((a,b) => b.date - a.date);
        displayAds(allAds, allAdsList, false);
        if (currentUser) {
            let myAds = allAds.filter(ad => ad.userId === currentUser);
            displayAds(myAds, myAdsList, true);
            if (myAds.length === 0) myAdsList.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات لك حتى الآن. انشر إعلانك من بوت مصطفى.</div>';
        } else {
            myAdsList.innerHTML = '<div class="no-ads">🔐 سجل الدخول لترى إعلاناتك وتحذفها.</div>';
        }
        if (allAds.length === 0) allAdsList.innerHTML = '<div class="no-ads">✨ لا توجد إعلانات حالياً. كن أول من ينشر إعلاناً!</div>';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // دالة عرض الإعلان مع معرض صور متحرك
    function displayAds(ads, container, showDelete) {
        if (!ads.length) return;
        let html = '';
        for (let ad of ads) {
            // التأكد من وجود mediaList و mainMediaIndex
            let mediaList = ad.mediaList || [];
            let mainIndex = (ad.mainMediaIndex !== undefined && ad.mainMediaIndex < mediaList.length) ? ad.mainMediaIndex : 0;
            let mainMedia = mediaList.length > 0 ? mediaList[mainIndex] : null;

            // بناء HTML للوسائط الرئيسية
            let mainHtml = '';
            if (mainMedia) {
                if (mainMedia.type === 'image') {
                    mainHtml = `<img class="main-media" src="${mainMedia.url}" alt="الصورة الرئيسية" id="main-${ad.id}">`;
                } else {
                    mainHtml = `<video class="main-video" src="${mainMedia.url}" controls id="main-${ad.id}"></video>`;
                }
            } else {
                mainHtml = `<div style="background:#dee2e6; padding:30px; text-align:center; color:#6c757d;">📷 لا توجد وسائط</div>`;
            }

            // بناء المصغرات لكل الوسائط
            let thumbnailsHtml = '';
            if (mediaList.length > 1) {
                thumbnailsHtml = '<div class="thumbnails">';
                for (let i = 0; i < mediaList.length; i++) {
                    let media = mediaList[i];
                    let isActive = (i === mainIndex) ? 'active' : '';
                    if (media.type === 'image') {
                        thumbnailsHtml += `<img src="${media.url}" class="thumbnail ${isActive}" onclick="changeMainMedia(${ad.id}, ${i})" data-index="${i}">`;
                    } else {
                        thumbnailsHtml += `<div class="thumbnail-video ${isActive}" onclick="changeMainMedia(${ad.id}, ${i})" data-index="${i}">🎬</div>`;
                    }
                }
                thumbnailsHtml += '</div>';
            }

            let contactIcon = '';
            if (ad.contactMethod === 'whatsapp') contactIcon = '💚 واتساب';
            else if (ad.contactMethod === 'messenger') contactIcon = '💬 مسنجر';
            else if (ad.contactMethod === 'phone') contactIcon = '📱 هاتف';
            else contactIcon = '📞';

            let deleteBtn = '';
            if (showDelete && currentUser && ad.userId === currentUser) {
                deleteBtn = `<button class="delete-btn" onclick="deleteAd(${ad.id})">🗑️ حذف الإعلان</button>`;
            }

            let dateStr = new Date(ad.date).toLocaleString('ar-EG');

            html += `
                <div class="ad-card" id="ad-${ad.id}" data-media-list='${JSON.stringify(mediaList)}'>
                    <div class="ad-header">
                        <div class="ad-name">${escapeHtml(ad.name)}</div>
                        <div class="ad-date">${dateStr}</div>
                    </div>
                    <div id="media-container-${ad.id}">
                        ${mainHtml}
                    </div>
                    ${thumbnailsHtml}
                    <div class="ad-description">${escapeHtml(ad.description)}</div>
                    <div class="ad-contact">
                        <span>${contactIcon} ${escapeHtml(ad.phone)}</span>
                        ${deleteBtn}
                    </div>
                    <div class="ad-stats">
                        <span>👁️ ${ad.views || 0} مشاهدة</span>
                        <span>❤️ ${ad.likes || 0} إعجاب</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // دالة تغيير الوسائط الرئيسية عند النقر على مصغرة
    window.changeMainMedia = function(adId, newIndex) {
        let adCard = document.getElementById(`ad-${adId}`);
        if (!adCard) return;
        let mediaListRaw = adCard.getAttribute('data-media-list');
        if (!mediaListRaw) return;
        let mediaList = JSON.parse(mediaListRaw);
        if (newIndex >= mediaList.length) return;
        let media = mediaList[newIndex];
        let container = document.getElementById(`media-container-${adId}`);
        if (!container) return;
        let mainHtml = '';
        if (media.type === 'image') {
            mainHtml = `<img class="main-media" src="${media.url}" alt="الصورة الرئيسية" id="main-${adId}">`;
        } else {
            mainHtml = `<video class="main-video" src="${media.url}" controls id="main-${adId}"></video>`;
        }
        container.innerHTML = mainHtml;

        // تحديث الصنف active في المصغرات
        let thumbnails = adCard.querySelectorAll('.thumbnail, .thumbnail-video');
        thumbnails.forEach((thumb, idx) => {
            if (idx === newIndex) thumb.classList.add('active');
            else thumb.classList.remove('active');
        });

        // تحديث mainMediaIndex في كائن الإعلان المخزن (اختياري للاستمرارية)
        let allAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
        let adIndex = allAds.findIndex(ad => ad.id === adId);
        if (adIndex !== -1) {
            allAds[adIndex].mainMediaIndex = newIndex;
            localStorage.setItem('marketplace_ads', JSON.stringify(allAds));
        }
    };

    window.deleteAd = function(adId) {
        if (!currentUser) {
            alert("يجب تسجيل الدخول أولاً لحذف الإعلان.");
            return;
        }
        let allAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
        let adIndex = allAds.findIndex(ad => ad.id === adId);
        if (adIndex === -1) { alert("الإعلان غير موجود."); return; }
        if (allAds[adIndex].userId !== currentUser) { alert("لا يمكنك حذف إعلان ليس لك."); return; }
        if (confirm("هل أنت متأكد من حذف هذا الإعلان نهائياً؟")) {
            allAds.splice(adIndex, 1);
            localStorage.setItem('marketplace_ads', JSON.stringify(allAds));
            loadAds();
            alert("✅ تم حذف الإعلان بنجاح.");
        }
    };

    loadAds();
    window.addEventListener('storage', function(e) { if (e.key === 'marketplace_ads') loadAds(); });
</script>
</body>
</html>
