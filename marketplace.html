<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق مصطفى</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#1a1a2e,#16213e);font-family:'Cairo',sans-serif;padding:20px}
        .header{text-align:center;margin-bottom:30px}
        .header h1{color:white}
        .filter-buttons{display:flex;gap:15px;justify-content:center;margin-bottom:25px}
        .filter-btn{background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 25px;border-radius:50px;cursor:pointer}
        .filter-btn.active{background:#007bff}
        .marketplace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:25px;max-width:1400px;margin:0 auto}
        .ad-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2);cursor:pointer;position:relative}
        .delete-my-ad{position:absolute;top:10px;right:10px;background:#dc3545;color:white;border:none;border-radius:50%;width:35px;height:35px;cursor:pointer;z-index:10}
        .ad-card-img{width:100%;height:220px;object-fit:cover}
        .ad-card-video{width:100%;height:220px;object-fit:cover}
        .ad-card-content{padding:18px}
        .ad-card-name{font-size:18px;font-weight:bold;color:#0f3460}
        .ad-card-date{font-size:11px;color:#999;margin:5px 0}
        .ad-card-desc{font-size:14px;color:#444;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .ad-card-stats{display:flex;gap:20px;margin-bottom:12px}
        .like-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;color:#666}
        .like-btn.liked{color:#dc3545}
        .ad-card-contact{background:#e8f0fe;padding:10px;border-radius:12px;text-align:center}
        .contact-link{display:inline-block;margin-top:8px;padding:6px 15px;background:#25D366;color:white;text-decoration:none;border-radius:25px;font-size:12px}
        .no-ads{text-align:center;padding:60px;background:white;border-radius:20px;color:#666}
        .footer{text-align:center;margin-top:40px;color:rgba(255,255,255,0.6)}
        .back-link{display:inline-block;margin-bottom:20px;color:white;background:rgba(0,0,0,0.3);padding:8px 20px;border-radius:50px;text-decoration:none}
        .refresh-btn{background:#28a745;color:white;border:none;border-radius:50px;padding:8px 20px;cursor:pointer;margin-right:10px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10000;direction:rtl;overflow-y:auto}
        .modal-content{max-width:800px;margin:0 auto;background:white}
        .modal-close{position:fixed;top:15px;left:15px;background:#dc3545;color:white;border:none;border-radius:50%;width:45px;height:45px;font-size:28px;cursor:pointer;z-index:10001}
        .main-media,.main-video{width:100%;max-height:400px;object-fit:contain;background:#f0f2f5}
        .thumbnail-gallery{display:flex;gap:10px;padding:15px;overflow-x:auto}
        .thumbnail{width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
        .thumbnail.active,.thumbnail-video.active{border-color:#007bff}
        .thumbnail-video{width:80px;height:80px;background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:30px;cursor:pointer}
        .modal-content-inner{padding:20px}
        .modal-name{font-size:24px;font-weight:bold;color:#0f3460}
        .modal-date{font-size:12px;color:#999;margin:10px 0}
        .modal-contact{background:#e8f0fe;padding:15px;border-radius:15px;text-align:center}
        .modal-whatsapp,.modal-phone{background:#25D366;color:white;padding:12px 25px;border-radius:50px;text-decoration:none;display:inline-block;margin:5px}
        .modal-phone{background:#34b7f1}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28a745;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:0.3s;z-index:30000}
    </style>
</head>
<body>
    <div style="max-width:1400px;margin:0 auto">
        <div class="header">
            <a href="index.html" class="back-link">← العودة</a>
            <button class="refresh-btn" id="refreshBtn">🔄 تحديث</button>
            <h1>🛒 سوق مصطفى</h1>
        </div>
        <div class="filter-buttons">
            <button id="filterAllBtn" class="filter-btn active">🌍 جميع الإعلانات</button>
            <button id="filterMyBtn" class="filter-btn">📋 إعلاناتي</button>
        </div>
        <div class="marketplace-grid" id="marketplaceGrid"><div class="no-ads">📭 جاري التحميل...</div></div>
        <div class="footer"><p>© بوت مصطفى | لنشر إعلان: <a href="index.html" style="color:#28a745">اضغط هنا</a></p></div>
    </div>
    <div id="adModal" class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
    <div id="toast" class="toast"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBiE4Rtmo_d5fVhkDU30XZ_-BQnMtqCGDw",
            authDomain: "khadamati-dz-28051.firebaseapp.com",
            projectId: "khadamati-dz-28051",
            storageBucket: "khadamati-dz-28051.firebasestorage.app",
            messagingSenderId: "689071750342",
            appId: "1:689071750342:web:7eafee1d6e372e285dabc7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null, allAds = [], currentFilter = 'all';
        
        onAuthStateChanged(auth, (user) => { currentUser = user; loadAds(); });
        
        async function loadAds() {
            document.getElementById('marketplaceGrid').innerHTML = '<div class="no-ads">📭 جاري التحميل...</div>';
            let q = query(collection(db, 'ads'), orderBy('date', 'desc'));
            let snap = await getDocs(q);
            allAds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            filterAds(currentFilter);
        }
        
        function formatDate(ts) { return new Date(ts).toLocaleDateString('ar'); }
        function escapeHtml(t) { if(!t) return ''; let d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        function showToast(msg) { let t=document.getElementById('toast'); t.innerText=msg; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2000); }
        
        async function deleteAd(id, e) {
            e.stopPropagation();
            if(confirm('حذف الإعلان؟')) { await deleteDoc(doc(db,'ads',id)); showToast('تم الحذف'); loadAds(); }
        }
        
        async function handleLike(id, likesArr, e) {
            e.stopPropagation();
            if(!currentUser) { showToast('سجل دخول أولاً'); return; }
            let ref = doc(db,'ads',id);
            if(likesArr && likesArr.includes(currentUser.uid)) {
                await updateDoc(ref, { likes: arrayRemove(currentUser.uid) });
                showToast('👍 تم إلغاء الإعجاب');
            } else {
                await updateDoc(ref, { likes: arrayUnion(currentUser.uid) });
                showToast('❤️ تم الإعجاب');
            }
            loadAds();
        }
        
        function openModal(ad) {
            let modal = document.getElementById('adModal');
            let content = document.getElementById('modalContent');
            let media = ad.mediaItems || [];
            let idx = 0, currVideo = null;
            function renderMain(i) {
                let m = media[i];
                let area = document.getElementById('modalMediaArea');
                if(!area) return;
                area.innerHTML = '';
                if(m.type === 'image') {
                    let img = document.createElement('img'); img.src = m.data; img.className = 'main-media';
                    area.appendChild(img);
                    if(currVideo) { currVideo.pause(); currVideo=null; }
                } else {
                    let vid = document.createElement('video'); vid.src = m.data; vid.controls = true; vid.className = 'main-video';
                    area.appendChild(vid); currVideo = vid;
                }
            }
            function renderThumbs() {
                let area = document.getElementById('modalThumbnails');
                if(!area) return;
                let html = '<div class="thumbnail-gallery">';
                media.forEach((m,i) => {
                    if(m.type==='image') html += `<img class="thumbnail ${i===idx?'active':''}" src="${m.data}" onclick="window.switchMedia(${i})">`;
                    else html += `<div class="thumbnail-video ${i===idx?'active':''}" onclick="window.switchMedia(${i})">▶️</div>`;
                });
                html += '</div>';
                area.innerHTML = html;
            }
            window.switchMedia = (i) => { idx=i; renderMain(idx); renderThumbs(); };
            let contactBtn = '';
            if(ad.contactMethod === 'whatsapp') contactBtn = `<a href="https://wa.me/${ad.phone.replace(/^0/,'213')}" target="_blank" class="modal-whatsapp">💚 واتساب</a>`;
            else if(ad.contactMethod === 'messenger') contactBtn = `<span style="color:#0084ff">🔍 مسنجر: ${ad.phone}</span>`;
            else contactBtn = `<a href="tel:${ad.phone}" class="modal-phone">📞 اتصل</a>`;
            content.innerHTML = `<div id="modalMediaArea" style="min-height:300px;background:#f5f5f5;display:flex;align-items:center;justify-content:center"></div><div id="modalThumbnails"></div><div class="modal-content-inner"><div class="modal-name">${escapeHtml(ad.name)}</div><div class="modal-date">📅 ${formatDate(ad.date)}</div><div class="modal-desc">${escapeHtml(ad.description)}</div><div style="display:flex;gap:20px;margin:15px 0"><div>👁️ ${ad.views||0}</div><div>❤️ ${ad.likes?ad.likes.length:0}</div></div><div class="modal-contact"><div>${ad.contactMethod==='whatsapp'?'💚':(ad.contactMethod==='messenger'?'💬':'📱')} ${ad.contactMethod==='whatsapp'?'واتساب':(ad.contactMethod==='messenger'?'مسنجر':'هاتف')}: ${ad.phone}</div><div class="modal-contact-buttons">${contactBtn}</div></div></div>`;
            renderMain(0); renderThumbs();
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        window.closeModal = () => {
            let modal = document.getElementById('adModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            let vid = document.getElementById('modalVideo');
            if(vid) vid.pause();
        };
        
        function renderAds(ads) {
            let grid = document.getElementById('marketplaceGrid');
            if(!ads.length) { grid.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات</div>'; return; }
            grid.innerHTML = '';
            for(let ad of ads) {
                let isMy = currentUser && ad.userId === currentUser.uid;
                let isLiked = currentUser && ad.likes && ad.likes.includes(currentUser.uid);
                let main = ad.mediaItems?.[0] || null;
                let mediaHtml = main ? (main.type==='image' ? `<img class="ad-card-img" src="${main.data}">` : `<video class="ad-card-video" src="${main.data}" muted></video>`) : '<div class="ad-card-img">📷</div>';
                let contactHtml = '';
                if(ad.contactMethod==='whatsapp') contactHtml = `<div class="ad-card-contact">💚 ${ad.phone}<br><a href="https://wa.me/${ad.phone.replace(/^0/,'213')}" target="_blank" class="contact-link" onclick="event.stopPropagation()">واتساب</a></div>`;
                else if(ad.contactMethod==='messenger') contactHtml = `<div class="ad-card-contact">💬 ${ad.phone}<br><span style="font-size:12px">🔍 ابحث في مسنجر</span></div>`;
                else contactHtml = `<div class="ad-card-contact">📱 ${ad.phone}<br><a href="tel:${ad.phone}" class="contact-link" onclick="event.stopPropagation()">اتصل</a></div>`;
                let card = document.createElement('div'); card.className = 'ad-card';
                card.onclick = () => openModal(ad);
                card.innerHTML = `${isMy ? `<button class="delete-my-ad" onclick="deleteAd('${ad.id}', event)">🗑️</button>` : ''}
                    ${mediaHtml}
                    <div class="ad-card-content">
                        <div class="ad-card-name">${escapeHtml(ad.name)}</div>
                        <div class="ad-card-date">📅 ${formatDate(ad.date)}</div>
                        <div class="ad-card-desc">${escapeHtml(ad.description)}</div>
                        <div class="ad-card-stats">
                            <span>👁️ ${ad.views||0}</span>
                            <button id="like_${ad.id}" class="like-btn ${isLiked?'liked':''}" onclick="event.stopPropagation(); handleLike('${ad.id}', ${JSON.stringify(ad.likes||[])}, event)">❤️ ${ad.likes?ad.likes.length:0}</button>
                        </div>
                        ${contactHtml}
                    </div>`;
                grid.appendChild(card);
            }
        }
        
        function filterAds(filter) {
            currentFilter = filter;
            document.getElementById('filterAllBtn').classList.toggle('active', filter==='all');
            document.getElementById('filterMyBtn').classList.toggle('active', filter==='my');
            let filtered = filter==='my' && currentUser ? allAds.filter(a=>a.userId===currentUser.uid) : allAds;
            renderAds(filtered);
        }
        
        document.getElementById('filterAllBtn').onclick = () => filterAds('all');
        document.getElementById('filterMyBtn').onclick = () => filterAds('my');
        document.getElementById('refreshBtn').onclick = () => loadAds();
        
        window.deleteAd = deleteAd;
        window.handleLike = handleLike;
        loadAds();
    </script>
</body>
</html>
