<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سوق مصطفى - إعلانات مبوبة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #0b2b40, #1a4a5f); font-family: 'Cairo', sans-serif; padding: 20px; direction: rtl; }
        .container { max-width: 950px; margin: 0 auto; }
        .header { background: linear-gradient(115deg, #1e5f7a, #2c3e66); border-radius: 40px; padding: 25px 20px; text-align: center; color: white; margin-bottom: 25px; }
        .header h1 { font-size: 2rem; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.15); border-radius: 50px; padding: 8px 20px; margin-top: 15px; flex-wrap: wrap; }
        .logout-btn { background: #dc3545; border: none; border-radius: 30px; padding: 6px 18px; color: white; cursor: pointer; }
        .toggle-btn { background: #ffc107; border: none; border-radius: 50px; padding: 10px; width: 100%; margin: 15px 0 5px; font-weight: bold; cursor: pointer; }
        .section-title { font-size: 1.7rem; font-weight: bold; color: white; border-right: 5px solid #ffc107; padding-right: 15px; margin: 30px 0 15px 0; }
        .ad-card { background: white; border-radius: 28px; margin-bottom: 28px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .ad-header { background: #fef7e0; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        .ad-name { font-size: 1.3rem; font-weight: bold; color: #1d4e6e; }
        .ad-date { font-size: 0.7rem; background: #e9ecef; padding: 4px 12px; border-radius: 30px; }
        .media-container { background: #111; text-align: center; min-height: 200px; }
        .main-img, .main-video { width: 100%; max-height: 400px; object-fit: contain; cursor: pointer; }
        .thumbnails { display: flex; gap: 8px; padding: 12px; overflow-x: auto; background: #f2f4f8; border-top: 1px solid #ddd; }
        .thumb-img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
        .thumb-video { width: 70px; height: 70px; background: #2c3e50; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; cursor: pointer; border: 2px solid transparent; }
        .thumb-img.active, .thumb-video.active { border-color: #007bff; transform: scale(0.98); }
        .ad-description { padding: 16px 20px; font-size: 0.95rem; color: #2d3e50; line-height: 1.5; }
        .ad-contact { padding: 10px 20px; background: #eef2f5; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .delete-btn { background: #dc3545; border: none; border-radius: 30px; padding: 5px 15px; color: white; cursor: pointer; }
        .ad-stats { padding: 8px 20px; font-size: 0.7rem; color: #6c757d; display: flex; gap: 20px; border-top: 1px solid #e9ecef; }
        .no-ads { background: rgba(255,255,255,0.1); border-radius: 25px; padding: 40px; text-align: center; color: white; }
        .back-link { display: inline-block; background: #28a745; color: white; text-decoration: none; padding: 10px 25px; border-radius: 50px; margin: 20px 0; font-weight: bold; }
        footer { text-align: center; color: rgba(255,255,255,0.6); margin-top: 20px; }
        /* مودال العرض */
        .media-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .media-modal .close { position: absolute; top: 20px; left: 20px; color: white; font-size: 40px; cursor: pointer; background: none; border: none; font-weight: bold; z-index: 20001; }
        .media-modal .content { max-width: 95%; max-height: 90%; }
        .media-modal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
        .media-modal video { max-width: 100%; max-height: 90vh; }
        @media (max-width: 600px) { .ad-name { font-size: 1.1rem; } .thumb-img, .thumb-video { width: 55px; height: 55px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛒 سوق مصطفى</h1>
        <p>إعلانات مبوبة – تواصل مباشر</p>
        <div class="user-bar" id="userBar"></div>
        <button id="toggleMyAdsBtn" class="toggle-btn" style="display: none;">📌 عرض إعلاناتي</button>
    </div>
    <div id="myAdsSection" style="display: none;"><div class="section-title">⭐ إعلاناتي</div><div id="myAdsList"></div></div>
    <div class="section-title">🌍 جميع الإعلانات</div>
    <div id="allAdsList"></div>
    <div style="text-align: center;"><a href="index.html" class="back-link" onclick="window.location.href='index.html'; return false;">← العودة إلى بوت مصطفى</a></div>
    <footer>بوت مصطفى – خدمة الإعلانات | تواصل: 0556765445</footer>
</div>

<script>
    let currentUser = localStorage.getItem('currentUser');
    const userBar = document.getElementById('userBar');
    const toggleBtn = document.getElementById('toggleMyAdsBtn');
    const myAdsSection = document.getElementById('myAdsSection');
    const myAdsList = document.getElementById('myAdsList');
    const allAdsList = document.getElementById('allAdsList');
    let showMyAds = false;

    function renderUserBar() {
        if (currentUser) {
            userBar.innerHTML = `<span>👋 أهلاً ${escapeHtml(currentUser.split('@')[0])}</span><button class="logout-btn" onclick="logout()">🚪 خروج</button>`;
            toggleBtn.style.display = 'block';
        } else {
            userBar.innerHTML = `<span>👤 زائر | <a href="index.html" style="color:#ffc107;">تسجيل الدخول</a></span>`;
            toggleBtn.style.display = 'none';
            myAdsSection.style.display = 'none';
            showMyAds = false;
        }
    }
    function logout() { localStorage.removeItem('currentUser'); currentUser = null; renderUserBar(); loadAds(); toggleBtn.innerText = '📌 عرض إعلاناتي'; showMyAds = false; myAdsSection.style.display = 'none'; }
    function toggleMyAds() { if (!currentUser) return; showMyAds = !showMyAds; myAdsSection.style.display = showMyAds ? 'block' : 'none'; toggleBtn.innerText = showMyAds ? '🙈 إخفاء إعلاناتي' : '📌 عرض إعلاناتي'; if (showMyAds) loadAds(); }
    function migrateAd(ad) { if (!ad.mediaList) ad.mediaList = []; ad.mediaList = ad.mediaList.map(item => { if (item.data && !item.url) return { url: item.data, type: item.type || 'image' }; return item; }); if (ad.mainMediaIndex === undefined) ad.mainMediaIndex = 0; return ad; }
    function loadAds() {
        let allAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
        allAds = allAds.map(migrateAd);
        allAds.sort((a,b) => b.date - a.date);
        displayAds(allAds, allAdsList, false);
        if (currentUser) { let myAds = allAds.filter(ad => ad.userId === currentUser); displayAds(myAds, myAdsList, true); if (myAds.length === 0 && showMyAds) myAdsList.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات لك.</div>'; }
        else if (showMyAds) myAdsList.innerHTML = '<div class="no-ads">🔐 سجل دخولك لرؤية إعلاناتك.</div>';
        if (allAds.length === 0) allAdsList.innerHTML = '<div class="no-ads">✨ لا توجد إعلانات حالياً.</div>';
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

    // فتح المودال مع إغلاق من أول ضغطة
    function openMediaModal(url, type) {
        let modal = document.createElement('div');
        modal.className = 'media-modal';
        let closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.className = 'close';
        // إغلاق فوري عند الضغط على X
        closeBtn.onclick = (e) => {
            e.stopPropagation();
            modal.remove();
        };
        let content = document.createElement('div');
        content.className = 'content';
        if (type === 'image') {
            let img = document.createElement('img');
            img.src = url;
            content.appendChild(img);
        } else {
            let video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = false;
            content.appendChild(video);
        }
        modal.appendChild(closeBtn);
        modal.appendChild(content);
        document.body.appendChild(modal);
        // إغلاق عند النقر على الخلفية
        modal.onclick = (e) => {
            if (e.target === modal) modal.remove();
        };
    }

    function displayAds(ads, container, showDelete) {
        if (!ads.length) { if (container === myAdsList && showMyAds) container.innerHTML = '<div class="no-ads">📭 لا توجد إعلانات</div>'; return; }
        let html = '';
        for (let ad of ads) {
            let mediaList = ad.mediaList || [];
            let mainIdx = (ad.mainMediaIndex !== undefined && ad.mainMediaIndex < mediaList.length) ? ad.mainMediaIndex : 0;
            let mainMedia = mediaList.length ? mediaList[mainIdx] : null;
            let mainHtml = '';
            if (mainMedia && mainMedia.url) {
                if (mainMedia.type === 'image') {
                    mainHtml = `<img class="main-img" src="${mainMedia.url}" onclick="openMediaModal('${mainMedia.url.replace(/'/g, "\\'")}', 'image')">`;
                } else {
                    mainHtml = `<video class="main-video" src="${mainMedia.url}" controls onclick="openMediaModal('${mainMedia.url.replace(/'/g, "\\'")}', 'video')"></video>`;
                }
            } else mainHtml = `<div style="background:#2c3e50; padding:40px; text-align:center; color:white;">📷 لا توجد وسائط</div>`;
            
            let thumbs = '';
            if (mediaList.length > 1) {
                thumbs = '<div class="thumbnails">';
                for (let i = 0; i < mediaList.length; i++) {
                    let m = mediaList[i];
                    if (!m.url) continue;
                    let activeClass = (i === mainIdx) ? 'active' : '';
                    if (m.type === 'image') {
                        thumbs += `<img src="${m.url}" class="thumb-img ${activeClass}" data-url="${m.url.replace(/'/g, "\\'")}" data-type="image">`;
                    } else {
                        thumbs += `<div class="thumb-video ${activeClass}" data-url="${m.url.replace(/'/g, "\\'")}" data-type="video">🎬</div>`;
                    }
                }
                thumbs += '</div>';
            }
            let contactIcon = '';
            if (ad.contactMethod === 'whatsapp') contactIcon = '💚 واتساب';
            else if (ad.contactMethod === 'messenger') contactIcon = '💬 مسنجر';
            else if (ad.contactMethod === 'phone') contactIcon = '📱 هاتف';
            else contactIcon = '📞';
            let deleteBtn = '';
            if (showDelete && currentUser && ad.userId === currentUser) deleteBtn = `<button class="delete-btn" onclick="deleteAd(${ad.id})">🗑️ حذف</button>`;
            let dateStr = new Date(ad.date).toLocaleString('ar-EG');
            html += `<div class="ad-card" id="ad-${ad.id}"><div class="ad-header"><div class="ad-name">${escapeHtml(ad.name)}</div><div class="ad-date">${dateStr}</div></div><div class="media-container">${mainHtml}</div>${thumbs}<div class="ad-description">${escapeHtml(ad.description)}</div><div class="ad-contact"><span>${contactIcon} ${escapeHtml(ad.phone)}</span>${deleteBtn}</div><div class="ad-stats"><span>👁️ ${ad.views || 0} مشاهدة</span><span>❤️ ${ad.likes || 0} إعجاب</span></div></div>`;
        }
        container.innerHTML = html;
        // إضافة حدث النقر على المصغرات لفتح المودال
        document.querySelectorAll('.thumb-img, .thumb-video').forEach(thumb => {
            const openModal = (e) => {
                e.stopPropagation();
                let url = thumb.getAttribute('data-url');
                let type = thumb.getAttribute('data-type');
                if (url) openMediaModal(url, type);
            };
            thumb.addEventListener('click', openModal);
            thumb.addEventListener('touchstart', openModal);
        });
    }

    window.deleteAd = function(adId) {
        if (!currentUser) return alert("يجب تسجيل الدخول أولاً.");
        let allAds = JSON.parse(localStorage.getItem('marketplace_ads') || '[]');
        let i = allAds.findIndex(ad => ad.id === adId);
        if (i === -1) return alert("الإعلان غير موجود.");
        if (allAds[i].userId !== currentUser) return alert("لا يمكنك حذف إعلان ليس لك.");
        if (confirm("⚠️ هل أنت متأكد من حذف هذا الإعلان نهائياً؟")) {
            allAds.splice(i, 1);
            localStorage.setItem('marketplace_ads', JSON.stringify(allAds));
            loadAds();
            alert("✅ تم حذف الإعلان بنجاح.");
        }
    };

    renderUserBar();
    toggleBtn.onclick = toggleMyAds;
    loadAds();
    window.addEventListener('storage', e => { if (e.key === 'marketplace_ads') loadAds(); });
</script>
</body>
</html>
